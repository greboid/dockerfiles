# Discoverable root: systemd-gpt-auto mounts it, systemd.volatile=overlay makes it writable.
[Partition]
Type=root-x86-64
Label=OSIMAGE_INSTALL
ReadOnly=yes
Format=squashfs
Compression=zstd
CompressionLevel=15
CopyFiles=/rootfs-installer:/
ExcludeFilesTarget=/proc/ /sys/ /dev/ /run/ /tmp/ /out/ /boot/EFI/Linux/
Minimize=best
