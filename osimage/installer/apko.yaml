archs:
  - x86_64

contents:
  keyring:
    - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
  packages:
    - alpine-baselayout=3.7.2-r1
    - alpine-keys=2.6-r0
    - apk-tools=3.0.9-r0
    - busybox-binsh=1.37.0-r31
    - ssl_client=1.37.0-r31
    - musl=1.2.6-r3
    - libgcc=15.2.0-r5
    - musl-utils=1.2.6-r3
    - ca-certificates-bundle=20261020-r4
    - tzdata=2026f-r0
    - os-release=3.24.2-r0
    - systemd=262.1-r7
    - systemd-boot=262.1-r7
    - systemd-efistub=262.1-r7
    - bootc=1.17.4-r1
    - skopeo=1.20.1-r2
    - osimage-kernel=7.1.5-r13
    - osimage-kernel-initramfs=7.1.5-r13
    - linux-firmware-none=20260519-r0
    - osimage-config=1.0.0-r23
    - osimage-installer=1.0.0-r11
    - osimage-install=0.3.2-r0
    - systemd-repart=262.1-r7
    - dosfstools=4.2-r2
    - e2fsprogs=1.47.4-r0
    - fstrim=2.42.3-r1
    - agetty=2.42.3-r1
    - util-linux-misc=2.42.3-r1
    - findmnt=2.42.3-r1
    - lsblk=2.42.3-r1
    - sfdisk=2.42.3-r1
    - wipefs=2.42.3-r1
    - setpriv=2.42.3-r1
    - dbus=1.16.2-r4
    - tailscale=1.104.6-r0

paths:
  - path: /boot
    type: directory
    permissions: 0o755
  - path: /sysroot
    type: directory
    permissions: 0o755

accounts:
  run-as: 0
  users:
    - uid: 994
      username: messagebus
      homedir: /
      shell: /usr/bin/nologin
    - uid: 993
      gid: 993
      username: systemd-network
      homedir: /
      shell: /usr/bin/nologin
    - uid: 992
      gid: 992
      username: systemd-resolve
      homedir: /
      shell: /usr/bin/nologin
    - uid: 991
      gid: 991
      username: systemd-timesync
      homedir: /
      shell: /usr/bin/nologin
  groups:
    - gid: 994
      groupname: messagebus
    - gid: 993
      groupname: systemd-network
    - gid: 992
      groupname: systemd-resolve
    - gid: 991
      groupname: systemd-timesync
    - gid: 989
      groupname: systemd-journal
    - gid: 988
      groupname: empower
    - gid: 987
      groupname: clock
    - gid: 986
      groupname: render
    - gid: 985
      groupname: sgx

environment:
  LANG: C.UTF-8
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

annotations:
  org.opencontainers.image.title: installer
  org.opencontainers.image.vendor: Greboid
  org.opencontainers.image.description: osimage live installer (installs the published minimal image)
