package:
  name: osimage-upgrade
  version: 1.0.0
  epoch: 6
  description: osimage upgrade tooling (bootc upgrade with explicit composefs finalize)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      license: MIT
  dependencies:
    runtime:
      - busybox-binsh=1.37.0-r31
      - bootc=1.17.4-r1

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - os-release=3.24.2-r0
      - busybox=1.37.0-r31

pipeline:
  - name: Install the upgrade tool
    runs: |
      install -Dm 0755 osimage-upgrade "${{targets.destdir}}/usr/bin/osimage-upgrade"
      ln -s osimage-upgrade "${{targets.destdir}}/usr/bin/upgrade"
      install -Dm 0644 osimage-upgrade.service "${{targets.destdir}}/usr/lib/systemd/system/osimage-upgrade.service"
      install -Dm 0644 osimage-upgrade.timer "${{targets.destdir}}/usr/lib/systemd/system/osimage-upgrade.timer"
      mkdir -p "${{targets.destdir}}/etc/systemd/system/timers.target.wants"
      ln -s /usr/lib/systemd/system/osimage-upgrade.timer "${{targets.destdir}}/etc/systemd/system/timers.target.wants/osimage-upgrade.timer"

test:
  environment:
    contents:
      keyring:
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
        - bootc=1.17.4-r1
  pipeline:
    - name: Wrapper is present and boots bootc
      runs: |
        test -x /usr/bin/osimage-upgrade
        /usr/bin/osimage-upgrade --help | grep -q 'Usage: osimage-upgrade'
        /usr/bin/osimage-upgrade --help | grep -q -- '--apply'
        test "$(readlink /usr/bin/upgrade)" = osimage-upgrade
        /usr/bin/upgrade --help | grep -q 'Usage: upgrade '
        grep -q '^ExecStart=/usr/bin/osimage-upgrade --apply$' /usr/lib/systemd/system/osimage-upgrade.service
        grep -q '^OnCalendar=\*-\*-\* 04:00:00$' /usr/lib/systemd/system/osimage-upgrade.timer
        test "$(readlink /etc/systemd/system/timers.target.wants/osimage-upgrade.timer)" = /usr/lib/systemd/system/osimage-upgrade.timer

update:
  enabled: false
  exclude-reason: must move in lockstep with the pinned bootc package
