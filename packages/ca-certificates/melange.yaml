package:
  name: ca-certificates
  version: 20261020
  epoch: 2
  description: Common CA certificates PEM files from Mozilla
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: ca-certificates.license
      license: MPL-2.0 AND MIT

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r0
      - git=2.54.0-r0
      - os-release=3.24.2-r0
      - build-base=0.5-r4
      - openssl-dev=3.5.9-r0
      - perl=5.42.2-r1

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2058424fda70ee478bcce872dcf141a0c5499ee0
      repository: https://gitlab.alpinelinux.org/alpine/ca-certificates
      tag: ${{package.version}}
  - name: Build the tools and split the Mozilla certificate set
    runs: |
      make
  - name: Install the certificates and tools
    runs: |
      make install DESTDIR="${{targets.destdir}}"
  - name: Generate the certificate inclusion list
    runs: |
      {
        cd "${{targets.destdir}}"/usr/share/ca-certificates
        find . -name '*.crt' | sort | cut -b3-
      } > "${{targets.destdir}}"/etc/ca-certificates.conf
  - name: Install the rehash hook and protected paths
    runs: |
      cat > "${{targets.destdir}}"/etc/ca-certificates/update.d/certhash <<EOF
      #!/bin/sh
      exec /usr/bin/c_rehash /etc/ssl/certs
      EOF
      chmod +x "${{targets.destdir}}"/etc/ca-certificates/update.d/certhash
      mkdir -p "${{targets.destdir}}"/etc/apk/protected_paths.d
      cat > "${{targets.destdir}}"/etc/apk/protected_paths.d/ca-certificates.list <<EOF
      -etc/ssl/certs/ca-certificates.crt
      -etc/ssl/certs/ca-cert-*.pem
      -etc/ssl/certs/[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f].[r0-9]*
      EOF
  - name: Generate the PEM bundle with update-ca-certificates
    runs: |
      install -m 0644 "${{targets.destdir}}"/etc/ca-certificates.conf \
        /etc/ca-certificates.conf
      cp -a "${{targets.destdir}}"/usr/share/ca-certificates/. \
        /usr/share/ca-certificates/
      update-ca-certificates
      install -d "${{targets.destdir}}"/etc/ssl/certs
      install -m 0644 /etc/ssl/certs/ca-certificates.crt \
        "${{targets.destdir}}"/etc/ssl/certs/ca-certificates.crt
  - uses: strip
    with:
      opts: -s
  # No license file is installed: upstream ships none (the license is a
  # statement over certdata.txt and the bundled scripts) and neither the
  # previously published bundle nor Alpine's own apk contain one.

subpackages:
  - name: ca-certificates-bundle
    description: Pre generated bundle of Mozilla certificates
    pipeline:
      - name: Split the bundle out of the main package
        runs: |
          mkdir -p "${{targets.subpkgdir}}"/etc/ssl/certs
          mv "${{targets.destdir}}"/etc/ssl/certs/ca-certificates.crt \
            "${{targets.subpkgdir}}"/etc/ssl/certs/ca-certificates.crt
          ln -s certs/ca-certificates.crt \
            "${{targets.subpkgdir}}"/etc/ssl/cert.pem
          mkdir -p "${{targets.subpkgdir}}"/etc/ssl1.1
          ln -s /etc/ssl/cert.pem "${{targets.subpkgdir}}"/etc/ssl1.1/cert.pem
          ln -s /etc/ssl/certs "${{targets.subpkgdir}}"/etc/ssl1.1/certs
    test:
      environment:
        contents:
          repositories:
            - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
            - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
          packages:
            - os-release=3.24.2-r0
            - busybox
            - openssl
      pipeline:
        - uses: test/paths
          with:
            files: /etc/ssl/certs/ca-certificates.crt
            symlinks: /etc/ssl/cert.pem /etc/ssl1.1/cert.pem /etc/ssl1.1/certs
        - name: Bundle parses and contains the Mozilla root set
          runs: |
            bundle=/etc/ssl/certs/ca-certificates.crt
            count=$(grep -c 'BEGIN CERTIFICATE' "$bundle")
            echo "certificates in bundle: $count"
            [ "$count" -gt 100 ]
            openssl crl2pkcs7 -nocrl -certfile "$bundle" \
              | openssl pkcs7 -print_certs -noout | grep -q '^subject='

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox
        - openssl
        - perl
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/sbin/update-ca-certificates /usr/bin/c_rehash
        files: /etc/ca-certificates.conf
        dirs: /usr/share/ca-certificates/mozilla /etc/ssl/certs /usr/local/share/ca-certificates
    - name: Regenerates the bundle and hash symlinks
      runs: |
        rm -f /etc/ssl/certs/ca-certificates.crt
        update-ca-certificates
        count=$(grep -c 'BEGIN CERTIFICATE' /etc/ssl/certs/ca-certificates.crt)
        echo "certificates in bundle: $count"
        [ "$count" -gt 100 ]
        ls /etc/ssl/certs | grep -Eq '^[0-9a-f]{8}\.0$'

update:
  enabled: true
  release-monitor:
    identifier: 332224
