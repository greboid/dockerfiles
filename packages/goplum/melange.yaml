package:
  name: goplum
  version: 1.3.0
  epoch: 1
  description: Configurable health checker with a gRPC API
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r3
      - tzdata=2026f-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r3
      - git=2.54.0-r0
      - go=1.27.4-r0
      - go-licenses=2.0.1-r17
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 375a3821e182aea3c9a737102cd599ab9633b7a8
      repository: https://github.com/csmith/goplum
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/goplum
      output: goplum
      static: "true"
  - uses: go/licenses
    with:
      checks: chameth.com/goplum/LICENCE github.com/csmith/envflag/v2/LICENCE
      license: LICENCE
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
        - openssl=3.5.9-r0
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/goplum
        files: /notices/chameth.com/goplum/LICENCE /notices/github.com/csmith/envflag/v2/LICENCE /usr/share/licenses/goplum/LICENCE
update:
  enabled: true
  github:
    identifier: csmith/goplum
    strip-prefix: v
