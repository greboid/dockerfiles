package:
  name: githubmirror
  version: 1.0.3
  epoch: 7
  description: Mirrors GitHub repositories over HTTPS for cloning
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.27.1-r19
      - go-licenses=2.0.1-r0
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 883dbce8e28db5c6608b28dad2a5ac1b36515a09
      repository: https://github.com/greboid/githubmirror
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: githubmirror
      static: "true"
  - uses: go/licenses
    with:
      module: github.com/greboid/githubmirror
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/githubmirror
        files: /notices/github.com/greboid/githubmirror/LICENSE /usr/share/licenses/githubmirror/LICENSE
    - name: Prints usage when unconfigured
      runs: |
        /usr/bin/githubmirror >/tmp/githubmirror.log 2>&1
        test $? -eq 0
        grep -q "authtoken" /tmp/githubmirror.log
update:
  enabled: true
  github:
    identifier: greboid/githubmirror
    strip-prefix: v
