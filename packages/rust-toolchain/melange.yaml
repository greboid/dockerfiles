package:
  name: rust-toolchain
  version: 1.98.1
  epoch: 0
  description: Rust 1.98.1 minimal musl toolchain (cargo, rustc, rust-std)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      license: MIT OR Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - gcc=15.2.0-r5
      - musl-dev=1.2.6-r2
      - libgcc=15.2.0-r5

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - os-release=3.24.2-r0
      - busybox=1.37.0-r31
      - ca-certificates-bundle=20260909-r0
      - tar=1.35-r5
      - xz

pipeline:
  - uses: fetch
    with:
      uri: https://static.rust-lang.org/dist/2026-09-03/cargo-${{package.version}}-x86_64-unknown-linux-musl.tar.xz
      expected-sha256: 2bced641e198f9c4e7b129770de65cb052f2486a8f58d577792ea57c66c91b1c
      extract: false
  - uses: fetch
    with:
      uri: https://static.rust-lang.org/dist/2026-09-03/rustc-${{package.version}}-x86_64-unknown-linux-musl.tar.xz
      expected-sha256: dea916164b47437402d8041cbba90c1ff9ce859948b1ece8e36b08100ff92063
      extract: false
  - uses: fetch
    with:
      uri: https://static.rust-lang.org/dist/2026-09-03/rust-std-${{package.version}}-x86_64-unknown-linux-musl.tar.xz
      expected-sha256: bd9f35880de21dab0e387e84009c00001ae7836a4ba565cb16823f13f75f325f
      extract: false
  - name: Install the pinned minimal toolchain
    runs: |
      arch="x86_64-unknown-linux-musl"
      v="${{package.version}}"
      dest="${{targets.destdir}}/usr"
      install -d "$dest"
      # Each dist tarball nests its component under a versioned top-level
      # directory, alongside installer scaffolding; extracting just the
      # component subtree overlays the three into one prefix.
      /bin/tar -xJf "cargo-$v-$arch.tar.xz" --no-same-owner \
        --strip-components=2 --exclude='*/manifest.in' \
        --exclude='*/etc' --exclude='*/etc/*' \
        -C "$dest" "cargo-$v-$arch/cargo"
      /bin/tar -xJf "rustc-$v-$arch.tar.xz" --no-same-owner \
        --strip-components=2 --exclude='*/manifest.in' \
        -C "$dest" "rustc-$v-$arch/rustc"
      /bin/tar -xJf "rust-std-$v-$arch.tar.xz" --no-same-owner \
        --strip-components=2 --exclude='*/manifest.in' \
        -C "$dest" "rust-std-$v-$arch/rust-std-$arch"
      install -d "${{targets.destdir}}/usr/share/licenses/rust-toolchain"
      for lic in LICENSE-MIT LICENSE-APACHE COPYRIGHT; do
        /bin/tar -xJOf "rustc-$v-$arch.tar.xz" "rustc-$v-$arch/$lic" \
          > "${{targets.destdir}}/usr/share/licenses/rust-toolchain/$lic"
      done
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Check the installed toolchain
      runs: |
        fail=0
        for exe in /usr/bin/cargo /usr/bin/rustc /usr/bin/rustdoc; do
          [ -x "$exe" ] || { echo "missing executable: $exe" >&2; fail=1; }
        done
        [ -d /usr/lib/rustlib/x86_64-unknown-linux-musl/lib ] || {
          echo "missing: /usr/lib/rustlib/x86_64-unknown-linux-musl/lib" >&2; fail=1
        }
        for lic in LICENSE-MIT LICENSE-APACHE COPYRIGHT; do
          [ -s "/usr/share/licenses/rust-toolchain/$lic" ] || {
            echo "missing license: $lic" >&2; fail=1
          }
        done
        exit $fail
update:
  enabled: true
  manual: true
  github:
    identifier: rust-lang/rust
