package:
  name: grafana
  version: 13.3.1
  epoch: 0
  description: Observability and data visualization platform (server + embedded web)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - go-licenses=2.0.1-r18
      - nodejs=24.22.3-r0
      - npm=11.12.1-r0
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5db6ba887630c7fa12e5bfd063f2fa854025468c
      repository: https://github.com/grafana/grafana
      tag: v${{package.version}}
  - name: Install frontend dependencies
    runs: |
      # Grafana ships yarn 4 itself (.yarn/releases); scripts are disabled in
      # .yarnrc.yml so no postinstall builds run.
      node "$(sed -n 's/^yarnPath: //p' .yarnrc.yml)" install --immutable
  - name: Build frontend
    runs: |
      # Unminified, no source maps, capped heap to fit the runner's memory.
      NODE_ENV=production NO_SOURCEMAP=1 NODE_OPTIONS=--max-old-space-size=4096 \
        node_modules/.bin/rspack build \
        --config scripts/rspack/rspack.prod.ts --env noMinify=1
  - uses: go/build
    with:
      packages: ./pkg/cmd/grafana
      output: grafana
      static: "true"
      ldflags: -X main.version=${{package.version}} -X main.commit=5db6ba887630c7fa12e5bfd063f2fa854025468c -X main.buildBranch=main
  - name: Install frontend and default config
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/grafana"
      cp -a public "${{targets.destdir}}/usr/share/grafana/public"
      cp -a conf "${{targets.destdir}}/usr/share/grafana/conf"
  - uses: go/licenses
    with:
      module: github.com/grafana/grafana
      license: LICENSE

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/grafana
        files: /notices/github.com/grafana/grafana/LICENSE /usr/share/licenses/grafana/LICENSE /usr/share/grafana/conf/defaults.ini
        dirs: /usr/share/grafana/public
    - name: Prints version
      runs: |
        /usr/bin/grafana -v 2>&1 | grep -q "${{package.version}}"

update:
  enabled: true
  github:
    identifier: grafana/grafana
    strip-prefix: v
    use-tag: true
