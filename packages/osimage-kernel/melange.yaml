package:
  name: osimage-kernel
  version: 7.1.5
  epoch: 7
  description: Alpine linux-stable kernel repacked into the bootc /usr/lib/modules layout
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      license: GPL-2.0-only
  dependencies:
    runtime:
      - kmod=34.2-r1
      - linux-firmware-any
      - osimage-kernel-initramfs=${{package.version}}-r${{package.epoch}}

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - os-release=3.24.2-r0
      - busybox=1.37.0-r31
      - bash=5.3.9-r1
      - kmod=34.2-r1
      # initramfs generator and payload tooling for the dracut runs; the
      # org packages (dracut, bootc, systemd) resolve through the org
      # repository appended by the shared CI workflow
      - dracut=111-r2
      - bootc=1.17.3-r2
      # /usr/lib/composefs/setup-root-conf.toml must exist in the build
      # root: the bootc dracut module embeds it into the initramfs (the
      # initramfs reads it from its own filesystem before pivot). Without
      # it initramfs-setup falls back to its defaults, which bind-mount
      # /etc read-write instead of keeping it sealed in the composefs
      # image ([etc] mount = "none"). Must move in lockstep with the
      # image's osimage-config pin.
      - osimage-config=1.0.0-r14
      - systemd=262.1-r1
      - lsblk=2.42.3-r1
      - device-mapper=2.03.35-r3
      # util-linux blkid: dracut's dmsquash-live and udev-rules modules
      # inst_multiple it, so the binary AND libblkid.so.1 land in the
      # initramfs; systemd-udevd's blkid builtin dlopens libblkid at
      # runtime (busybox blkid is static and dracut would ship no lib,
      # breaking ID_FS_LABEL detection of the installer media)
      - blkid=2.42.3-r1
      # kernel source content; must move in lockstep with package.version
      # (linux-stable lives in the Alpine community repository)
      - linux-stable=7.1.5-r0
      # satisfy linux-lts' virtual dependencies inside the build
      # environment (nothing of them is shipped or used at runtime)
      - mkinitfs=3.14.1-r0
      - linux-firmware-none=20260519-r0

pipeline:
  - name: Relocate the kernel into the bootc /usr/lib/modules layout
    runs: |
      kver=$(ls /lib/modules | head -1)
      test -n "$kver"
      install -d "${{targets.destdir}}/usr/lib/modules/$kver"
      cp -a "/lib/modules/$kver/." "${{targets.destdir}}/usr/lib/modules/$kver/"
      # Alpine ships the bootable kernel image in /boot (linux-lts adds a
      # symlink in the modules dir, linux-stable does not); place the real
      # kernel at the bootc canonical location and ship no /boot content.
      rm -f "${{targets.destdir}}/usr/lib/modules/$kver/vmlinuz"
      flavor="${kver##*-}"
      install -m 0644 "/boot/vmlinuz-$flavor" "${{targets.destdir}}/usr/lib/modules/$kver/vmlinuz"
      # The kernel is booted as a UKI (systemd-stub), so it must be an
      # EFI-capable PE executable (MZ magic).
      [ "$(head -c 2 "${{targets.destdir}}/usr/lib/modules/$kver/vmlinuz")" = MZ ] || {
        echo "osimage-kernel: vmlinuz lacks MZ magic; not EFI-bootable" >&2
        exit 1
      }
      # Alpine's kmod is non-usrmerged: module autoload only searches
      # /lib/modules, so link the canonical location into place.
      install -d "${{targets.destdir}}/lib"
      ln -s ../usr/lib/modules "${{targets.destdir}}/lib/modules"

  - name: Install the osimage dracut modules and bootc initramfs config
    runs: |
      cp -a dracut/90bootc-remount /usr/lib/dracut/modules.d/90bootc-remount
      cp -a dracut/90bootc-gptroot /usr/lib/dracut/modules.d/90bootc-gptroot
      mkdir -p /usr/lib/dracut.conf.d
      cat > /usr/lib/dracut.conf.d/10-bootc.conf <<'DRACUTCONF'
      # Generic (server-side build) initramfs with the bootc composefs
      # module. Networking happens in the real root via systemd-networkd,
      # so the initramfs networking modules (and their eudev/nbd
      # dependency chain) are omitted.
      hostonly=no
      add_dracutmodules+=" bootc bootc-remount bootc-gptroot "
      omit_dracutmodules+=" network network-legacy nbd "
      DRACUTCONF

subpackages:
  - name: osimage-kernel-initramfs
    description: Prebuilt bootc composefs initramfs for osimage-kernel
    dependencies:
      runtime:
        - osimage-kernel=${{package.version}}-r${{package.epoch}}
    pipeline:
      - name: Generate the composefs initramfs
        runs: |
          kver=$(ls /lib/modules | head -1)
          install -d "${{targets.subpkgdir}}/usr/lib/modules/$kver"
          dracut --force --no-hostonly --tmpdir /tmp \
            --kmoddir "/lib/modules/$kver" \
            --add " bootc bootc-remount " \
            "${{targets.subpkgdir}}/usr/lib/modules/$kver/initramfs.img" "$kver"
          test -s "${{targets.subpkgdir}}/usr/lib/modules/$kver/initramfs.img"
  - name: osimage-kernel-initramfs-live
    description: Prebuilt dmsquash-live installer initramfs for osimage-kernel
    dependencies:
      runtime:
        - osimage-kernel=${{package.version}}-r${{package.epoch}}
    pipeline:
      - name: Generate the dmsquash-live installer initramfs
        runs: |
          kver=$(ls /lib/modules | head -1)
          install -d "${{targets.subpkgdir}}/usr/lib/modules/$kver"
          dracut --force --no-hostonly --tmpdir /tmp \
            --kmoddir "/lib/modules/$kver" \
            -m " base kernel-modules dmsquash-live bootc-remount " \
            "${{targets.subpkgdir}}/usr/lib/modules/$kver/initramfs-install.img" "$kver"
          test -s "${{targets.subpkgdir}}/usr/lib/modules/$kver/initramfs-install.img"

test:
  environment:
    contents:
      keyring:
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
        - kmod=34.2-r1
        - dracut=111-r2
        - linux-firmware-none=20260519-r0
        - osimage-kernel-initramfs-live
  pipeline:
    - name: Kernel content is in the bootc canonical layout
      runs: |
        kver=$(ls /usr/lib/modules | head -1)
        test -s "/usr/lib/modules/$kver/vmlinuz"
        test -f "/usr/lib/modules/$kver/kernel-suffix"
        test -s "/usr/lib/modules/$kver/modules.dep"
        test -d "/usr/lib/modules/$kver/kernel"
        test "$(readlink /lib/modules)" = "../usr/lib/modules"
    - name: Initramfs subpackages carry the bootc payload
      runs: |
        kver=$(ls /usr/lib/modules | head -1)
        test -s "/usr/lib/modules/$kver/initramfs.img"
        test -s "/usr/lib/modules/$kver/initramfs-install.img"
        lsinitrd "/usr/lib/modules/$kver/initramfs.img" > /tmp/boot-contents
        lsinitrd "/usr/lib/modules/$kver/initramfs-install.img" > /tmp/live-contents
        # udevd's blkid builtin dlopens libblkid at runtime; without it no
        # ID_FS_LABEL is ever set and dmsquash-live cannot find the media
        grep -q libblkid.so.1 /tmp/live-contents
        grep -q sbin/blkid /tmp/live-contents
        grep -q usr/lib/bootc/initramfs-setup /tmp/boot-contents
        # the composefs mount config ([etc] mount = "none" keeps /etc
        # sealed) must be embedded; without it initramfs-setup defaults
        # to rw /etc + rw /var binds
        grep -q usr/lib/composefs/setup-root-conf.toml /tmp/boot-contents
        grep -q composefs-setup.sh /tmp/boot-contents
        grep -q remount-root.sh /tmp/boot-contents
        # host UKIs resolve root=gpt-auto through the hardened GPT-root
        # hook; it must be in the sealed initramfs
        grep -q gptroot-mount.sh /tmp/boot-contents
        grep -q parse-gptroot.sh /tmp/boot-contents
        grep -q sbin/dmsquash-live-root /tmp/live-contents
        grep -q sbin/dmsetup /tmp/live-contents

# The /lib/modules -> ../usr/lib/modules symlink is deliberate: Alpine's
# kmod is non-usrmerged and only autoloads from /lib/modules. The linter
# override lives in lint.args (--lint-warn usrmerge), consumed by the
# shared CI workflow.

update:
  enabled: false
  exclude-reason: must move in lockstep with the Alpine linux-lts pin and the osimage image pins
