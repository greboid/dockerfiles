package:
  name: osimage-kernel
  version: 7.1.5
  epoch: 11
  description: Alpine linux-stable kernel repacked into the bootc /usr/lib/modules layout, trimmed for headless servers
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      license: GPL-2.0-only
  dependencies:
    runtime:
      - kmod=34.2-r1
      - linux-firmware-any
      - osimage-kernel-initramfs=${{package.version}}-r${{package.epoch}}

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - os-release=3.24.2-r0
      - busybox=1.37.0-r31
      - bash=5.3.9-r1
      - kmod=34.2-r1
      - dracut=111-r2
      - bootc=1.17.3-r2
      - osimage-config=1.0.0-r16
      - systemd=262.1-r5
      - lsblk=2.42.3-r1
      - device-mapper=2.03.35-r3
      - blkid=2.42.3-r1
      - linux-stable=7.1.5-r0
      - mkinitfs=3.14.1-r0
      - linux-firmware-none=20260519-r0

pipeline:
  - name: Relocate the kernel into the bootc /usr/lib/modules layout
    runs: |
      kver=$(ls /lib/modules | head -1)
      test -n "$kver"
      install -d "${{targets.destdir}}/usr/lib/modules/$kver"
      cp -a "/lib/modules/$kver/." "${{targets.destdir}}/usr/lib/modules/$kver/"
      rm -f "${{targets.destdir}}/usr/lib/modules/$kver/vmlinuz"
      flavor="${kver##*-}"
      install -m 0644 "/boot/vmlinuz-$flavor" "${{targets.destdir}}/usr/lib/modules/$kver/vmlinuz"
      [ "$(head -c 2 "${{targets.destdir}}/usr/lib/modules/$kver/vmlinuz")" = MZ ] || {
        echo "osimage-kernel: vmlinuz lacks MZ magic; not EFI-bootable" >&2
        exit 1
      }
      install -d "${{targets.destdir}}/lib"
      ln -s ../usr/lib/modules "${{targets.destdir}}/lib/modules"
      moddir="${{targets.destdir}}/usr/lib/modules/$kver"
      rm -rf "$moddir/kernel/sound" "$moddir/kernel/drivers/gpu" \
        "$moddir/kernel/drivers/media" \
        "$moddir/kernel/drivers/net/wireless" "$moddir/kernel/net/wireless" \
        "$moddir/kernel/drivers/infiniband" "$moddir/kernel/drivers/iio" \
        "$moddir/kernel/drivers/mtd" "$moddir/kernel/drivers/staging" \
        "$moddir/kernel/net/bluetooth" "$moddir/kernel/drivers/bluetooth" \
        "$moddir/kernel/net/sctp" "$moddir/kernel/net/tipc" \
        "$moddir/kernel/net/rds" "$moddir/kernel/net/phonet" \
        "$moddir/kernel/net/x25" "$moddir/kernel/net/6lowpan" \
        "$moddir/kernel/net/9p" "$moddir/kernel/net/rxrpc" \
        "$moddir/kernel/net/sunrpc" "$moddir/kernel/net/ceph" \
        "$moddir/kernel/fs/xfs" "$moddir/kernel/fs/btrfs" \
        "$moddir/kernel/fs/smb" "$moddir/kernel/fs/ocfs2" \
        "$moddir/kernel/fs/nfs" "$moddir/kernel/fs/nfsd" \
        "$moddir/kernel/fs/lockd" "$moddir/kernel/fs/netfs" \
        "$moddir/kernel/fs/ceph" "$moddir/kernel/fs/9p" \
        "$moddir/kernel/fs/jfs" "$moddir/kernel/fs/hfs" \
        "$moddir/kernel/fs/hfsplus" "$moddir/kernel/fs/hpfs" \
        "$moddir/kernel/fs/ufs" "$moddir/kernel/fs/minix" \
        "$moddir/kernel/fs/romfs" "$moddir/kernel/fs/efs" \
        "$moddir/kernel/fs/ecryptfs" "$moddir/kernel/fs/omfs" \
        "$moddir/kernel/fs/orangefs" "$moddir/kernel/fs/coda" \
        "$moddir/kernel/fs/vboxsf" \
        "$moddir/kernel/fs/cramfs" "$moddir/kernel/fs/ubifs" \
        "$moddir/kernel/fs/jffs2"
      depmod -b "${{targets.destdir}}" "$kver"

  - name: Install the osimage dracut modules and bootc initramfs config
    runs: |
      cp -a dracut/90bootc-remount /usr/lib/dracut/modules.d/90bootc-remount
      cp -a dracut/90bootc-gptroot /usr/lib/dracut/modules.d/90bootc-gptroot
      cp -a dracut/90osimage-state /usr/lib/dracut/modules.d/90osimage-state
      mkdir -p /usr/lib/dracut.conf.d
      cat > /usr/lib/dracut.conf.d/10-bootc.conf <<'DRACUTCONF'
      hostonly=no
      add_dracutmodules+=" bootc bootc-remount bootc-gptroot osimage-state "
      omit_dracutmodules+=" network network-legacy nbd "
      DRACUTCONF

subpackages:
  - name: osimage-kernel-initramfs
    description: Prebuilt bootc composefs initramfs for osimage-kernel
    dependencies:
      runtime:
        - osimage-kernel=${{package.version}}-r${{package.epoch}}
    pipeline:
      - name: Generate the composefs initramfs
        runs: |
          kver=$(ls /lib/modules | head -1)
          install -d "${{targets.subpkgdir}}/usr/lib/modules/$kver"
          dracut --force --no-hostonly --tmpdir /tmp \
            --kmoddir "${{targets.destdir}}/usr/lib/modules/$kver" \
            --add " bootc bootc-remount osimage-state " \
            "${{targets.subpkgdir}}/usr/lib/modules/$kver/initramfs.img" "$kver"
          test -s "${{targets.subpkgdir}}/usr/lib/modules/$kver/initramfs.img"
  - name: osimage-kernel-initramfs-live
    description: Prebuilt dmsquash-live installer initramfs for osimage-kernel
    dependencies:
      runtime:
        - osimage-kernel=${{package.version}}-r${{package.epoch}}
    pipeline:
      - name: Generate the dmsquash-live installer initramfs
        runs: |
          kver=$(ls /lib/modules | head -1)
          install -d "${{targets.subpkgdir}}/usr/lib/modules/$kver"
          dracut --force --no-hostonly --tmpdir /tmp \
            --kmoddir "${{targets.destdir}}/usr/lib/modules/$kver" \
            -m " base kernel-modules dmsquash-live bootc-remount osimage-state " \
            "${{targets.subpkgdir}}/usr/lib/modules/$kver/initramfs-install.img" "$kver"
          test -s "${{targets.subpkgdir}}/usr/lib/modules/$kver/initramfs-install.img"

test:
  environment:
    contents:
      keyring:
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
        - kmod=34.2-r1
        - dracut=111-r2
        - linux-firmware-none=20260519-r0
        - osimage-kernel-initramfs-live
  pipeline:
    - name: Kernel content is in the bootc canonical layout
      runs: |
        kver=$(ls /usr/lib/modules | head -1)
        test -s "/usr/lib/modules/$kver/vmlinuz"
        test -f "/usr/lib/modules/$kver/kernel-suffix"
        test -s "/usr/lib/modules/$kver/modules.dep"
        test -d "/usr/lib/modules/$kver/kernel"
        test "$(readlink /lib/modules)" = "../usr/lib/modules"
    - name: Headless-server trim applied and metadata consistent
      runs: |
        kver=$(ls /usr/lib/modules | head -1)
        for d in kernel/sound kernel/drivers/gpu kernel/drivers/media \
          kernel/drivers/net/wireless kernel/net/wireless \
          kernel/drivers/infiniband kernel/drivers/iio kernel/drivers/mtd \
          kernel/drivers/staging kernel/net/bluetooth kernel/net/sctp \
          kernel/net/sunrpc kernel/fs/xfs kernel/fs/btrfs kernel/fs/smb \
          kernel/fs/nfs kernel/fs/ocfs2 kernel/fs/ceph; do
          test ! -e "/usr/lib/modules/$kver/$d" || {
            echo "untrimmed module subtree: $d" >&2; exit 1; }
        done
        # one modules.dep line per shipped module: metadata regenerated
        # for the reduced tree, not left over from Alpine's full tree
        nk=$(find "/usr/lib/modules/$kver/kernel" -name '*.ko.gz' | wc -l)
        nd=$(grep -c '\.ko' "/usr/lib/modules/$kver/modules.dep")
        test "$nk" = "$nd" || {
          echo "modules.dep ($nd lines) does not match $nk modules" >&2
          exit 1
        }
        # a representative kept driver must still be resolvable
        modprobe -d / -S "$kver" --show-depends virtio_net >/dev/null
    - name: Initramfs subpackages carry the bootc payload
      runs: |
        kver=$(ls /usr/lib/modules | head -1)
        test -s "/usr/lib/modules/$kver/initramfs.img"
        test -s "/usr/lib/modules/$kver/initramfs-install.img"
        lsinitrd "/usr/lib/modules/$kver/initramfs.img" > /tmp/boot-contents
        lsinitrd "/usr/lib/modules/$kver/initramfs-install.img" > /tmp/live-contents
        grep -q libblkid.so.1 /tmp/live-contents
        grep -q sbin/blkid /tmp/live-contents
        grep -q usr/lib/bootc/initramfs-setup /tmp/boot-contents
        grep -q usr/lib/composefs/setup-root-conf.toml /tmp/boot-contents
        grep -q composefs-setup.sh /tmp/boot-contents
        grep -q remount-root.sh /tmp/boot-contents
        grep -q gptroot-mount.sh /tmp/boot-contents
        grep -q parse-gptroot.sh /tmp/boot-contents
        grep -q etc-state.sh /tmp/boot-contents
        grep -q etc-state.sh /tmp/live-contents
        for img in initramfs.img initramfs-install.img; do
          hook=$(lsinitrd -f var/lib/dracut/hooks/pre-pivot/70-etc-state.sh "/usr/lib/modules/$kver/$img")
          echo "$hook" | grep -q 'mount -o remount,bind,ro'
          echo "$hook" | grep -q 'new_machine_id >'
          # later images' accounts are appended to the per-machine shadow
          echo "$hook" | grep -q '!($1 in seen)'
        done
        grep -q sbin/dmsquash-live-root /tmp/live-contents
        grep -q sbin/dmsetup /tmp/live-contents

update:
  enabled: false
  exclude-reason: must move in lockstep with the Alpine linux-lts pin and the osimage image pins
