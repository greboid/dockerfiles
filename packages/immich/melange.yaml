package:
  name: immich
  version: 3.2.0
  epoch: 4
  description: Self-hosted photo and video management (server + embedded web)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: AGPL-3.0-only
  dependencies:
    runtime:
      - nodejs=24.18.1-r0
      - jellyfin-ffmpeg=7.1.3_p5-r0
      - perl=5.42.2-r1
      - coreutils=9.11-r0
      - coreutils-env=9.11-r0
      - icu-data-full=78.1-r0
      - libvips=8.18.6-r3
      - libheif-jpeg=1.23.4-r0
      - libheif-openjpeg=1.23.4-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - os-release=3.24.2-r0
      - bash=5.3.9-r1
      - nodejs=24.18.1-r0
      - npm=11.12.1-r0
      - curl=8.22.0-r0
      - libvips=8.18.6-r3
      - cgif-dev=0.5.4-r0
      - expat-dev=2.8.5-r0
      - glib-dev=2.88.1-r1
      - highway-dev=1.3.0-r0
      - lcms2-dev=2.19-r0
      - libexif-dev=0.6.26-r0
      - libheif-dev=1.23.4-r0
      - libjpeg-turbo-dev=3.1.3-r0
      - libpng-dev=1.6.59-r0
      - libwebp-dev=1.6.0-r0
      - tiff-dev=4.7.2-r0
      - zlib-dev=1.3.2-r1
      - build-base=0.5-r4
      - make=4.4.1-r4
      - pkgconf=2.5.1-r0
      - python3=3.14.8-r0
      - tzdata=2026e-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1b6098c9dbfffe978bec2d414606ed7a4c8e019a
      repository: https://github.com/immich-app/immich
      tag: v${{package.version}}
  - uses: pnpm/install
  - uses: pnpm/build
    with:
      filters: "@immich/sdk @immich/plugin-sdk immich immich-web"
  - name: Deploy the server and source-build sharp
    runs: |
      pnpm --filter immich --prod --no-optional deploy /home/build/out/server
      find out/server/node_modules -name binding.gyp -path '*sharp*' \
        -exec sed -i 's/-flto=auto//' {} +
      cd out/server/node_modules/sharp
      npx node-gyp configure --directory=src
      sed -i 's/ -flto=4 -ffat-lto-objects//' src/build/*.mk
      npx node-gyp build --directory=src
      cd /home/build
      find /home/build/out/server/node_modules -name '*.glibc.node' -delete
      find /home/build/out/server/node_modules -type d \( \
        -path '*/prebuilds/android-*' -o -path '*/prebuilds/ios-*' -o \
        -path '*/prebuilds/darwin-*' -o -path '*/prebuilds/win32-*' -o \
        -path '*bare-fs*/prebuilds' -o -path '*bare-path*/prebuilds' -o \
        -path '*bare-url*/prebuilds' \) -exec rm -rf {} +
      if [ -d server/resources ]; then cp -a server/resources /home/build/out/server/; fi
  - name: Fetch the reverse-geocoding datasets
    runs: |
      mkdir -p geodata && cd geodata
      curl -sfL --retry 3 -o cities500.zip https://download.geonames.org/export/dump/cities500.zip
      curl -sfL --retry 3 -o admin1CodesASCII.txt https://download.geonames.org/export/dump/admin1CodesASCII.txt
      curl -sfL --retry 3 -o admin2Codes.txt https://download.geonames.org/export/dump/admin2Codes.txt
      curl -sfL --retry 3 -o countryInfo.txt https://download.geonames.org/export/dump/countryInfo.txt
      curl -sfL --retry 3 -o ne_10m_admin_0_countries.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_0_countries.geojson
      echo "239eec57ac17f100a11e2536cffc56752c318b50ae765b0918ff7aab4ce8f255  ne_10m_admin_0_countries.geojson" | sha256sum -c -
      # geonames regenerates these files, so exact hashes go stale; verify
      # structure instead of content.
      unzip -t cities500.zip
      [ "$(unzip -p cities500.zip cities500.txt | wc -l)" -gt 200000 ]
      [ "$(wc -l < admin1CodesASCII.txt)" -gt 3000 ]
      [ "$(wc -l < admin2Codes.txt)" -gt 30000 ]
      [ "$(grep -c '^[^#]' countryInfo.txt)" -gt 200 ]
      unzip -o cities500.zip
      rm cities500.zip
      chmod 444 *
      date -u -d "@${SOURCE_DATE_EPOCH:-0}" +"%Y-%m-%dT%H:%M:%S+00:00" \
        | tr -d "\n" > geodata-date.txt
  - name: Stage the package
    runs: |
      mkdir -p "${{targets.destdir}}/usr/src/app" "${{targets.destdir}}/usr/bin"
      cp -a /home/build/out/server "${{targets.destdir}}/usr/src/app/server"
      cp -a web/build "${{targets.destdir}}/usr/src/app/www"
      cp -a geodata "${{targets.destdir}}/usr/src/app/geodata"
      install -d -m 0755 "${{targets.destdir}}/usr/src/app/upload"
      ln -sf ../lib/jellyfin-ffmpeg/ffmpeg "${{targets.destdir}}/usr/bin/ffmpeg"
      ln -sf ../lib/jellyfin-ffmpeg/ffprobe "${{targets.destdir}}/usr/bin/ffprobe"
  - uses: go/licenses
    with:
      save: "false"
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox
        - curl
        - libheif-tools=1.23.4-r0
        - libheif-x265=1.23.4-r0
  pipeline:
    - uses: test/paths
      with:
        files: /usr/src/app/server/dist/main.js /usr/src/app/geodata/cities500.txt /usr/share/licenses/immich/LICENSE
        dirs: /usr/src/app/server/node_modules/sharp /usr/src/app/www
        symlinks: /usr/bin/ffmpeg /usr/bin/ffprobe
    - name: Decodes HEIC through the source-built sharp
      runs: |
        ffmpeg -loglevel error -f lavfi -i color=c=black:s=64x64 -frames:v 1 -y /tmp/smoke.png
        heif-enc -q 60 -o /tmp/smoke.heic /tmp/smoke.png
        node -e 'require("/usr/src/app/server/node_modules/sharp")("/tmp/smoke.heic").resize(32).jpeg().toBuffer().then((b) => { if (b.length === 0) { throw new Error("empty jpeg"); } console.log("HEIC smoke test ok"); });' | grep -q "HEIC smoke test ok"
    - name: Transcodes with nice and the tonemapx filter
      runs: |
        # Immich hardcodes fluent-ffmpeg niceness 10 (nice must resolve) and
        # HDR thumbnails require jellyfin's tonemapx filter — the two
        # runtime quirks that motivated the legacy image's tooling.
        nice -n 10 true
        ffmpeg -loglevel error -f lavfi -i testsrc2=s=256x144:r=5 -t 1 -pix_fmt p010le -c:v libx265 -x265-params lossless=1 -color_primaries bt2020 -color_trc smpte2084 -colorspace bt2020nc -y /tmp/smoke-hdr.mp4
        ffmpeg -loglevel error -i /tmp/smoke-hdr.mp4 -vf 'tonemapx=tonemap=hable:desat=0:p=bt709:t=bt709:m=bt709:r=pc:peak=100:format=yuv420p' -frames:v 1 -y /tmp/smoke-tonemap.jpg
        test -s /tmp/smoke-tonemap.jpg
update:
  enabled: true
  github:
    identifier: immich-app/immich
    strip-prefix: v
