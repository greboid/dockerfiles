package:
  name: postgres-18
  version: 18.6
  epoch: 4
  description: PostgreSQL 18 database server
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: COPYRIGHT
      license: PostgreSQL
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r2
      - tzdata=2026e-r0
      - icu-data=78.1-r0
      - icu-libs=78.1-r0
      - libcrypto3=3.5.9-r0
      - libssl3=3.5.9-r0
      - zlib=1.3.2-r1
      - lz4-libs=1.10.0-r1
      - readline=8.3.3-r1
      - ncurses-libs=6.6_p20260516-r0
      - libuuid=2.42.3-r1
      - musl-locales=0.1.0-r1

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r2
      - git=2.54.0-r0
      - os-release=3.24.2-r0
      - gcc=15.2.0-r5
      - make=4.4.1-r4
      - musl-dev=1.2.6-r3
      - linux-headers=7.0.0-r1
      - bison=3.8.2-r3
      - flex=2.6.4-r8
      - icu-dev=78.1-r0
      - openssl-dev=3.5.9-r0
      - readline-dev=8.3.3-r1
      - util-linux-dev=2.42.3-r1
      - zlib-dev=1.3.2-r1
      - perl=5.42.2-r1

vars:
  runtime-dirs: /var/lib/postgresql/data
  world-writable-dirs: /tmp

pipeline:
  - uses: fetch
    with:
      uri: https://ftp.postgresql.org/pub/source/v${{package.version}}/postgresql-${{package.version}}.tar.bz2
      expected-sha256: 555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f
      strip-components: 1
  - uses: autoconf/configure
    with:
      opts: --with-system-tzdata=/usr/share/zoneinfo --with-ssl=openssl --with-uuid=e2fs
  - uses: autoconf/make
    with:
      targets: world-bin
  - uses: autoconf/make-install
    with:
      targets: install-world-bin
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
      mode: "0750"
  - uses: dirs
    with:
      dirs: ${{vars.world-writable-dirs}}
      mode: "1777"
  - name: Install the entrypoint
    runs: install -Dm 0755 entry.sh "${{targets.destdir}}/usr/bin/entry.sh"
  - uses: license/install
    with:
      license: COPYRIGHT
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
        - icu-data=78.1-r0
        - icu-libs=78.1-r0
        - libcrypto3=3.5.9-r0
        - libssl3=3.5.9-r0
        - zlib=1.3.2-r1
        - lz4-libs=1.10.0-r1
        - readline=8.3.3-r1
        - ncurses-libs=6.6_p20260516-r0
        - libuuid=2.42.3-r1
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/postgres /usr/bin/psql /usr/bin/entry.sh
        files: /usr/share/licenses/postgres-18/COPYRIGHT
        dirs: ${{vars.runtime-dirs}} ${{vars.world-writable-dirs}}
update:
  enabled: true
  release-monitor:
    identifier: 5601
    version-filter-prefix: "18."
