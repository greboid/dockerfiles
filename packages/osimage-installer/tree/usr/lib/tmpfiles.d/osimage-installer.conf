# Installer motd: the live root is read-write (dmsquash-live overlay or
# plain-root fallback), so this runs at boot and replaces the Alpine
# default before any login. The main image keeps the stock motd and
# must not ship this: its /etc is sealed read-only.
f+ /etc/motd 0644 root root - osimage installer

  install:  osimage-install /dev/<disk>
  target:   the published osimage image, pulled from the container
            registry (network access required)
  console:  serial (ttyS0, 115200) or tty1, root, no password
