# Installer motd: the live root is read-write (dmsquash-live overlay or
# plain-root fallback), so this runs at boot and replaces the Alpine
# default before any login. The main image keeps the stock motd and
# must not ship this: its /etc is sealed read-only. The content must
# stay on one line: every physical line of a tmpfiles.d file is parsed
# as a directive, so newlines are spelled \n (C-style escapes are
# expanded in the argument field).
f+ /etc/motd 0644 root root - osimage installer\n\n  install:  osimage-install /dev/<disk>\n  target:   the published osimage image, pulled from the container registry (network access required)\n  console:  serial (ttyS0, 115200) or tty1, root, no password\n
