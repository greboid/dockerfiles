package:
  name: forgejo-runner
  version: 13.2.2
  epoch: 2
  description: Forgejo Actions runner
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: GPL-3.0-or-later
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0
      - secret-env=0.2.0-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - os-release=3.24.2-r0
      - make=4.4.1-r4
  environment:
    CGO_ENABLED: "0"

vars:
  runtime-dirs: /data /usr/share/forgejo-runner

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0e61343d1cb98d2a381d0d18f34aea408e66e4d2
      repository: https://code.forgejo.org/forgejo/runner
      tag: v${{package.version}}
  - name: Build the runner
    runs: |
      make build VERSION="${{package.version}}"
      install -Dm755 forgejo-runner "${{targets.destdir}}/usr/bin/forgejo-runner"
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
  - name: Install the private storage configuration
    runs: install -Dm644 storage.conf "${{targets.destdir}}/usr/share/forgejo-runner/storage.conf"
  - uses: license/install
  - uses: go/credits
  - uses: secret-env/wrap
    with:
      name: forgejo-runner
      config: secret-env/forgejo-runner.conf
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/forgejo-runner
        files: /usr/share/forgejo-runner/storage.conf /usr/share/licenses/forgejo-runner/LICENSE /usr/share/licenses/forgejo-runner/CREDITS
        dirs: ${{vars.runtime-dirs}}
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/forgejo-runner)" = /usr/bin/secret-env
        test -x /usr/libexec/forgejo-runner.real
        grep -qx 'path = /usr/libexec/forgejo-runner.real' /etc/secret-env/forgejo-runner.conf
update:
  enabled: true
  forgejo:
    instance: https://code.forgejo.org
    identifier: forgejo/runner
    strip-prefix: v
