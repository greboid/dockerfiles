package:
  name: irc-adze
  version: 1.0.1
  epoch: 0
  description: irc-bot plugin relaying Adze webhooks to IRC
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r2
      - tzdata=2026e-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r2
      - git=2.54.0-r0
      - go=1.27.3-r2
      - go-licenses=2.0.1-r14
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8d87de723d5abeddc8038002ed536397ff48f33a
      repository: https://github.com/csmith/irc-adze
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/adze
      output: irc-adze
      static: "true"
  - uses: go/licenses
    with:
      checks: chameth.com/irc-adze/LICENCE github.com/csmith/envflag/v2/LICENCE github.com/csmith/slogflags/LICENCE github.com/greboid/irc-bot/v5/LICENSE
      license: LICENCE
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/irc-adze
        files: /notices/chameth.com/irc-adze/LICENCE /notices/github.com/csmith/envflag/v2/LICENCE /notices/github.com/csmith/slogflags/LICENCE /notices/github.com/greboid/irc-bot/v5/LICENSE /usr/share/licenses/irc-adze/LICENCE
    - name: Prints usage when invoked with -h
      runs: |
        out=$(/usr/bin/irc-adze -h 2>&1)
        echo "$out" | grep -q "rpc-host"
update:
  enabled: true
  github:
    identifier: csmith/irc-adze
    strip-prefix: v
