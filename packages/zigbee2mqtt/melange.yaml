package:
  name: zigbee2mqtt
  version: 2.14.2
  epoch: 0
  description: Zigbee to MQTT bridge using zigbee-herdsman
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: GPL-3.0-only
  dependencies:
    runtime:
      - nodejs=24.22.1-r0
      - ca-certificates-bundle=20261020-r2
      - tzdata=2026e-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r2
      - git=2.54.0-r0
      - os-release=3.24.2-r0
      - nodejs=24.22.1-r0
      - npm=11.12.1-r0
      - python3=3.14.8-r0
      - g++=15.2.0-r5
      - make=4.4.1-r4
      - linux-headers=7.0.0-r1

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5c0c1c60078e1737c5dee5f8217583bca7610e66
      repository: https://github.com/Koenkk/zigbee2mqtt
      tag: ${{package.version}}
  - uses: pnpm/install
  - uses: pnpm/build
    with:
      filters: zigbee2mqtt
  - name: Rebuild serialport against musl
    runs: |
      # Match the upstream Dockerfile: drop the prebuilt glibc bindings and
      # compile @serialport/bindings-cpp on this platform instead.
      find node_modules/.pnpm -maxdepth 5 -type d -path '*@serialport/bindings-cpp*/prebuilds' -exec rm -rf {} + 2>/dev/null || true
      pnpm rebuild @serialport/bindings-cpp
  - name: Prune to production dependencies
    runs: |
      pnpm install --frozen-lockfile --prod --no-optional
  - name: Stage the package
    runs: |
      mkdir -p "${{targets.destdir}}/usr/src/app/data" "${{targets.destdir}}/usr/bin"
      cp -a dist node_modules package.json index.js cli.js "${{targets.destdir}}/usr/src/app/"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/src/app/LICENSE"
      install -Dm644 data/configuration.example.yaml "${{targets.destdir}}/usr/src/app/data/configuration.example.yaml"
      ln -sf /usr/src/app/cli.js "${{targets.destdir}}/usr/bin/zigbee2mqtt"
  - uses: go/licenses
    with:
      save: "false"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        files: /usr/src/app/dist/controller.js /usr/src/app/dist/.hash /usr/src/app/data/configuration.example.yaml /usr/share/licenses/zigbee2mqtt/LICENSE
        dirs: /usr/src/app/data /usr/src/app/node_modules
        symlinks: /usr/bin/zigbee2mqtt
    - name: Writes the version hash
      runs: |
        node /usr/src/app/index.js writehash
        test -s /usr/src/app/dist/.hash
    - name: Serialport loads its native bindings
      runs: |
        node -e 'require("/usr/src/app/node_modules/@serialport/bindings-cpp"); console.log("bindings ok")' | grep -q "bindings ok"

update:
  enabled: true
  github:
    identifier: Koenkk/zigbee2mqtt
    use-tag: true
