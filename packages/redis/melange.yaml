package:
  name: redis
  version: 8.12.0
  epoch: 1
  description: In-memory data store with disk persistence (statically linked)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE.txt
      license: RSAL-2.0 OR SSPL-1.0 OR AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0
      - secret-env=0.2.0-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - os-release=3.24.2-r0
      - gcc=15.2.0-r5
      - linux-headers=7.0.0-r1
      - make=4.4.1-r4
      - musl-dev=1.2.6-r3
      - openssl-dev=3.5.9-r1
      - openssl-libs-static=3.5.9-r1
      - zlib-dev=1.4-r0
      - zlib-static=1.4-r0
      - pkgconf=2.5.1-r0
  environment:
    LDFLAGS: -static

vars:
  runtime-dirs: /home/nonroot/database

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 215f2e33da9dfb2e0783cdd3a7acd29f8f6e9dd2
      repository: https://github.com/redis/redis
      tag: ${{package.version}}
  - uses: autoconf/make
    with:
      targets: distclean
  - uses: autoconf/make
    with:
      targets: all
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
  - name: Install the config
    runs: |
      install -Dm755 src/redis-server "${{targets.destdir}}/usr/bin/redis"
      install -Dm644 redis-minimal.conf "${{targets.destdir}}/redis.conf"
  - uses: license/install
    with:
      license: LICENSE.txt
  - uses: strip
    with:
      opts: -s
  - uses: secret-env/wrap
    with:
      name: redis
      config: secret-env/redis.conf
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/redis
        files: /redis.conf /usr/share/licenses/redis/LICENSE.txt
        dirs: ${{vars.runtime-dirs}}
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/redis)" = /usr/bin/secret-env
        test -x /usr/libexec/redis.real
        grep -qx 'path = /usr/libexec/redis.real' /etc/secret-env/redis.conf
update:
  enabled: true
  github:
    identifier: redis/redis
