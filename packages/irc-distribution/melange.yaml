package:
  name: irc-distribution
  version: 1.1.0
  epoch: 25
  description: irc-bot plugin distributing webhook payloads to IRC channels
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0
      - secret-env=0.2.0-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e68323d3c24b5b6063832fe13972f63dfee24067
      repository: https://github.com/csmith/irc-distribution
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/distribution
      output: irc-distribution
      static: "true"
  - uses: license/install
    with:
      license: LICENCE
  - uses: go/credits
  - uses: secret-env/wrap
    with:
      name: irc-distribution
      config: secret-env/irc-distribution.conf
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/irc-distribution
        files: /usr/share/licenses/irc-distribution/LICENCE /usr/share/licenses/irc-distribution/CREDITS
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/irc-distribution)" = /usr/bin/secret-env
        test -x /usr/libexec/irc-distribution.real
        grep -qx 'path = /usr/libexec/irc-distribution.real' /etc/secret-env/irc-distribution.conf
update:
  enabled: true
  github:
    identifier: csmith/irc-distribution
    strip-prefix: v
    use-tag: true
