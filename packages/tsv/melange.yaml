package:
  name: tsv
  version: 1.2.1
  epoch: 0
  description: Tailscale VPN node bridging tailnet traffic to WireGuard
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r2
      - tzdata=2026e-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r2
      - git=2.54.0-r0
      - go=1.27.3-r2
      - go-licenses=2.0.1-r14
      - os-release=3.24.2-r0

vars:
  runtime-dirs: /config

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 77fe9097a98aa994b75a813c853c43ae75c7e4ff
      repository: https://github.com/csmith/tsv
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: tsv
      static: "true"
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
  - uses: go/licenses
    with:
      module: github.com/csmith/tsv
      license: LICENCE
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/tsv
        files: /notices/github.com/csmith/tsv/LICENCE /usr/share/licenses/tsv/LICENCE
        dirs: ${{vars.runtime-dirs}}
    - name: Refuses to start without WireGuard config
      runs: |
        if /usr/bin/tsv --tailscale-config-dir=/config >/tmp/tsv.log 2>&1; then
          echo "expected missing-configuration failure" >&2
          exit 1
        fi
        grep -q "Flag validation failed" /tmp/tsv.log
        grep -q "\-\-wg-private-key is required" /tmp/tsv.log
update:
  enabled: true
  github:
    identifier: csmith/tsv
    strip-prefix: v
