package:
  name: pocket-id
  version: 2.19.3
  epoch: 2
  description: Simple OIDC provider that lets users authenticate with passkeys
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: BSD-2-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
      - secret-env=0.1.0-r2

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.1-r0
      - go=1.27.4-r1
      - nodejs=24.22.3-r0
      - pnpm=11.29.0-r0
      - os-release=3.24.2-r0
  environment:
    GOPATH: /go
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c0abd9322d0a67e200434baacc662e9c7cde1389
      repository: https://github.com/stonith404/pocket-id
      tag: v${{package.version}}
  - name: Build the SvelteKit frontend into the backend's embed directory
    runs: |
      pnpm --filter pocket-id-frontend install --frozen-lockfile
      pnpm --filter pocket-id-frontend run build
      test -d backend/frontend/dist
  - name: Build the backend binary with the frontend embedded
    runs: |
      cd backend
      export PATH="/usr/local/go/bin:/go/bin:$PATH"
      export CGO_ENABLED=0 GOTELEMETRY=off
      go build -trimpath \
        -ldflags "-X github.com/pocket-id/pocket-id/backend/internal/common.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/pocket-id" \
        ./cmd
  - uses: license/install
  - uses: go/credits
    with:
      directory: backend
  - uses: secret-env/wrap
    with:
      name: pocket-id
      config: secret-env/pocket-id.conf

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/pocket-id
        files: /usr/share/licenses/pocket-id/LICENSE /usr/share/licenses/pocket-id/CREDITS
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/pocket-id)" = /usr/bin/secret-env
        test -x /usr/libexec/pocket-id.real
        grep -qx 'path = /usr/libexec/pocket-id.real' /etc/secret-env/pocket-id.conf

update:
  enabled: true
  github:
    identifier: stonith404/pocket-id
    strip-prefix: v
