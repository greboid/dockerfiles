package:
  name: forgejo
  version: 17.0.2
  epoch: 3
  description: Forgejo self-hosted software forge (Gitea fork)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0
      - secret-env=0.2.0-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - os-release=3.24.2-r0
      - make=4.4.1-r4
      - nodejs=24.22.3-r0
      - npm=11.12.1-r0
      - gcc=15.2.0-r5
      - musl-dev=1.2.6-r3
  environment:
    CGO_ENABLED: "1"

vars:
  runtime-dirs: /data

pipeline:
  - uses: git-checkout
    with:
      expected-commit: eea4b0052f24f5ee986b46c00ebf30bdbbf654cb
      repository: https://codeberg.org/forgejo/forgejo
      tag: v${{package.version}}
  - uses: patch
    with:
      patches: |
        patches/001-admin-actions-pending-jobs.patch
        patches/002-automerge-enqueue-on-schedule.patch
        patches/003-api-user-automerges.patch
        patches/004-api-admin-hook-redeliver.patch
  - name: Build the frontend assets
    runs: make frontend
  - name: Generate embedded Go assets
    runs: make generate-go TAGS="bindata sqlite sqlite_unlock_notify"
  - uses: go/build
    with:
      packages: ./
      output: forgejo
      ldflags: -X main.Version=${{package.version}}
      tags: bindata,sqlite,sqlite_unlock_notify
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
  - uses: license/install
  - uses: go/credits
  - uses: secret-env/wrap
    with:
      name: forgejo
      config: secret-env/forgejo.conf
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/forgejo
        files: /usr/share/licenses/forgejo/LICENSE /usr/share/licenses/forgejo/CREDITS
        dirs: ${{vars.runtime-dirs}}
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/forgejo)" = /usr/bin/secret-env
        test -x /usr/libexec/forgejo.real
        grep -qx 'path = /usr/libexec/forgejo.real' /etc/secret-env/forgejo.conf
update:
  enabled: true
  forgejo:
    instance: https://codeberg.org
    identifier: forgejo/forgejo
    strip-prefix: v
