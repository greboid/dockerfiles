package:
  name: irc-webhook
  version: 4.2.0
  epoch: 5
  description: irc-bot plugin offering webhook-to-IRC relaying with token management
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0
      - secret-env=0.1.0-r2

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 68f5de38528433f484e1aa17517c0e8bf3a0b206
      repository: https://github.com/greboid/irc-webhook
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/webhook
      output: irc-webhook
      static: "true"
  - uses: license/install
  - uses: go/credits
  - uses: secret-env/wrap
    with:
      name: irc-webhook
      config: secret-env/irc-webhook.conf
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/irc-webhook
        files: /usr/share/licenses/irc-webhook/LICENSE /usr/share/licenses/irc-webhook/CREDITS
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/irc-webhook)" = /usr/bin/secret-env
        test -x /usr/libexec/irc-webhook.real
        grep -qx 'path = /usr/libexec/irc-webhook.real' /etc/secret-env/irc-webhook.conf
update:
  enabled: true
  github:
    identifier: greboid/irc-webhook
    strip-prefix: v
    use-tag: true
