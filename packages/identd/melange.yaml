package:
  name: identd
  version: 1.1.0
  epoch: 0
  description: Ident server returning a configurable static response
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r2
      - tzdata=2026e-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r2
      - git=2.54.0-r0
      - go=1.27.3-r2
      - go-licenses=2.0.1-r14
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 3c6bde6401f9297e08d59053ef4a08194eb4eae7
      repository: https://github.com/greboid/identd
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: identd
      static: "true"
  - uses: go/licenses
    with:
      checks: github.com/greboid/identd/LICENSE
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/identd
        files: /notices/github.com/greboid/identd/LICENSE /usr/share/licenses/identd/LICENSE
update:
  enabled: true
  github:
    identifier: greboid/identd
    strip-prefix: v
    use-tag: true
