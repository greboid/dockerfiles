name: Build go code

needs:
  packages:
    - busybox
    - go

inputs:
  packages:
    description: |
      Go package patterns to build.
    default: ./

  output:
    description: |
      Name of the output binary, installed to prefix / install-dir / output.
    required: true

  prefix:
    description: |
      Installation prefix. Defaults to usr.
    default: usr

  install-dir:
    description: |
      Directory under prefix where the binary is installed. Defaults to bin.
    default: bin

  static:
    description: |
      Build a statically linked binary (CGO_ENABLED=0). Defaults to true.
    default: 'true'

  tags:
    description: |
      Build tags to pass to the go build command.
    default: ''

  ldflags:
    description: |
      Linker flags to pass to the go build command.
    default: ''

  experiments:
    description: |
      Comma-separated GOEXPERIMENT values to enable.
    default: ''

pipeline:
  - runs: |
      export GOTELEMETRY=off
      export GOMODCACHE="$PWD/go-package-cache"
      if [ -n "${{inputs.experiments}}" ]; then
        export GOEXPERIMENT="${{inputs.experiments}}"
      fi
      if [ "${{inputs.static}}" = "true" ]; then
        export CGO_ENABLED=0
      else
        export CGO_ENABLED=1
      fi
      go build -trimpath \
        -ldflags "${{inputs.ldflags}}" \
        -tags "${{inputs.tags}}" \
        -o "${{targets.destdir}}/${{inputs.prefix}}/${{inputs.install-dir}}/${{inputs.output}}" \
        ${{inputs.packages}}
