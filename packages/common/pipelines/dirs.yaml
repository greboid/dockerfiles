name: Create directories in the package destination

inputs:
  dirs:
    description: |
      Directories to create, space- or newline-separated, relative to the
      root of the package (a leading slash is ignored).
    required: true

  mode:
    description: |
      Mode to apply to the created directories.
    default: '0755'

pipeline:
  - runs: |
      mkdir -p "${{targets.destdir}}"
      for dir in ${{inputs.dirs}}; do
        while [ "${dir#/}" != "$dir" ]; do dir="${dir#/}"; done
        [ -n "$dir" ] || continue
        install -d -m "${{inputs.mode}}" "${{targets.destdir}}/$dir"
      done
