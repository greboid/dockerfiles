package:
  name: eclipse-mosquitto
  version: 2.1.2
  epoch: 1
  description: MQTT broker with TLS, websockets and persistence (statically linked)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE.txt
      license: EPL-2.0 OR EDL-1.0
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - os-release=3.24.2-r0
      - gcc=15.2.0-r5
      - linux-headers=7.0.0-r1
      - make=4.4.1-r4
      - musl-dev=1.2.6-r3
      - openssl-dev=3.5.9-r0
      - openssl-libs-static=3.5.9-r0
      - cjson-dev=1.7.19-r1
      - cjson-static=1.7.19-r1
      - pkgconf=2.5.1-r0
  environment:
    LDFLAGS: -static

vars:
  runtime-dirs: /data

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 99fa50f30e325609394c324c8ff71cfbbe95d8ab
      repository: https://github.com/eclipse/mosquitto
      tag: v${{package.version}}
  - uses: patch
    with:
      patches: |
        patches/001-static-link-order.patch
  - name: Build broker, apps and clients
    runs: |
      # Command-line variables override the defaults in config.mk.
      set -- \
        WITH_DOCS=no \
        WITH_SQLITE=no \
        WITH_GMOCK=no \
        WITH_EDITLINE=no \
        WITH_HTTP_API=no \
        WITH_SHARED_LIBRARIES=no \
        WITH_STATIC_LIBRARIES=yes
      make -C libcommon "$@"
      make -C lib "$@"
      make -C apps/mosquitto_passwd "$@"
      make -C client "$@"
      make -C src "$@"
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
  - name: Install binaries and config
    runs: |
      install -Dm755 src/mosquitto "${{targets.destdir}}/usr/bin/mosquitto"
      install -Dm755 apps/mosquitto_passwd/mosquitto_passwd "${{targets.destdir}}/usr/bin/mosquitto_passwd"
      install -Dm755 client/mosquitto_pub "${{targets.destdir}}/usr/bin/mosquitto_pub"
      install -Dm755 client/mosquitto_sub "${{targets.destdir}}/usr/bin/mosquitto_sub"
      install -Dm644 mosquitto.conf "${{targets.destdir}}/etc/mosquitto/mosquitto.conf"
  - uses: license/install
    with:
      license: LICENSE.txt
  - uses: strip
    with:
      opts: -s

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/mosquitto /usr/bin/mosquitto_passwd /usr/bin/mosquitto_pub /usr/bin/mosquitto_sub
        files: /etc/mosquitto/mosquitto.conf /usr/share/licenses/eclipse-mosquitto/LICENSE.txt
        dirs: ${{vars.runtime-dirs}}

update:
  enabled: true
  github:
    identifier: eclipse/mosquitto
    strip-prefix: v
    use-tag: true
