package:
  name: eclipse-mosquitto
  version: 2.1.2
  epoch: 0
  description: MQTT broker with TLS, websockets and persistence (statically linked)
  target-architecture:
    - x86_64
    - aarch64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE.txt
      license: EPL-2.0 OR EDL-1.0
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r2

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r2
      - git=2.54.0-r0
      - os-release=3.24.2-r0
      - gcc=15.2.0-r5
      - linux-headers=7.0.0-r1
      - make=4.4.1-r4
      - musl-dev=1.2.6-r3
      - openssl-dev=3.5.9-r0
      - openssl-libs-static=3.5.9-r0
      - cjson-dev=1.7.19-r1
      - cjson-static=1.7.19-r1
      - pkgconf=2.5.1-r0
  environment:
    LDFLAGS: -static

vars:
  runtime-dirs: /data

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 99fa50f30e325609394c324c8ff71cfbbe95d8ab
      repository: https://github.com/eclipse/mosquitto
      tag: v${{package.version}}
  - name: Trim config.mk to a minimal static build
    runs: |
      sed -i \
        -e 's/^WITH_DOCS:=yes/WITH_DOCS:=no/' \
        -e 's/^WITH_SQLITE:=yes/WITH_SQLITE:=no/' \
        -e 's/^WITH_GMOCK:=yes/WITH_GMOCK:=no/' \
        -e 's/^WITH_EDITLINE:=yes/WITH_EDITLINE:=no/' \
        -e 's/^WITH_SHARED_LIBRARIES:=yes/WITH_SHARED_LIBRARIES:=no/' \
        -e 's/^WITH_STATIC_LIBRARIES:=no/WITH_STATIC_LIBRARIES:=yes/' \
        config.mk
  - name: Build broker, apps and clients
    runs: |
      # Skip plugins/, man pages and mosquitto_ctrl (which needs editline);
      # the broker, passwd tool and clients are self-contained and link
      # statically via LDFLAGS.
      make -C libcommon
      make -C lib
      make -C apps/mosquitto_passwd
      make -C client
      make -C src
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
  - name: Install binaries and config
    runs: |
      install -Dm755 src/mosquitto "${{targets.destdir}}/usr/bin/mosquitto"
      install -Dm755 apps/mosquitto_passwd/mosquitto_passwd "${{targets.destdir}}/usr/bin/mosquitto_passwd"
      install -Dm755 client/mosquitto_pub "${{targets.destdir}}/usr/bin/mosquitto_pub"
      install -Dm755 client/mosquitto_sub "${{targets.destdir}}/usr/bin/mosquitto_sub"
      install -Dm644 mosquitto.conf "${{targets.destdir}}/etc/mosquitto/mosquitto.conf"
  - uses: license/install
    with:
      license: LICENSE.txt
  - uses: strip
    with:
      opts: -s

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/mosquitto /usr/bin/mosquitto_passwd /usr/bin/mosquitto_pub /usr/bin/mosquitto_sub
        files: /etc/mosquitto/mosquitto.conf /usr/share/licenses/eclipse-mosquitto/LICENSE.txt
        dirs: ${{vars.runtime-dirs}}
    - name: Static binaries
      runs: |
        for bin in mosquitto mosquitto_passwd mosquitto_pub mosquitto_sub; do
          file /usr/bin/$bin | grep -q "statically linked"
        done
    - name: Pub/sub round trip through the broker
      runs: |
        /usr/bin/mosquitto -c /etc/mosquitto/mosquitto.conf -p 18883 &
        broker=$!
        sleep 1
        /usr/bin/mosquitto_sub -h 127.0.0.1 -p 18883 -t smoke -C 1 > /tmp/sub.out &
        sub=$!
        sleep 1
        echo roundtrip | /usr/bin/mosquitto_pub -h 127.0.0.1 -p 18883 -t smoke -s
        wait $sub
        kill $broker
        grep -q roundtrip /tmp/sub.out
    - name: Passwd hashing round trip
      runs: |
        /usr/bin/mosquitto_passwd -b -c /tmp/pwfile user s3cret
        grep -q '\$7\$' /tmp/pwfile

update:
  enabled: true
  github:
    identifier: eclipse/mosquitto
    strip-prefix: v
    use-tag: true
