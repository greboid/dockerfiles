package:
  name: bootc
  version: 1.17.4
  epoch: 1
  description: Bootable container images - bootc for Alpine (no SELinux)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      license: MIT OR Apache-2.0
  dependencies:
    runtime:
      - ostree=2025.7-r1
      - pcre2
      - ca-certificates-bundle=20261020-r4

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - os-release=3.24.2-r0
      - busybox=1.37.0-r31
      - ca-certificates-bundle=20261020-r4
      - rust-toolchain=1.98.1-r2
      - gcc=15.2.0-r5
      - musl-dev=1.2.6-r3
      - pkgconf=2.5.1-r0
      - ostree-dev=2025.7-r1
      - openssl-dev=3.5.9-r0
      - pcre2-dev
      - patch
      - zstd=1.5.7-r2

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/bootc-dev/bootc/releases/download/v${{package.version}}/bootc-${{package.version}}.tar.zstd
      expected-sha256: 57d8913f9c15c92aa4bc31cb927d7cf9fb76cad623ccb7f8a83e7322d0f9a802
      extract: false
  - uses: fetch
    with:
      uri: https://github.com/bootc-dev/bootc/releases/download/v${{package.version}}/bootc-${{package.version}}-vendor.tar.zstd
      expected-sha256: 84e7e1cf4f312450d2fa6c28cdeadf0360ee48ae864c5921e76c7507523610c2
      extract: false
  - name: Unpack source and vendored crates
    runs: |
      zstd -d -c bootc-${{package.version}}.tar.zstd | tar -x
      zstd -d -c bootc-${{package.version}}-vendor.tar.zstd | tar -x -C bootc-${{package.version}}
      test -d bootc-${{package.version}}/vendor
      cat bootc-${{package.version}}/.cargo/vendor-config.toml >> \
        bootc-${{package.version}}/.cargo/config.toml
      grep -q vendored-sources bootc-${{package.version}}/.cargo/config.toml
      patch -d bootc-${{package.version}} -p1 < \
        patches/001-musl-super-magic-cast.patch
      patch -d bootc-${{package.version}} -p1 < \
        patches/002-esp-mount-iocharset-ascii.patch
  - name: Build
    runs: |
      cd bootc-${{package.version}}
      RUSTFLAGS="-C target-feature=-crt-static" PCRE2_SYS_STATIC=0 \
        cargo build --release --offline \
        --no-default-features --features install-to-disk \
        -p bootc -p bootc-initramfs-setup -p system-reinstall-bootc
  - name: Install
    runs: |
      cd bootc-${{package.version}}
      destdir="${{targets.destdir}}"
      install -Dm 0755 target/release/bootc "$destdir/usr/bin/bootc"
      install -Dm 0755 target/release/system-reinstall-bootc \
        "$destdir/usr/bin/system-reinstall-bootc"
      install -d -m 0755 \
        "$destdir/usr/lib/bootc/bound-images.d" \
        "$destdir/usr/lib/bootc/kargs.d" \
        "$destdir/usr/lib/bootc/install"
      ln -s ../../../sysroot/ostree/bootc/storage \
        "$destdir/usr/lib/bootc/storage"
      install -Dm 0755 target/release/bootc-initramfs-setup \
        "$destdir/usr/lib/bootc/initramfs-setup"
      install -Dm 0755 crates/cli/bootc-generator-stub \
        "$destdir/usr/lib/systemd/system-generators/bootc-systemd-generator"
      sed -i '1s|^#!/bin/bash$|#!/bin/sh|' \
        "$destdir/usr/lib/systemd/system-generators/bootc-systemd-generator"
      install -d -m 0755 "$destdir/usr/lib/dracut/modules.d/51bootc"
      install -m 0755 crates/initramfs/dracut/module-setup.sh \
        "$destdir/usr/lib/dracut/modules.d/51bootc/"
      install -Dm 0644 crates/initramfs/bootc-root-setup.service \
        "$destdir/usr/lib/systemd/system/bootc-root-setup.service"
      install -Dm 0644 -t "$destdir/usr/lib/systemd/system" \
        systemd/*.service systemd/*.timer systemd/*.path systemd/*.target
      install -d -m 0755 \
        "$destdir/usr/share/doc/bootc/baseimage/base/usr/lib/ostree" \
        "$destdir/usr/share/doc/bootc/baseimage/base/sysroot"
      install -Dm 0644 baseimage/base/usr/lib/ostree/prepare-root.conf \
        "$destdir/usr/share/doc/bootc/baseimage/base/usr/lib/ostree/prepare-root.conf"
      cp -PfT baseimage/base/ostree \
        "$destdir/usr/share/doc/bootc/baseimage/base/ostree"
      cp -Prf baseimage/dracut \
        "$destdir/usr/share/doc/bootc/baseimage/dracut"
      cp -Prf baseimage/systemd \
        "$destdir/usr/share/doc/bootc/baseimage/systemd"
      install -Dm 0644 LICENSE-MIT \
        "$destdir/usr/share/licenses/${{package.name}}/LICENSE-MIT"
      install -Dm 0644 LICENSE-APACHE \
        "$destdir/usr/share/licenses/${{package.name}}/LICENSE-APACHE"
  - uses: strip

test:
  environment:
    contents:
      keyring:
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - name: Binary reports its version
      runs: |
        /usr/bin/bootc --version
    - name: Initramfs and systemd integration shipped
      runs: |
        test -x /usr/lib/bootc/initramfs-setup
        test -f /usr/lib/dracut/modules.d/51bootc/module-setup.sh
        test -f /usr/lib/systemd/system/bootc-root-setup.service
        test -f /usr/lib/systemd/system/bootc-fetch-apply-updates.timer
        test -f /usr/lib/systemd/system/bootc-fetch-apply-updates.service
        test -d /usr/share/doc/bootc/baseimage/dracut

update:
  enabled: true
  github:
    identifier: bootc-dev/bootc
    strip-prefix: v
