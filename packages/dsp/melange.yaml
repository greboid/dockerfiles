package:
  name: dsp
  version: 1.5.0
  epoch: 1
  description: Filtering proxy in front of the Docker socket
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0
      - secret-env=0.2.0-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d1c06fb98978dad93db90b2fad5f68a271fd11fb
      repository: https://github.com/greboid/dsp
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd
      output: dsp
      static: "true"
  - uses: license/install
  - uses: go/credits
  - uses: secret-env/wrap
    with:
      name: dsp
      config: secret-env/dsp.conf
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/dsp
        files: /usr/share/licenses/dsp/LICENSE /usr/share/licenses/dsp/CREDITS
    - name: Fails when the Docker socket is missing
      runs: |
        ! /usr/bin/dsp >/tmp/dsp.log 2>&1
        grep -q "unable to access socket" /tmp/dsp.log
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/dsp)" = /usr/bin/secret-env
        test -x /usr/libexec/dsp.real
        grep -qx 'path = /usr/libexec/dsp.real' /etc/secret-env/dsp.conf
update:
  enabled: true
  github:
    identifier: greboid/dsp
    strip-prefix: v
    use-tag: true
