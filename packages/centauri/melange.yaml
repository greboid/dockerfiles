package:
  name: centauri
  version: 2.10.1
  epoch: 1
  description: TLS front proxy with automatic certificates via lego
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - os-release=3.24.2-r0

vars:
  runtime-dirs: /data

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ad717473ac94e04b40b9d23e039e0f33b00a8072
      repository: https://github.com/csmith/centauri
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/centauri
      output: centauri
      static: "true"
      tags: lego_httpreq
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
  - uses: license/install
    with:
      license: LICENCE
  - uses: go/credits
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/centauri
        files: /usr/share/licenses/centauri/LICENCE /usr/share/licenses/centauri/CREDITS
        dirs: ${{vars.runtime-dirs}}
    - name: Validates configurations
      runs: |
        printf 'route test.example.internal\n\tupstream 127.0.0.1:9999\n' > /tmp/good.conf
        /usr/bin/centauri -config /tmp/good.conf -validate
        printf 'not a centauri config\n' > /tmp/bad.conf
        ! /usr/bin/centauri -config /tmp/bad.conf -validate
update:
  enabled: true
  github:
    identifier: csmith/centauri
    strip-prefix: v
