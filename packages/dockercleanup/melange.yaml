package:
  name: dockercleanup
  version: 1.1.1
  epoch: 0
  description: Periodically prunes stopped containers and unused images via the Docker API
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r2
      - tzdata=2026e-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r2
      - git=2.54.0-r0
      - go=1.27.3-r2
      - go-licenses=2.0.1-r14
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a539ceedad7e39c8ce5c411063b834ba950327a4
      repository: https://github.com/greboid/dockercleanup
      tag: v1.1.1
  - uses: go/build
    with:
      packages: ./
      output: dockercleanup
      static: "true"
  - uses: go/licenses
    with:
      checks: github.com/greboid/dockercleanup/LICENSE github.com/csmith/envflag/v2/LICENCE github.com/docker/docker/LICENSE
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/dockercleanup
        files: /notices/github.com/greboid/dockercleanup/LICENSE /notices/github.com/docker/docker/LICENSE /usr/share/licenses/dockercleanup/LICENSE
    - name: Binary runs
      runs: |
        /usr/bin/dockercleanup --help 2>&1 | grep -q "Usage"
update:
  enabled: true
  forgejo:
    identifier: greboid/dockercleanup
    use-tag: true
    strip-prefix: v
