package:
  name: dockercleanup
  version: 1.0.3
  epoch: 1
  description: Periodically prunes stopped containers and unused images via the Docker API
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r2
      - tzdata=2026e-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r2
      - git=2.54.0-r0
      - go=1.27.3-r2
      - go-licenses=2.0.1-r14
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 83f38758aa451afcbf75535a136ef762d04b2ba0
      repository: https://github.com/greboid/dockercleanup
      tag: v1.0.3
  - uses: go/build
    with:
      packages: ./
      output: dockercleanup
      static: "true"
  - uses: go/licenses
    with:
      checks: github.com/greboid/dockercleanup/LICENSE github.com/csmith/envflag/v2/LICENCE github.com/docker/docker/LICENSE
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/dockercleanup
        files: /notices/github.com/greboid/dockercleanup/LICENSE /notices/github.com/docker/docker/LICENSE /usr/share/licenses/dockercleanup/LICENSE
    - name: Fails loudly without a Docker daemon
      runs: |
        set +e
        out=$(DOCKER_HOST=tcp://127.0.0.1:9 /usr/bin/dockercleanup 2>&1)
        code=$?
        set -e
        test "$code" = 1
        echo "$out" | grep -q "unable to clean perform cleanup"
update:
  enabled: true
  forgejo:
    identifier: greboid/dockercleanup
    uses-tags: true
    strip-prefix: v
