package:
  name: linx-server
  version: 3.4.1
  epoch: 25
  description: Self-hosted file-sharing service with expiry and hotlink control
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE.txt
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0
      - secret-env=0.2.0-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - os-release=3.24.2-r0

vars:
  runtime-dirs: /data/files /data/meta

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 612867dfb85af85aff08af17e8611e011c363e86
      repository: https://github.com/csmith/linx-server
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: linx-server
      static: "true"
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
  - uses: license/install
    with:
      license: LICENSE.txt
  - uses: go/credits
  - uses: secret-env/wrap
    with:
      name: linx-server
      config: secret-env/linx-server.conf
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
        - curl=8.23.0-r0
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/linx-server
        files: /usr/share/licenses/linx-server/LICENSE.txt /usr/share/licenses/linx-server/CREDITS
        dirs: ${{vars.runtime-dirs}}
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/linx-server)" = /usr/bin/secret-env
        test -x /usr/libexec/linx-server.real
        grep -qx 'path = /usr/libexec/linx-server.real' /etc/secret-env/linx-server.conf
update:
  enabled: true
  github:
    identifier: csmith/linx-server
    strip-prefix: v
    use-tag: true
