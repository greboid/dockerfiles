package:
  name: linx-server
  version: 3.4.1
  epoch: 8
  description: Self-hosted file-sharing service with expiry and hotlink control
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE.txt
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.27.1-r19
      - go-licenses=2.0.1-r1
      - os-release=3.24.2-r0

vars:
  runtime-dirs: /data/files /data/meta

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 612867dfb85af85aff08af17e8611e011c363e86
      repository: https://github.com/csmith/linx-server
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: linx-server
      static: "true"
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
  - uses: go/licenses
    with:
      module: github.com/andreimarcu/linx-server
      license: LICENSE.txt
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox
        - curl
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/linx-server
        files: /notices/github.com/andreimarcu/linx-server/LICENSE.txt /usr/share/licenses/linx-server/LICENSE.txt
        dirs: ${{vars.runtime-dirs}}
update:
  enabled: true
  github:
    identifier: csmith/linx-server
    strip-prefix: v
    use-tag: true
