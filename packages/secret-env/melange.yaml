package:
  name: secret-env
  version: 0.2.0
  epoch: 0
  description: Read secret files into an environment and directly exec an application
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - os-release=3.24.2-r0
      - rust=1.96.1-r0
      - cargo=1.96.1-r0
      - gcc=15.2.0-r5
      - musl-dev=1.2.6-r3

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d5fc51084eff79b179755f433888845053cb2894
      repository: https://git.mouse-lake.ts.net/greboid/secret-env
      tag: v${{package.version}}
  - name: Run the test suite
    runs: |
      cargo test --locked
  - uses: cargo/build
    with:
      output: secret-env
      opts: --release --locked
      rustflags: -C target-feature=+crt-static
      auditable: "false"
  - uses: license/install

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/secret-env
        files: /usr/share/licenses/secret-env/LICENSE
    - name: Required configuration fails closed
      runs: |
        if /usr/bin/secret-env; then
          exit 1
        fi
    - name: Execute with a file-backed environment override
      runs: |
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        printf '%s' fixture-only > "$work/value"
        chmod 600 "$work/value"
        printf '[exec]\npath = /bin/sh\n[secrets]\nTOKEN = %s/value\n' "$work" > "$work/app.conf"
        /usr/bin/secret-env --config "$work/app.conf" -- -c 'test "$TOKEN" = fixture-only'
    - name: Discover secrets, and run without a discovery directory
      runs: |
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        mkdir "$work/secrets"
        printf '%s' discovered > "$work/secrets/TOKEN"
        printf '[exec]\npath = /bin/sh\n[discovery]\ndirectory = %s/secrets\n' "$work" > "$work/app.conf"
        /usr/bin/secret-env --config "$work/app.conf" -- -c 'test "$TOKEN" = discovered'
        printf '[exec]\npath = /bin/sh\n[discovery]\ndirectory = %s/missing\n' "$work" > "$work/none.conf"
        TOKEN=inherited /usr/bin/secret-env --config "$work/none.conf" -- -c 'test "$TOKEN" = inherited'
    - name: Binary is statically linked
      runs: |
        if grep -q 'ld-musl' /usr/bin/secret-env; then
          exit 1
        fi

update:
  enabled: true
  forgejo:
    identifier: greboid/secret-env
    strip-prefix: v
    use-tag: true
