package:
  name: apko
  version: 1.4.14
  epoch: 0
  description: Builds OCI images from apk packages (source-built, org patch set)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r2

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - os-release=3.24.2-r0
      - ca-certificates-bundle=20261020-r2
      - go=1.27.3-r2
      - git=2.54.0-r0
  environment:
    CGO_ENABLED: "0"
    GOTELEMETRY: "off"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 70b8c434bba5e541cd616696710de3942f91540b
      repository: https://github.com/chainguard-dev/apko
      tag: v${{package.version}}
  - uses: patch
    with:
      patches: |
        patches/001-image-attribution.patch
        patches/002-etc-apko-config.patch
        patches/003-accounts-gecos.patch
        patches/004-sbom-canonical-package.patch
        patches/005-sbom-g5d-identity.patch
        patches/006-cli-test-policy-and-goldens.patch
        patches/007-index-head-405-fallback.patch
  - uses: go/build
    with:
      packages: .
      output: apko
  - name: Install the license                                                                                                                                                    
    runs: install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - name: Reports the packaged version
      runs: |
        set -eu
        apko version
update:
  enabled: true
  github:
    identifier: chainguard-dev/apko
    strip-prefix: v
