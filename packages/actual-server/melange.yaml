package:
  name: actual-server
  version: 26.10.0
  epoch: 1
  description: Self-hosted personal finance manager (sync server + web UI)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE.txt
      license: MIT
  dependencies:
    runtime:
      - nodejs=24.22.1-r1
      - ca-certificates-bundle=20261020-r2
      - tzdata=2026e-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - bash=5.3.9-r1
      - ca-certificates=20261020-r2
      - git=2.54.0-r0
      - nodejs=24.22.1-r1
      - os-release=3.24.2-r0

vars:
  runtime-dirs: /data

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2bebdbaae0b701120a8cad9d56aafd64fa04c577
      repository: https://github.com/actualbudget/actual
      tag: v${{package.version}}
  - name: Put the repo-pinned yarn on PATH
    runs: |
      # yarn isn't on npm as 4.x and corepack would fetch it; the checkout
      # ships the exact release bundle under .yarn/releases. lage shells out
      # to `yarn`, so it must be on PATH (/usr/local/bin doesn't exist here).
      ln -sf /home/build/.yarn/releases/yarn-4.17.1.cjs /usr/bin/yarn
      yarn --version
  - name: Install workspace dependencies
    runs: |
      # No build scripts: every native dependency (better-sqlite3, argon2,
      # bcrypt) ships musl prebuilds inside its npm tarball and resolves them
      # at require time; skipping scripts also skips the electron download.
      export NODE_OPTIONS=--max-old-space-size=8192 YARN_ENABLE_SCRIPTS=0
      yarn install
  - name: Clone and prune translations
    runs: |
      # Same as bin/package-browser, minus lage (its glob-hasher native
      # module has no musl build), which the next step works around.
      git clone --depth 1 https://github.com/actualbudget/translations \
        packages/desktop-client/locale
      packages/desktop-client/bin/remove-untranslated-languages
  - name: Build the web client and the server
    runs: |
      # lage's `build:browser --to=@actual-app/web` task graph, run by hand:
      # the build scripts of @actual-app/web's workspace deps in dependency
      # order, then the browser build, then the sync-server vite build.
      export NODE_OPTIONS=--max-old-space-size=8192
      yarn workspace @actual-app/crdt run build
      yarn workspace @actual-app/core run build
      yarn workspace plugins-service run build
      yarn workspace @actual-app/web run build:browser
      yarn workspace @actual-app/sync-server run build
  - name: Focus production dependencies
    runs: |
      export NODE_OPTIONS=--max-old-space-size=8192
      yarn workspaces focus @actual-app/sync-server --production
      # Replace the workspace symlinks with the built artifacts, like the
      # upstream Dockerfile: the server resolves the web UI through
      # node_modules/@actual-app/web/build.
      rm -rf node_modules/@actual-app/web node_modules/@actual-app/sync-server
      mkdir -p node_modules/@actual-app/web
      cp packages/desktop-client/package.json node_modules/@actual-app/web/package.json
      cp -a packages/desktop-client/build node_modules/@actual-app/web/build
      # The native modules ship prebuilds for every platform; keep only the
      # x86_64 musl ones so foreign ELFs don't leak into the apk's scanned
      # dependencies (see the immich recipe's prebuild prune).
      find node_modules -type f -name '*.node' ! -name '*linuxmusl-x64*' \
        ! -path '*/prebuilds/linux-x64/*' -delete
      find node_modules -type f -name '*.node' -path '*/prebuilds/linux-x64/*' \
        ! -name '*.musl.node' -delete
  - name: Stage the package
    runs: |
      mkdir -p "${{targets.destdir}}/usr/src/app" "${{targets.destdir}}/usr/bin"
      cp packages/sync-server/package.json "${{targets.destdir}}/usr/src/app/package.json"
      cp -a packages/sync-server/build "${{targets.destdir}}/usr/src/app/build"
      cp -a node_modules "${{targets.destdir}}/usr/src/app/node_modules"
      printf '#!/bin/sh\nexport NODE_ENV=production\n# node-gyp-build (argon2, bcrypt) guesses glibc unless it finds\n# /etc/alpine-release, which some images lack; this apk is musl-only.\nexport LIBC=musl\nexec /usr/bin/node /usr/src/app/build/app.js "$@"\n' \
        > "${{targets.destdir}}/usr/bin/actual-server"
      chmod 0755 "${{targets.destdir}}/usr/bin/actual-server"
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
  - uses: go/licenses
    with:
      save: "false"
      license: LICENSE.txt

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/actual-server
        files: /usr/src/app/package.json /usr/src/app/build/app.js /usr/share/licenses/actual-server/LICENSE.txt
        dirs: ${{vars.runtime-dirs}} /usr/src/app/node_modules/@actual-app/web/build

update:
  enabled: true
  github:
    identifier: actualbudget/actual
    strip-prefix: v
    use-tag: true
