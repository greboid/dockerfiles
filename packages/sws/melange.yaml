package:
  name: sws
  version: 2.44.3
  epoch: 2
  description: Static web server (static-web-server) with query-preserving rewrites
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE-MIT
      license: Apache-2.0 OR MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0
      - secret-env=0.2.0-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - os-release=3.24.2-r0
      - rust=1.96.1-r0
      - cargo=1.96.1-r0
      - gcc=15.2.0-r5
      - musl-dev=1.2.6-r3

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 501cb7fcb6a01a4e73e6d5f541559e3334c39976
      repository: https://github.com/static-web-server/static-web-server
      tag: v${{package.version}}
  - uses: patch
    with:
      patches: patches/keepqueriesonrewrites.diff
  - uses: cargo/build
    with:
      output: static-web-server
      auditable: "false"
  - uses: license/install
    with:
      license: LICENSE-APACHE LICENSE-MIT
  - uses: secret-env/wrap
    with:
      name: static-web-server
      config: secret-env/static-web-server.conf
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
        - curl=8.23.0-r0
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/static-web-server
        files: /usr/share/licenses/sws/LICENSE-APACHE /usr/share/licenses/sws/LICENSE-MIT
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/static-web-server)" = /usr/bin/secret-env
        test -x /usr/libexec/static-web-server.real
        grep -qx 'path = /usr/libexec/static-web-server.real' /etc/secret-env/static-web-server.conf
update:
  enabled: true
  github:
    identifier: static-web-server/static-web-server
    strip-prefix: v
