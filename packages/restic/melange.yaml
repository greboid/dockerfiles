package:
  name: restic
  version: 0.20.0
  epoch: 0
  description: Fast, secure, efficient backup program
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: BSD-2-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9c88ff768f10c192dc6a87619a65a16374080e33
      repository: https://github.com/restic/restic
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/restic
      output: restic
      static: "true"
  - uses: license/install
    with:
      license: LICENSE
  - uses: go/credits

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/restic
        files: /usr/share/licenses/restic/LICENSE /usr/share/licenses/restic/CREDITS

update:
  enabled: true
  github:
    identifier: restic/restic
    strip-prefix: v
    use-tag: true
