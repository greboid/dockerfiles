package:
  name: webhooked
  version: 1.1.0
  epoch: 2
  description: Ensures a GitHub webhook is installed across a user's repositories
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - go=1.26.8-r0
      - go-licenses=1.6.0-r2
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 99b763d2c3b8383721c64e050a9b9b99d4e1f601
      repository: https://github.com/csmith/webhooked
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: webhooked
      static: "true"
  - uses: go/licenses
    with:
      checks: github.com/csmith/webhooked/LICENCE github.com/csmith/envflag/v2/LICENCE github.com/google/go-github/v72/github/LICENSE
      license: LICENCE
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/webhooked
        files: /notices/github.com/csmith/webhooked/LICENCE /notices/github.com/google/go-github/v72/github/LICENSE /usr/share/licenses/webhooked/LICENCE
    - name: Prints usage and exits cleanly when unconfigured
      runs: |
        out=$(/usr/bin/webhooked 2>&1)
        code=$?
        test "$code" = 0
        echo "$out" | grep -q "Usage of /usr/bin/webhooked:"
update:
  enabled: true
  github:
    identifier: csmith/webhooked
    strip-prefix: v
    use-tag: true
