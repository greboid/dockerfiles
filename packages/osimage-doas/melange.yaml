package:
  name: osimage-doas
  version: 1.0.0
  epoch: 0
  description: doas rules for osimage images (wheel/greboid, tailscale nopass) plus the sudo shim
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      license: MIT
  dependencies:
    runtime:
      - doas=6.8.2-r8
      - doas-sudo-shim=0.2.0-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - os-release=3.24.2-r0

pipeline:
  - name: Install the doas.d rule
    runs: |
      # 0750 on doas.d matches what Alpine's doas post-upgrade enforces
      # for the directory; the file itself is 0644 root:root like the
      # package-owned /etc/doas.conf (doas rejects group/other-writable
      # and non-root-owned config).
      cp -a tree/. "${{targets.destdir}}/"
      chmod 0750 "${{targets.destdir}}/etc/doas.d"

test:
  environment:
    contents:
      keyring:
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - busybox=1.37.0-r31
        - os-release=3.24.2-r0
  pipeline:
    - uses: test/paths
      with:
        files: /etc/doas.d/osimage.conf

update:
  enabled: false
  exclude-reason: no upstream to track; version is internal to this repository, Alpine package pins move with depbot
