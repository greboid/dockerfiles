# doas rules for osimage images.
#
# Shipped as /etc/doas.d/osimage.conf: since 6.8.2-r5 Alpine's doas
# reads /etc/doas.conf and /etc/doas.d/*.conf, in this order.
# OpenDoas applies the LAST matching rule, so the blanket `permit
# :wheel` must stay above the nopass cmd rules for them to take
# effect. :greboid matches greboid's primary group; :wheel matches
# the supplementary membership apko bakes into /etc/group.
permit setenv { DISPLAY XAUTHORITY LOCALE LANG LC_ALL TERMINFO } :wheel
permit setenv { DISPLAY XAUTHORITY LOCALE LANG LC_ALL TERMINFO } :greboid
permit :wheel
permit nopass :wheel cmd tailscale
