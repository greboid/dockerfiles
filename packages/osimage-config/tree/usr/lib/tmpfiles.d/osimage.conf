# /etc/resolv.conf is baked by this package as a static copy of
# resolved's stub (a symlink there would break bwrap's mount for every
# melange/apko guest installing this package; L! replacement would fail
# every boot against the read-only /etc).
d /run/dbus 0755 root root -
# Image identity: alpine-baselayout owns /etc/hostname (apk3 rejects a
# second package shipping the same path), so set the hostname via
# tmpfiles instead of shipping the file.
f+ /etc/hostname 0644 root root - osimage
