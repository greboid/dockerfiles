# Hardware watchdog for unattended recovery.
#
# PID 1 pings the watchdog; if the kernel or PID 1 hangs, the hardware
# resets the machine. Together with panic= in kargs.d (a kernel panic
# reboots instead of sitting at the panic screen) this turns hangs into
# boot attempts, so systemd-boot's boot counting can fall back from a
# broken deployment without anyone at the console.
#
# The driver is loaded by udev (iTCO_wdt, sp5100_tco, wdat_wdt,
# i6300esb in QEMU, ...), after PID 1 started; systemd keeps retrying
# the open on its ping schedule while /dev/watchdog0 is missing, and
# machines without a watchdog only log that none was found. softdog is
# deliberately not loaded: it would claim /dev/watchdog0 ahead of a
# hardware device and cannot catch a hard kernel lockup.
[Manager]
RuntimeWatchdogSec=30s
# Bound a hung shutdown/reboot as well (systemd's default, stated
# explicitly).
RebootWatchdogSec=10min
