# Default PATH for every service PID 1 starts.
#
# systemd's compiled-in service PATH is
#   /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
# which leaves out /sbin and /bin, where Alpine (not usr-merged) keeps
# the busybox applets and several real binaries (agetty, ...). Any
# service or script that runs `cat`, `sleep`, `mount`, ... by name
# would otherwise fail with "not found". The upstream order is kept, so
# /usr/local and /usr binaries still win over the busybox applets;
# /sbin and /bin are only the fallback.
[Manager]
DefaultEnvironment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
