[Service]
# Reset the ExecStop list and re-add bootc's finalize with the "-"
# ignore-failure prefix: at shutdown its storage initialization can
# fail on this combination (known quirk, see plan.md), and a failing
# ExecStop command skips the remaining ones -- including the stamp
# below.  The stamp runs after the entries are exchanged, whether that
# happened in this finalize or in an explicit earlier call.
ExecStop=
ExecStop=-/usr/bin/bootc composefs-finalize-staged
ExecStop=/usr/libexec/osimage-boot-count
