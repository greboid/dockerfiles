[Service]
# Alpine's agetty apk installs /sbin/agetty without a /usr/bin compat
# symlink, but systemd's getty templates exec /usr/bin/agetty. The "-"
# prefix swallows the exec failure, so the getty services exit instantly
# and hit their start limit before any prompt appears. Reset ExecStart
# to the path that exists in this image (arg list mirrors the upstream
# unit; recheck on systemd bumps).
ExecStart=
ExecStart=-/sbin/agetty --noreset --noclear --keep-baud 115200,57600,38400,9600 - ${TERM}
