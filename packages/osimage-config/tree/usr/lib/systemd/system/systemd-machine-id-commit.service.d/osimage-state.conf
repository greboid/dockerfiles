[Unit]
# /etc/machine-id is a bind mount of the persistent
# /var/lib/osimage/etc/machine-id (osimage-kernel 90osimage-state), not
# PID 1's transient tmpfs mount, so there is nothing to commit. Upstream
# only checks "/etc writable + /etc/machine-id is a mount point", so
# without this the unit runs and fails ("not on a temporary file
# system") wherever /etc is writable: the live installer's overlay and
# plain-root test boots. When the initramfs hook did not run, the /var
# file is absent and the upstream behaviour applies unchanged.
ConditionPathExists=!/var/lib/osimage/etc/machine-id
