# Reboot 10 s after a kernel panic, matching the panic=10 karg
# (kargs.d/30-panic.toml), which only covers panics before this file is
# applied: Alpine's 00-alpine.conf otherwise raises it to 120 s once
# userspace is up. A panic is a failed boot attempt for systemd-boot's
# boot counting; the sooner it reboots, the sooner the fallback.
kernel.panic = 10
