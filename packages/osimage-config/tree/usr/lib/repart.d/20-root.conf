# osimage root layout for bootc install to-disk --run-repart.
#
# Type=root-x86-64 (GPT type 4F68BCE3-E8CD-4DB1-96E7-FBCAF984B709):
# this package is x86_64-only. ext4 is authoritative here - bootc's
# repart path only passes mkfs options (fs-verity), never --filesystem.
#
# Minimum 4 GiB for multiple composefs deployments and /var; grows into
# the remaining disk (bootc keeps deployments on one root, there is no
# A/B root split). No verity/hash fallback partitions: composefs runs
# on this filesystem directly.
#
# Partition UUIDs stay installation-specific (no UUID= set).
[Partition]
Type=root-x86-64
Format=ext4
SizeMinBytes=4G
GrowFileSystem=yes
