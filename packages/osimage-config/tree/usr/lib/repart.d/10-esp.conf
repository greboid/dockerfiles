# osimage ESP layout for bootc install to-disk --run-repart.
#
# Fixed 1 GiB: holds current, rollback and staged UKIs (about 70 MiB
# each today) plus systemd-boot and update headroom. Kept fixed so
# undersized disks fail installation instead of squeezing UKI space.
#
# Partition UUIDs stay installation-specific (no UUID= set): repart
# derives them from the machine-id seed of the target installation.
[Partition]
Type=esp
Format=vfat
SizeMinBytes=1G
SizeMaxBytes=1G
