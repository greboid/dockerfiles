package:
  name: osimage-config
  version: 1.0.0
  epoch: 21
  description: OS configuration for osimage bootc images (baked systemd enablement, boot kargs, boot assessment)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      license: MIT
  dependencies:
    # tree/etc/motd overrides the Alpine default; apko's file conflict
    # check is not cleared by naming alpine-baselayout-data instead.
    replaces:
      - alpine-baselayout
    runtime:
      - busybox-binsh=1.37.0-r31

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    packages:
      - os-release=3.24.2-r0
      - busybox=1.37.0-r31

pipeline:
  - name: Install the osimage configuration tree
    runs: |
      cp -a tree/. "${{targets.destdir}}/"

  - name: Bake the systemd enablement symlinks
    runs: |
      d="${{targets.destdir}}/etc/systemd/system"
      mkdir -p "$d/boot-complete.target.requires"
      mkdir -p "$d/bootc-status-updated-onboot.target.wants"
      mkdir -p "$d/bootc-status-updated.target.wants"
      mkdir -p "$d/getty.target.wants"
      mkdir -p "$d/local-fs.target.wants"
      mkdir -p "$d/multi-user.target.wants"
      mkdir -p "$d/network-online.target.wants"
      mkdir -p "$d/sockets.target.wants"
      mkdir -p "$d/sysinit.target.wants"
      mkdir -p "$d/systemd-journald.service.wants"
      ln -s /usr/lib/systemd/system/getty@.service "$d/autovt@.service"
      ln -s /usr/lib/systemd/system/tmp.mount "$d/local-fs.target.wants/tmp.mount"
      ln -s /usr/lib/systemd/system/systemd-boot-check-no-failures.service "$d/boot-complete.target.requires/systemd-boot-check-no-failures.service"
      ln -s /usr/lib/systemd/system/bootc-publish-rhsm-facts.service "$d/bootc-status-updated-onboot.target.wants/bootc-publish-rhsm-facts.service"
      ln -s /usr/lib/systemd/system/bootc-publish-rhsm-facts.service "$d/bootc-status-updated.target.wants/bootc-publish-rhsm-facts.service"
      ln -s /usr/lib/systemd/system/systemd-networkd.service "$d/dbus-org.freedesktop.network1.service"
      ln -s /usr/lib/systemd/system/systemd-resolved.service "$d/dbus-org.freedesktop.resolve1.service"
      ln -s /usr/lib/systemd/system/systemd-timesyncd.service "$d/dbus-org.freedesktop.timesync1.service"
      ln -s /usr/lib/systemd/system/systemd-logind.service "$d/dbus-org.freedesktop.login1.service"
      ln -s /usr/lib/systemd/system/systemd-logind.service "$d/multi-user.target.wants/systemd-logind.service"
      ln -s /usr/lib/systemd/system/systemd-hostnamed.service "$d/dbus-org.freedesktop.hostname1.service"
      ln -s /usr/lib/systemd/system/systemd-timedated.service "$d/dbus-org.freedesktop.timedate1.service"
      ln -s /usr/lib/systemd/system/getty@.service "$d/getty.target.wants/getty@tty1.service"
      ln -s /usr/lib/systemd/system/osimage-boot-count.service "$d/multi-user.target.wants/osimage-boot-count.service"
      ln -s /usr/lib/systemd/system/tailscaled.service "$d/multi-user.target.wants/tailscaled.service"
      ln -s /usr/lib/systemd/system/docker.service "$d/multi-user.target.wants/docker.service"
      ln -s /usr/lib/systemd/system/docker.socket "$d/sockets.target.wants/docker.socket"
      ln -s /usr/lib/systemd/system/remote-fs.target "$d/multi-user.target.wants/remote-fs.target"
      ln -s /usr/lib/systemd/system/systemd-networkd.service "$d/multi-user.target.wants/systemd-networkd.service"
      ln -s /usr/lib/systemd/system/systemd-networkd-wait-online.service "$d/network-online.target.wants/systemd-networkd-wait-online.service"
      ln -s /usr/lib/systemd/system/systemd-factory-reset.socket "$d/sockets.target.wants/systemd-factory-reset.socket"
      ln -s /usr/lib/systemd/system/systemd-journalctl-metrics.socket "$d/sockets.target.wants/systemd-journalctl-metrics.socket"
      ln -s /usr/lib/systemd/system/systemd-journald-audit.socket "$d/sockets.target.wants/systemd-journald-audit.socket"
      ln -s /usr/lib/systemd/system/systemd-mountfsd.socket "$d/sockets.target.wants/systemd-mountfsd.socket"
      ln -s /usr/lib/systemd/system/systemd-networkd-resolve-hook.socket "$d/sockets.target.wants/systemd-networkd-resolve-hook.socket"
      ln -s /usr/lib/systemd/system/systemd-networkd-varlink-metrics.socket "$d/sockets.target.wants/systemd-networkd-varlink-metrics.socket"
      ln -s /usr/lib/systemd/system/systemd-networkd-varlink.socket "$d/sockets.target.wants/systemd-networkd-varlink.socket"
      ln -s /usr/lib/systemd/system/systemd-networkd.socket "$d/sockets.target.wants/systemd-networkd.socket"
      ln -s /usr/lib/systemd/system/systemd-nsresourced.socket "$d/sockets.target.wants/systemd-nsresourced.socket"
      ln -s /usr/lib/systemd/system/systemd-report-basic.socket "$d/sockets.target.wants/systemd-report-basic.socket"
      ln -s /usr/lib/systemd/system/systemd-report-cgroup.socket "$d/sockets.target.wants/systemd-report-cgroup.socket"
      ln -s /usr/lib/systemd/system/systemd-report-files.socket "$d/sockets.target.wants/systemd-report-files.socket"
      ln -s /usr/lib/systemd/system/systemd-report-sign-tsm.socket "$d/sockets.target.wants/systemd-report-sign-tsm.socket"
      ln -s /usr/lib/systemd/system/systemd-report.socket "$d/sockets.target.wants/systemd-report.socket"
      ln -s /usr/lib/systemd/system/systemd-resolved-monitor.socket "$d/sockets.target.wants/systemd-resolved-monitor.socket"
      ln -s /usr/lib/systemd/system/systemd-resolved-varlink.socket "$d/sockets.target.wants/systemd-resolved-varlink.socket"
      ln -s /usr/lib/systemd/system/systemd-storage-block.socket "$d/sockets.target.wants/systemd-storage-block.socket"
      ln -s /usr/lib/systemd/system/systemd-storage-fs.socket "$d/sockets.target.wants/systemd-storage-fs.socket"
      ln -s /usr/lib/systemd/system/systemd-sysupdate-notify-bootctl.socket "$d/sockets.target.wants/systemd-sysupdate-notify-bootctl.socket"
      ln -s /usr/lib/systemd/system/systemd-boot-clear-sysfail.service "$d/sysinit.target.wants/systemd-boot-clear-sysfail.service"
      ln -s /usr/lib/systemd/system/systemd-boot-update.service "$d/sysinit.target.wants/systemd-boot-update.service"
      ln -s /usr/lib/systemd/system/systemd-network-generator.service "$d/sysinit.target.wants/systemd-network-generator.service"
      ln -s /usr/lib/systemd/system/systemd-resolved.service "$d/sysinit.target.wants/systemd-resolved.service"
      ln -s /usr/lib/systemd/system/systemd-timesyncd.service "$d/sysinit.target.wants/systemd-timesyncd.service"
      ln -s /usr/lib/systemd/system/systemd-udev-load-credentials.service "$d/sysinit.target.wants/systemd-udev-load-credentials.service"
      ln -s /usr/lib/systemd/system/systemd-journald-audit.socket "$d/systemd-journald.service.wants/systemd-journald-audit.socket"

  - name: Smoke-check the payload
    runs: |
      ls -la "${{targets.destdir}}/etc/systemd/system/" | sed -n '1,12p'
      echo "autovt: $(readlink "${{targets.destdir}}/etc/systemd/system/autovt@.service" || echo MISSING)"
      test ! -e "${{targets.destdir}}/usr/bin/mount" && test ! -e "${{targets.destdir}}/usr/bin/umount"
      test ! -e "${{targets.destdir}}/usr/local/bin/umount"
      resolv="${{targets.destdir}}/etc/resolv.conf"
      test -f "$resolv" && test ! -L "$resolv"
      head -n 1 "$resolv" | grep -q '^#.*systemd-resolved'
      test "$(grep '^nameserver ' "$resolv")" = 'nameserver 127.0.0.53'
      test -f "${{targets.destdir}}/usr/lib/composefs/setup-root-conf.toml"
      test -f "${{targets.destdir}}/etc/machine-id" && test ! -s "${{targets.destdir}}/etc/machine-id"
      test "$(cat "${{targets.destdir}}/usr/lib/osimage/etc-seed/hostname")" = osimage
      ! grep -q '/etc/hostname' "${{targets.destdir}}/usr/lib/tmpfiles.d/osimage.conf"
      grep -q '^ConditionPathExists=!/var/lib/osimage/etc/machine-id$' "${{targets.destdir}}/usr/lib/systemd/system/systemd-machine-id-commit.service.d/osimage-state.conf"
      grep -q '^enabled = true$' "${{targets.destdir}}/usr/lib/composefs/setup-root-conf.toml"
      test "$(readlink "${{targets.destdir}}/etc/systemd/system/dbus-org.freedesktop.login1.service")" = /usr/lib/systemd/system/systemd-logind.service
      test "$(readlink "${{targets.destdir}}/etc/systemd/system/dbus-org.freedesktop.hostname1.service")" = /usr/lib/systemd/system/systemd-hostnamed.service
      test "$(readlink "${{targets.destdir}}/etc/systemd/system/dbus-org.freedesktop.timedate1.service")" = /usr/lib/systemd/system/systemd-timedated.service
      test "$(readlink "${{targets.destdir}}/etc/systemd/system/multi-user.target.wants/tailscaled.service")" = "/usr/lib/systemd/system/tailscaled.service"
      test "$(readlink "${{targets.destdir}}/etc/systemd/system/multi-user.target.wants/docker.service")" = "/usr/lib/systemd/system/docker.service"
      test "$(readlink "${{targets.destdir}}/etc/systemd/system/sockets.target.wants/docker.socket")" = "/usr/lib/systemd/system/docker.socket"
      grep -q 'console=ttyS0,115200' "${{targets.destdir}}/usr/lib/bootc/kargs.d/10-console.toml"
      grep -q 'root=gpt-auto' "${{targets.destdir}}/usr/lib/bootc/kargs.d/20-root.toml"
      grep -q '"panic=10"' "${{targets.destdir}}/usr/lib/bootc/kargs.d/30-panic.toml"
      grep -q '^kernel.panic = 10$' "${{targets.destdir}}/usr/lib/sysctl.d/50-osimage-panic.conf"
      grep -q '^RuntimeWatchdogSec=30s$' "${{targets.destdir}}/usr/lib/systemd/system.conf.d/10-osimage-watchdog.conf"
      grep -q '^DefaultEnvironment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin$' "${{targets.destdir}}/usr/lib/systemd/system.conf.d/20-osimage-path.conf"
      test "$(readlink "${{targets.destdir}}/etc/systemd/system/autovt@.service")" = "/usr/lib/systemd/system/getty@.service"
      test "$(readlink "${{targets.destdir}}/etc/systemd/system/multi-user.target.wants/systemd-networkd.service")" = "/usr/lib/systemd/system/systemd-networkd.service"

test:
  environment:
    contents:
      keyring:
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
        - alpine-baselayout=3.7.2-r1
  pipeline:
    - name: Enablement symlinks and osimage units are in place
      runs: |
        test -f /etc/machine-id
        test "$(readlink /etc/systemd/system/multi-user.target.wants/osimage-boot-count.service)" = "/usr/lib/systemd/system/osimage-boot-count.service"
        test "$(readlink /etc/systemd/system/sysinit.target.wants/systemd-boot-update.service)" = "/usr/lib/systemd/system/systemd-boot-update.service"
        test "$(readlink /etc/systemd/system/sockets.target.wants/systemd-networkd.socket)" = "/usr/lib/systemd/system/systemd-networkd.socket"
        test "$(readlink /etc/systemd/system/bootc-status-updated.target.wants/bootc-publish-rhsm-facts.service)" = "/usr/lib/systemd/system/bootc-publish-rhsm-facts.service"
        test -f /usr/lib/systemd/system-preset/10-osimage.preset
        test -f /usr/lib/systemd/system/osimage-boot-count.service
        test -f /usr/lib/tmpfiles.d/osimage.conf
        test "$(readlink /etc/systemd/system/local-fs.target.wants/tmp.mount)" = "/usr/lib/systemd/system/tmp.mount"
        test -f /usr/lib/composefs/setup-root-conf.toml
    - name: Shared digest parsing covers BLS options and UKI wrappers
      runs: |
        . /usr/libexec/osimage-boot-common
        d=$(mktemp -d)
        echo 'options root=UUID=x rw composefs.digest=repo:0123456789abcdef extra' \
          > "$d/type1.conf"
        test "$(entry_composefs_digest "$d/type1.conf")" = 0123456789abcdef
        echo 'uki /EFI/Linux/bootc/bootc_composefs-0123456789abcdef.efi' \
          > "$d/uki.conf"
        test "$(entry_composefs_digest "$d/uki.conf")" = 0123456789abcdef
        echo 'efi /EFI/Linux/bootc/bootc_composefs-fedcba9876543210.efi' \
          > "$d/efi.conf"
        test "$(entry_composefs_digest "$d/efi.conf")" = fedcba9876543210
        echo 'uki /EFI/Linux/other-12345678.efi' > "$d/nonbootc.conf"
        test -z "$(entry_composefs_digest "$d/nonbootc.conf")"
        rm -rf "$d"

update:
  enabled: false
  exclude-reason: no upstream to track; version is internal to this repository
