package:
  name: cocoon
  version: 0.15
  epoch: 1
  description: An atproto PDS (Bluesky) server
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - libgcc=15.2.0-r5
      - musl=1.2.6-r3
      - tzdata=2026f-r0
      - secret-env=0.2.0-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - gcc=15.2.0-r5
      - git=2.54.1-r0
      - go=1.27.4-r1
      - musl-dev=1.2.6-r3
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ec9eb1809820faeb8a991eb2221112a0df8cc289
      repository: https://github.com/haileyok/cocoon
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/cocoon
      output: cocoon
      static: "false"
      ldflags: -X main.Version=v${{package.version}}
  - uses: license/install
  - uses: go/credits
    with:
      skip-missing: "true"
  - uses: secret-env/wrap
    with:
      name: cocoon
      config: secret-env/cocoon.conf
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/cocoon
        files: /usr/share/licenses/cocoon/LICENSE /usr/share/licenses/cocoon/CREDITS
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/cocoon)" = /usr/bin/secret-env
        test -x /usr/libexec/cocoon.real
        grep -qx 'path = /usr/libexec/cocoon.real' /etc/secret-env/cocoon.conf
update:
  enabled: true
  github:
    identifier: haileyok/cocoon
    strip-prefix: v
