package:
  name: irc-github
  version: 4.0.5
  epoch: 6
  description: irc-bot plugin announcing GitHub events in IRC channels
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0
      - secret-env=0.1.0-r2

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ca32c4e4ad5dc5a4bee2461b3634a40b818de3f6
      repository: https://github.com/greboid/irc-github
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/github
      output: irc-github
      static: "true"
  - uses: license/install
  - uses: go/credits
  - uses: secret-env/wrap
    with:
      name: irc-github
      config: secret-env/irc-github.conf
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/irc-github
        files: /usr/share/licenses/irc-github/LICENSE /usr/share/licenses/irc-github/CREDITS
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/irc-github)" = /usr/bin/secret-env
        test -x /usr/libexec/irc-github.real
        grep -qx 'path = /usr/libexec/irc-github.real' /etc/secret-env/irc-github.conf
update:
  enabled: true
  github:
    identifier: greboid/irc-github
    strip-prefix: v
    use-tag: true
