package:
  name: fuse-overlay-storage-conf
  version: 1.0.0
  epoch: 0
  description: containers-storage configuration pinning the fuse-overlayfs mount program
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: os-release.license
      license: MIT

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - os-release=3.24.2-r0

pipeline:
  - name: Install the fuse-overlayfs storage configuration
    runs: install -Dm644 storage.conf "${{targets.destdir}}/usr/share/fuse-overlay-storage-conf/storage.conf"
  - name: Smoke-check the payload
    runs: |
      test -s "${{targets.destdir}}/usr/share/fuse-overlay-storage-conf/storage.conf"
      grep -q '^driver = "overlay"$' "${{targets.destdir}}/usr/share/fuse-overlay-storage-conf/storage.conf"
      grep -q '^mount_program = "/usr/bin/fuse-overlayfs"$' "${{targets.destdir}}/usr/share/fuse-overlay-storage-conf/storage.conf"
test:
  environment:
    contents:
      keyring:
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - busybox=1.37.0-r31
        - os-release=3.24.2-r0
  pipeline:
    - name: Storage configuration is private and pins fuse-overlayfs
      runs: |
        test -s /usr/share/fuse-overlay-storage-conf/storage.conf
        grep -q '^mount_program = "/usr/bin/fuse-overlayfs"$' /usr/share/fuse-overlay-storage-conf/storage.conf
        test ! -e /etc/containers/storage.conf
update:
  enabled: false
  exclude-reason: no upstream to track; version is internal to this repository
