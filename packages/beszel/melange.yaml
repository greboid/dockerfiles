package:
  name: beszel
  version: 0.21.2
  epoch: 0
  description: Lightweight server monitoring hub with web UI and agent
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - go-licenses=2.0.1-r18
      - nodejs=24.22.3-r0
      - npm=11.12.1-r0
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c97759f0ca4badc824ab0ff43f1571cc3c8f3a72
      repository: https://github.com/henrygd/beszel
      tag: v${{package.version}}
  - name: Build web UI
    runs: |
      cd internal/site
      npm ci --no-audit --no-fund
      npm run build
  - uses: go/build
    with:
      packages: ./internal/cmd/hub
      output: beszel
      static: "true"
  - uses: go/build
    with:
      packages: ./internal/cmd/agent
      output: beszel-agent
      static: "true"
  - uses: go/licenses
    with:
      module: github.com/henrygd/beszel
      license: LICENSE

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/beszel /usr/bin/beszel-agent
        files: /notices/github.com/henrygd/beszel/LICENSE /usr/share/licenses/beszel/LICENSE
    - name: Hub reports its version
      runs: |
        /usr/bin/beszel --version

update:
  enabled: true
  github:
    identifier: henrygd/beszel
    strip-prefix: v
    use-tag: true
