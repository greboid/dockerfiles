package:
  name: bailer
  version: 0.2.0
  epoch: 8
  description: Docker volume backup tool with local and restic backends
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0
      - restic=0.20.0-r0
      - secret-env=0.2.0-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - os-release=3.24.2-r0

vars:
  runtime-dirs: /backups

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ed732f7c862e742885d1beeca502d8675e3a5ce7
      repository: https://git.mouse-lake.ts.net/greboid/bailer
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: bailer
      static: "true"
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
  - uses: license/install
    with:
      license: LICENCE
  - uses: go/credits
  - uses: secret-env/wrap
    with:
      name: bailer
      config: secret-env/bailer.conf

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/bailer
        files: /usr/share/licenses/bailer/LICENCE /usr/share/licenses/bailer/CREDITS
        dirs: ${{vars.runtime-dirs}}
    - name: Prints usage when invoked with -h
      runs: |
        out=$(/usr/bin/bailer -h 2>&1)
        echo "$out" | grep -q "restic-bin"
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/bailer)" = /usr/bin/secret-env
        test -x /usr/libexec/bailer.real
        grep -qx 'path = /usr/libexec/bailer.real' /etc/secret-env/bailer.conf

update:
  enabled: true
  github:
    identifier: greboid/bailer
    strip-prefix: v
    use-tag: true
