package:
  name: thp
  version: 1.2.4
  epoch: 1
  description: Tailscale HTTP proxy forwarding tailnet requests to an upstream
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r2
      - tzdata=2026e-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r2
      - git=2.54.0-r0
      - go=1.27.3-r2
      - go-licenses=2.0.1-r14
      - os-release=3.24.2-r0

vars:
  runtime-dirs: /config

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d80cf6af7517577e67d5cfa754acd69221e5a6e5
      repository: https://github.com/greboid/thp
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: thp
      static: "true"
      experiments: jsonv2
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
  - uses: go/licenses
    with:
      module: github.com/greboid/thp
      license: LICENCE
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/thp
        files: /notices/github.com/greboid/thp/LICENCE /usr/share/licenses/thp/LICENCE
        dirs: ${{vars.runtime-dirs}}
    - name: Refuses to start without an upstream
      runs: |
        if /usr/bin/thp >/tmp/thp.log 2>&1; then
          echo "expected missing-upstream failure" >&2
          exit 1
        fi
        grep -q "Upstream host cannot be blank" /tmp/thp.log
update:
  enabled: true
  github:
    identifier: greboid/thp
    strip-prefix: v
    use-tag: true
