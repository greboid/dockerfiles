package:
  name: osimage-passwd
  version: 1.0.0
  epoch: 0
  description: osimage password tooling (set or lock local account passwords on a sealed /etc)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      license: MIT
  dependencies:
    runtime:
      - busybox-binsh=1.37.0-r31

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - os-release=3.24.2-r0
      - busybox=1.37.0-r31

pipeline:
  - name: Install the password tool
    runs: |
      install -Dm 0755 osimage-passwd "${{targets.destdir}}/usr/bin/osimage-passwd"

test:
  environment:
    contents:
      keyring:
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - name: Tool is present and refuses to run outside an osimage system
      runs: |
        test -x /usr/bin/osimage-passwd
        if /usr/bin/osimage-passwd 2> err; then
          exit 1
        fi
        grep -Eq 'must be run as root|/var/lib/osimage/etc/shadow missing' err

update:
  enabled: false
  exclude-reason: no upstream to track; version is internal to this repository
