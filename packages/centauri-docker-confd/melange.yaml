package:
  name: centauri-docker-confd
  version: 1.6.5
  epoch: 1
  description: Generates centauri route configuration from Docker containers
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0
      - secret-env=0.1.0-r2

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1b9a74a756c45d64535fa18ee7b2918e4bc9d4b6
      repository: https://github.com/csmith/centauri-docker-confd
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: centauri-docker-confd
      static: "true"
  - uses: license/install
    with:
      license: LICENCE
  - uses: go/credits
  - uses: secret-env/wrap
    with:
      name: centauri-docker-confd
      config: secret-env/centauri-docker-confd.conf
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/centauri-docker-confd
        files: /usr/share/licenses/centauri-docker-confd/LICENCE /usr/share/licenses/centauri-docker-confd/CREDITS
    - name: Fails loudly without a Docker daemon
      runs: |
        if /usr/bin/centauri-docker-confd >/tmp/confd.log 2>&1; then
          echo "expected failure without a Docker daemon" >&2
          exit 1
        fi
        grep -qiE "docker|containuum|failed" /tmp/confd.log
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/centauri-docker-confd)" = /usr/bin/secret-env
        test -x /usr/libexec/centauri-docker-confd.real
        grep -qx 'path = /usr/libexec/centauri-docker-confd.real' /etc/secret-env/centauri-docker-confd.conf
update:
  enabled: true
  github:
    identifier: csmith/centauri-docker-confd
    strip-prefix: v
