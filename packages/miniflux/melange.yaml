package:
  name: miniflux
  version: 2.3.5
  epoch: 5
  description: Minimalist and opinionated feed reader
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: miniflux.license
      license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0
      - secret-env=0.1.0-r2

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - os-release=3.24.2-r0

vars:
  commit: c4d54f87a81b30aa173fddf05d7ff83ae7da5796

pipeline:
  - uses: git-checkout
    with:
      expected-commit: faecfa2fac61a91f4f69550bb1afd506c4b51749
      repository: https://github.com/miniflux/v2
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: miniflux
      ldflags: -X miniflux.app/v2/internal/version.Version=${{package.version}} -X miniflux.app/v2/internal/version.Commit=${{vars.commit}}
  - uses: license/install
  - uses: go/credits
  - uses: secret-env/wrap
    with:
      name: miniflux
      config: secret-env/miniflux.conf

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        files: /usr/share/licenses/miniflux/LICENSE /usr/share/licenses/miniflux/CREDITS
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/miniflux)" = /usr/bin/secret-env
        test -x /usr/libexec/miniflux.real
        grep -qx 'path = /usr/libexec/miniflux.real' /etc/secret-env/miniflux.conf
update:
  enabled: true
  github:
    identifier: miniflux/v2
