package:
  name: httpredirect
  version: 1.2.0
  epoch: 5
  description: Configurable HTTP redirect service
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle=20261020-r4
      - tzdata=2026f-r0
      - secret-env=0.1.0-r2

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates=20261020-r4
      - git=2.54.1-r0
      - go=1.27.4-r1
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f9712f89e6c4720a5235ab9698d3067a9ca6189c
      repository: https://github.com/greboid/httpredirect
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: httpredirect
      static: "true"
  - uses: license/install
  - uses: go/credits
  - uses: secret-env/wrap
    with:
      name: httpredirect
      config: secret-env/httpredirect.conf
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox=1.37.0-r31
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/httpredirect
        files: /usr/share/licenses/httpredirect/LICENSE /usr/share/licenses/httpredirect/CREDITS
    - name: Runs through secret-env
      runs: |
        test "$(readlink /usr/bin/httpredirect)" = /usr/bin/secret-env
        test -x /usr/libexec/httpredirect.real
        grep -qx 'path = /usr/libexec/httpredirect.real' /etc/secret-env/httpredirect.conf
update:
  enabled: true
  github:
    identifier: greboid/httpredirect
    strip-prefix: v
    use-tag: true
