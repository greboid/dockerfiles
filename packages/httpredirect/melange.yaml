package:
  name: httpredirect
  version: 1.1.0
  epoch: 12
  description: Configurable HTTP redirect service
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.27.1-r24
      - go-licenses=2.0.1-r0
      - os-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d85cee11f460aaad5d1055df256b815a6dc4d5c8
      repository: https://github.com/greboid/httpredirect
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: httpredirect
      static: "true"
  - uses: go/licenses
    with:
      module: github.com/greboid/httpredirect
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/httpredirect
        files: /notices/github.com/greboid/httpredirect/LICENSE /usr/share/licenses/httpredirect/LICENSE
update:
  enabled: true
  github:
    identifier: greboid/httpredirect
    strip-prefix: v
    use-tag: true
