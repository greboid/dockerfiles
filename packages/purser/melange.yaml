package:
  name: purser
  version: 1.2.0
  epoch: 4
  description: Periodic vulnerability reports for the local Docker containers
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=2.0.1-r11
      - os-release=3.24.2-r0
  environment:
    GOEXPERIMENT: jsonv2

vars:
  runtime-dirs: /data/cache /data/output

pipeline:
  - uses: git-checkout
    with:
      expected-commit: dbd4500ecbe92891ce3e933fc1b78a8fb4acd0cf
      repository: https://github.com/csmith/purser
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: purser
      static: "true"
      experiments: jsonv2
  - uses: dirs
    with:
      dirs: ${{vars.runtime-dirs}}
  - uses: go/licenses
    with:
      ignore-extra: github.com/xi2/xz github.com/cyberphone/json-canonicalization/go/src/webpki.org/jsoncanonicalizer github.com/in-toto/in-toto-golang/in_toto github.com/in-toto/in-toto-golang/in_toto/slsa_provenance/common github.com/in-toto/in-toto-golang/in_toto/slsa_provenance/v0.1 github.com/in-toto/in-toto-golang/in_toto/slsa_provenance/v0.2 github.com/in-toto/in-toto-golang/in_toto/slsa_provenance/v1 github.com/in-toto/attestation/go/v1
      module: github.com/csmith/purser
      license: LICENCE
test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
      packages:
        - os-release=3.24.2-r0
        - busybox
  pipeline:
    - uses: test/paths
      with:
        executables: /usr/bin/purser
        files: /notices/github.com/csmith/purser/LICENCE /usr/share/licenses/purser/LICENCE
        dirs: ${{vars.runtime-dirs}}
    - name: Fails without a Docker daemon
      runs: |
        if /usr/bin/purser >/tmp/purser.log 2>&1; then
          echo "expected missing-daemon failure" >&2
          exit 1
        fi
        grep -q "Failed to scan containers" /tmp/purser.log
update:
  enabled: true
  github:
    identifier: csmith/purser
    strip-prefix: v
