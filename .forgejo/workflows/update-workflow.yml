on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**/Containerfile'
      - '**/Dockerfile'
      - 'README.md'
name: Update Workflow
jobs:
  update-workflow:
    runs-on: alpine
    outputs:
      changes: ${{ steps.commit.outputs.changes_detected }}
    steps:
      - name: Checkout source
        uses: actions/toolkit/git-checkout@master
        with:
          token: ${{ secrets.CONTEMPT_TOKEN }}
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - name: Cache orchestrator
        uses: actions/cache@v6
        id: cache
        with:
          path: ~/go/bin/orchestrator
          key: orchestrator-${{ runner.os }}-${{ runner.arch }}-latest
      - name: Install latest orchestrator
        if: steps.cache.outputs.cache-hit != 'true'
        run: go install github.com/csmith/contempt/cmd/orchestrator@latest
      - name: Run contempt orchestrator
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          TEMPLATE: .forgejo/workflows/update-containers.yml.gotpl
          OUTPUT: .forgejo/workflows/update-containers.yml
        run: orchestrator "$PWD"
      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
            commit_message: "Update container workflow"
            commit_user_name: ${{ secrets.GIT_USERNAME }}
            commit_user_email: ${{ secrets.GIT_EMAIL }}
            file_pattern: '.forgejo/workflows/update-containers.yml'
      - name: Push changes
        uses: cutlerydrawer/action-git-try-push@v2.0.1
  update-containers:
    name: Update Containers
    needs:
      - update-workflow
    if: needs.update-workflow.outputs.changes != 'true'
    uses: ./.forgejo/workflows/update-containers.yml
    secrets: inherit
