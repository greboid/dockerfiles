on:
  workflow_dispatch:
  schedule:
    - cron: '42 12 * * *'
  workflow_call:
name: Update Containers
concurrency: dockerfiles
jobs:
  alpine:
    name: Build alpine
    uses: ./.forgejo/workflows/container-builder.yml
    secrets: inherit
    with:
        PROJECT_NAME: alpine

  baseroot:
    name: Build baseroot
    needs:
        - alpine
    uses: ./.forgejo/workflows/container-builder.yml
    secrets: inherit
    with:
        PROJECT_NAME: baseroot

  git:
    name: Build git
    needs:
        - alpine
    uses: ./.forgejo/workflows/container-builder.yml
    secrets: inherit
    with:
        PROJECT_NAME: git

  golang:
