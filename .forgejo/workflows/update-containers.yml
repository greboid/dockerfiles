    needs:
        - alpine
    uses: ./.forgejo/workflows/container-builder.yml
    secrets: inherit
    with:
        PROJECT_NAME: golang

  rust:
    name: Build rust
    needs:
        - alpine
    uses: ./.forgejo/workflows/container-builder.yml
    secrets: inherit
    with:
        PROJECT_NAME: rust

  alpine-runner:
    name: Build alpine-runner
    needs:
        - alpine
        - golang
    uses: ./.forgejo/workflows/container-builder.yml
    secrets: inherit
    with:
        PROJECT_NAME: alpine-runner

  base:
    name: Build base
    needs:
        - baseroot
    uses: ./.forgejo/workflows/container-builder.yml
    secrets: inherit
    with:
        PROJECT_NAME: base

  centauri:
