name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

enable-openid-connect: true

concurrency:
  group: build

jobs:
  build:
    runs-on: alpine
    env:
      ORG_REPO: https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    steps:
      - name: Checkout
        uses: actions/toolkit/git-checkout@master

      - name: Trust the org repository and install apko
        run: |
          set -eu
          curl -fsSL --retry 3 -o key.rsa.pub "${ORG_REPO%/*/*}/key"
          hash=$(openssl pkey -pubin -in key.rsa.pub -outform DER | sha256sum | cut -d' ' -f1)
          mv key.rsa.pub "/etc/apk/keys/packages@$hash.rsa.pub"
          echo "ORG_KEY=/etc/apk/keys/packages@$hash.rsa.pub" >> "$GITHUB_ENV"
          echo "$ORG_REPO" >> /etc/apk/repositories
          apk update
          apk add --no-cache apko
          apko version

      - name: Login to the Forgejo container registry
        uses: actions/toolkit/docker-login@master
        with:
          registry: git.mouse-lake.ts.net
          username: greboid
          password: ${{ secrets.RELEASE_PACKAGE_TOKEN }}
      - name: Compute tags
        run: |
          version_tag="$(date -u +%Y.%m.%d | sed 's/\.0/./g')-alpine3.24"
          {
            echo "IMAGE_TAG=git.mouse-lake.ts.net/containers/irc-webhook:${version_tag}"
            echo "IMAGE_LATEST=git.mouse-lake.ts.net/containers/irc-webhook:latest"
          } >> "$GITHUB_ENV"

      - name: Build and publish
        run: apko publish -k "$ORG_KEY" apko.yaml "$IMAGE_TAG" "$IMAGE_LATEST"
