# Extensible IRC bot. Configure the connection via SERVER, NICK, CHANNELS
# and friends (kouhin/envflag: flags map to upper-snake env vars) or flags.
# Listens locally on 8001 (gRPC for plugins) and 8000 (web server) by
# default; the legacy EXPOSE 8080 matched neither listener and is not kept.
# No writable state; plugins register over gRPC.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - irc-bot=5.0.8-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /irc-bot
