# irc-bot plugin offering webhook-to-IRC relaying with per-token
# management. Registers with the bot's gRPC endpoint: configure
# RPC_HOST/RPC_PORT/RPC_TOKEN, CHANNEL, ALLOWED_CHANNELS and ADMIN_KEY.
# Token database defaults to DB_PATH=/data/db — mount a writable directory
# there for persistence.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - irc-webhook=4.1.1-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /irc-webhook
