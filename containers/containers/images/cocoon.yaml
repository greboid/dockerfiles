# An atproto PDS (Bluesky). `run` (the image's default argument) serves on
# :8080 (COCOON_ADDR / --addr). Configure via COCOON_* environment variables
# or flags (--did, --contact-email, --hostname, --admin-password,
# --session-secret are all required). Use COCOON_DB_TYPE=postgres with
# COCOON_DATABASE_URL/DATABASE_URL: the sqlite driver is a cgo stub in this
# CGO_ENABLED=0 build (same as the legacy image).
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - cocoon=0.11.3-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /cocoon

cmd: run
