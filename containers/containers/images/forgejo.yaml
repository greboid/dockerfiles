# Forgejo self-hosted forge serving on :3000 (internal SSH on :22 when
# enabled). Repositories, the database and attachments live under /data
# (FORGEJO_WORK_DIR) — mount it writable. Git, bash and rsync come from
# Alpine (the legacy image hand-copied the same tooling into the rootfs).
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - forgejo=16.0.5-r0
    - git=2.54.0-r0
    - bash=5.3.9-r1
    - rsync=3.5.0-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

# The legacy image chowns /data to the runtime user; apko only fixes up
# home directories, so do it here (mirrors the packaged directory).
paths:
  - path: /data
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  FORGEJO_WORK_DIR: /data
  HOME: /home/nonroot

entrypoint:
  command: /forgejo

cmd: web
