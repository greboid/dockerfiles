# Immich server with the embedded web build (served on :2283). Repositories,
# uploads and the database are configured by the instance; the upload
# directory (IMMICH_MEDIA_LOCATION=/usr/src/app/upload) must be mounted
# writable. ffmpeg/ffprobe resolve through PATH (jellyfin-ffmpeg, for HDR
# tone-mapping); libvips/sharp handle HEIC/AVIF.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - immich=3.2.0-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

paths:
  - path: /usr/src/app/upload
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  NODE_ENV: production
  IMMICH_ENV: production
  IMMICH_MEDIA_LOCATION: /usr/src/app/upload
  IMMICH_BUILD_DATA: /usr/src/app
  HOME: /home/nonroot
  LIBC: musl

work-dir: /usr/src/app/server

entrypoint:
  command: node /usr/src/app/server/dist/main
