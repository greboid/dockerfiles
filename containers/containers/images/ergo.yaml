# Ergo image: consumes the package from the Forgejo Alpine repository
# appended by the image-release workflow.
#
# Runtime contract (matching the previous Containerfile):
#   - mount the operator-supplied configuration at /ircd/ircd.yaml
#   - configure languages.path as /ircd-bin/languages when enabling it
#   - make configured database/log/certificate paths accessible to 65532
#   - listeners, TLS and persistent storage are controlled by the config
# No config, certificates or database are generated by the image.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - ergo=2.19.1-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

entrypoint:
  command: /ergo
cmd: run --conf /ircd/ircd.yaml
