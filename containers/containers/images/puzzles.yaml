# Puzzle helper web service listening on :8080 (not configurable).
# Static assets and templates are embedded in the binary; wordlists are
# read from /app/wordlists (WORDLIST_DIR overrides) and shipped in the
# package. Endpoints: /anagram, /match, /morse, /t9, /analyse,
# /exifUpload, /flags; / redirects to puzzles.mdbot.uk. No writable
# storage is required.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - puzzles=1.0.3-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /puzzles
