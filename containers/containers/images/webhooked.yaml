# Ensures the configured webhook (TOKEN and URL are required) exists on all
# of a user's GitHub repositories; with no TOKEN or URL it prints usage and
# exits 0. MONITOR below one minute runs a single pass and exits; otherwise
# it rescans every MONITOR. OWNER, CONTENT_TYPE, SECRET and EVENTS
# customize the hook. No listener and no persistent state.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - webhooked=1.1.0-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /webhooked
