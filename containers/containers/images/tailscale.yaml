# Tailscale userspace container node: containerboot drives tailscaled
# (socket at /var/run/tailscale/tailscaled.sock — the directory is created
# at startup; state lives in /var/lib/tailscale, mounted writable). The
# default extra args use userspace networking (TS_TAILSCALED_EXTRA_ARGS);
# provide TS_AUTHKEY (or complete interactive auth) and TS_HOSTNAME etc.
# as needed.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - tailscale=1.102.5-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

# The legacy image chowned the state directory to the runtime user; apko
# only fixes up home directories, so do it here (mirrors the packaged
# directory).
paths:
  - path: /var/lib/tailscale
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  TS_SOCKET: /var/run/tailscale/tailscaled.sock
  TS_STATE_DIR: /var/lib/tailscale
  TS_TAILSCALED_EXTRA_ARGS: --tun=tailscale0,userspace-networking

entrypoint:
  command: /containerboot
