# Prunes stopped containers and unused images through the Docker API
# (DOCKER_HOST / standard Docker client environment variables). DURATION
# below one minute runs a single pass and exits; otherwise it repeats every
# DURATION. ALLIMAGES=true also removes non-dangling unused images and
# CONTAINERS=false skips container pruning. No listener and no persistent
# state (the legacy image's EXPOSE 8080 was vestigial and is not kept).
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - dockercleanup=1.0.0-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /dockercleanup
