# PostgreSQL 18 with pgvector. On first start (empty /data) entry.sh
# initializes the cluster: set POSTGRES_PASSWORD (or
# POSTGRES_HOST_AUTH_METHOD=trust, not recommended), optionally
# POSTGRES_USER/POSTGRES_DB. Serve TCP with the default arguments; local
# sockets use /tmp. Mount /var/lib/postgresql/data writable (owned
# 65532). STOPSIGNAL is SIGINT for fast shutdown.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - postgres-18=18.6-r0
    - pgvector=0.8.6-r0
    - musl-locales=0.1.0-r1
    - bash=5.3.9-r1
    - busybox=1.37.0-r31

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

paths:
  - path: /var/lib/postgresql/data
    type: directory
    permissions: 0o750
    uid: 65532
    gid: 65532
    recursive: true
  - path: /tmp
    type: directory
    permissions: 0o1777
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  PATH: /usr/local/pgsql/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  LANG: en_US.utf8
  PGDATA: /var/lib/postgresql/data
  PGHOST: 127.0.0.1
  PGUSER: postgres

stop-signal: SIGINT

entrypoint:
  command: /usr/local/bin/entry.sh

cmd: postgres -c listen_addresses=*
