# Exposes an upstream HTTP service over Tailscale (optionally Funnel).
# Requires UPSTREAM (e.g. http://localhost:8080); tsnet state lives in
# /config (the flag's relative default) — mount a writable directory there
# and provide TAILSCALE_AUTHKEY or complete interactive auth once.
# TAILSCALE_HOSTNAME, SSL, FUNNEL, AUTHHEADERS and REDIRECT customize the
# frontend.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - thp=1.2.2-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

# The legacy image chowns /config to the runtime user; apko only fixes up
# home directories, so do it here (mirrors the packaged directory).
paths:
  - path: /config
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /thp
