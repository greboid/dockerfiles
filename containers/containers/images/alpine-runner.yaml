# CI job image for Forgejo Actions: an Alpine rootful shell environment with
# apk, the declared custom Buildah (source-built v1.45.1, not Alpine's
# 1.44.0) and the legacy build tooling. The Forgejo runner executes jobs
# with this image directly (`docker run IMAGE <script>`); no entrypoint —
# the shell CMD must be replaceable (`docker run IMAGE go version`).
#
# Rootful by legacy design (default root), with runtime apk install ability:
# apk-tools, trusted Alpine keys and CDN repositories survive in the image,
# and the local dist/ repository stays a build-only apko input so
# /etc/apk/repositories only ever names Alpine mirrors.
#
# Buildah storage: containers-common owns /etc/containers/storage.conf, so
# the legacy overlay-over-fuse configuration ships at
# /usr/share/alpine-runner/storage.conf (package alpine-runner) and is
# selected via CONTAINERS_STORAGE_CONF, as in the forgejo-runner image.
# Effective behavior matches the legacy COPY: overlay with fuse-overlayfs.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  packages:
    # Base OS metadata, shell and runtime package management. The declared
    # accounts below make apko generate /etc/passwd and /etc/group (buildah
    # resolves the current user through /etc/passwd; the legacy minirootfs
    # parent had these entries too).
    - os-release=3.24.2-r0
    - alpine-keys=2.6-r0
    - apk-tools=3.0.8-r0
    - busybox=1.37.0-r31
    - busybox-binsh=1.37.0-r31
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    # Declared custom Buildah and its storage/network stack (containers-
    # common, fuse3-libs, fuse-common, gpgme-less linkage and the shared
    # libraries resolve transitively from these pins).
    - buildah=1.45.1-r0
    - containers-common=0.64.2-r0
    - fuse-overlayfs=1.16-r0
    - fuse3=3.18.3-r0
    - netavark=1.17.2-r0
    # buildah links libgpgme (the legacy runtime image installed it too);
    # the ELF-derived so: dependency only resolves if the library ships.
    - gpgme=2.0.1-r1
    - alpine-runner=1.0.0-r0
    # Declared CI runtime tools from the legacy image: VCS, fetch, TLS and
    # the gnupg tool stack (gpg/gpg-agent/gpgsm/dirmngr/... via the meta
    # package), as the legacy image installed them.
    - git=2.54.0-r0
    - curl=8.22.0-r0
    - wget=1.25.0-r3
    - openssl=3.5.9-r0
    - gnupg=2.4.9-r1

accounts:
  # Legacy default root (run-as 0), with the repository-standard nonroot
  # 65532 declared so /etc/passwd and /etc/group are generated; build
  # stages may drop to nonroot and write to its home, as in the other
  # images.
  run-as: 0
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

paths:
  - path: /root
    type: directory
    permissions: 0o700
    uid: 0
    gid: 0
  # Legacy minirootfs scratch space; buildah stages its temporary context
  # directories here.
  - path: /var/tmp
    type: directory
    permissions: 0o1777

environment:
  LANG: en_US.UTF-8
  HOME: /root
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  CONTAINERS_STORAGE_CONF: /usr/share/alpine-runner/storage.conf

# Legacy Alpine parent interface: CMD ["/bin/sh"], no entrypoint, workdir /.
cmd: /bin/sh
work-dir: /
