# Filtering proxy in front of the Docker socket. Expects the socket at
# /var/run/docker.sock (SOCKET overrides); listens on 8080 (PROXYPORT).
# Restrict destructive calls with KILLSIGNALS; ALLOWPULLS enables image
# pulls. No persistent state.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - dsp=1.2.6-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /dsp
