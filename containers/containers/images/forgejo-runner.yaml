# Forgejo Actions runner. Register against the instance, then it polls for
# jobs; registration state and the job workspace live in /data (the image
# working directory) — mount it writable. Jobs run through buildah
# (Alpine's package) with fuse-overlayfs; the legacy overlay-over-fuse
# storage configuration ships at
# /usr/share/forgejo-runner/storage.conf, selected via
# CONTAINERS_STORAGE_CONF (containers-common owns the default path).
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - forgejo-runner=13.2.0-r0
    - buildah=1.44.0-r1
    - git=2.54.0-r0
    - fuse-overlayfs=1.16-r0
    - gnupg=2.4.9-r1

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

# The legacy image chowns /data to the runtime user; apko only fixes up
# home directories, so do it here (mirrors the packaged directory).
paths:
  - path: /data
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  HOME: /home/nonroot
  CONTAINERS_STORAGE_CONF: /usr/share/forgejo-runner/storage.conf

work-dir: /data

entrypoint:
  command: /forgejo-runner
