# Mirrors GitHub repositories for local cloning. Requires AUTHTOKEN (a
# personal access token); repositories are cloned under
# CHECKOUTPATH=/data — mount a writable directory there. DURATION sets the
# sync interval (>= 1m keeps it running), STARRED includes starred repos.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - githubmirror=1.0.3-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /githubmirror
