# Reusable, rootful build stage: keep /usr/local/go, /go and the shell CMD.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  packages:
    - os-release=3.24.2-r0
    - alpine-keys=2.6-r0
    - apk-tools=3.0.8-r0
    - busybox=1.37.0-r31
    - busybox-binsh=1.37.0-r31
    - golang-builder=1.27.1-r0
    - go-licenses-builder=2.0.1-r0
    - binutils=2.45.1-r1
    - brotli-libs=1.2.0-r1
    - c-ares=1.34.8-r0
    - ca-certificates-bundle=20260909-r0
    - gcc=15.2.0-r5
    - git=2.54.0-r0
    - gmp=6.3.0-r4
    - isl25=0.25-r2
    - jansson=2.15.0-r0
    - libatomic=15.2.0-r5
    - libcrypto3=3.5.9-r0
    - libcurl=8.22.0-r0
    - libexpat=2.8.5-r0
    - libgcc=15.2.0-r5
    - libgcc-static=15.2.0-r5
    - libgomp=15.2.0-r5
    - libidn2=2.3.8-r0
    - libpsl=0.21.5-r3
    - libssl3=3.5.9-r0
    - libstdc++=15.2.0-r5
    - libunistring=1.4.2-r0
    - mpc1=1.3.1-r1
    - mpfr4=4.2.2-r0
    - musl=1.2.6-r2
    - musl-dev=1.2.6-r2
    - nghttp2-libs=1.70.0-r0
    - patch=2.8-r0
    - pcre2=10.48-r0
    - zlib=1.3.2-r0
    - zstd-libs=1.5.7-r2

accounts:
  # Legacy default root (run-as 0); the repository-standard nonroot 65532
  # is declared so /etc/passwd and /etc/group are generated, and build
  # stages may drop to nonroot and write its home, as in the other images.
  run-as: 0
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

paths:
  - path: /go
    type: directory
    permissions: 0o777
  - path: /go/src
    type: directory
    permissions: 0o777
  - path: /go/bin
    type: directory
    permissions: 0o777

environment:
  LANG: en_US.UTF-8
  HOME: /root
  GOPATH: /go
  PATH: /go/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SOURCE_DATE_EPOCH: "0"
  GOTELEMETRY: "off"
  GOAMD64: v1
  GOFLAGS: -buildvcs=false

# No entrypoint: `docker run IMAGE go version` must replace the shell.
cmd: /bin/sh
work-dir: /
