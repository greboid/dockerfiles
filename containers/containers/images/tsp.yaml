# Forwards raw TCP connections from the tailnet to an upstream. Requires
# UPSTREAM as ip:port; tsnet state lives in /config (the flag's relative
# default) and /home/nonroot/.config — mount writable directories there and
# provide TAILSCALE_AUTHKEY or complete interactive auth once.
# TAILSCALE_HOSTNAME and TAILSCALE_PORT (default 80) customize the listener.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - tsp=1.2.0-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

# The legacy image chowns the tsnet state directories to the runtime user;
# apko only fixes up home directories, so do it here (mirrors the packaged
# directories).
paths:
  - path: /config
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true
  - path: /home/nonroot/.config
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /tsp
