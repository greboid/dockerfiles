# The package supplies the binary, notices, and writable home; apko only
# assembles the final image. Persist /home/nonroot (owned by 65532:65532)
# for SQLite and tsnet state. Set TS_AUTHKEY on first tailnet enrollment.
# Normal operation uses tsnet; for local HTTP use --dev-listen :8080.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    # The release workflow appends the Forgejo repository for golink.
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - golink=1.0.0-r1

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

# apko normalizes package directory ownership during installation. Restore
# metadata on the home supplied by melange (no custom files created here).
paths:
  - path: /home/nonroot
    type: permissions
    uid: 65532
    gid: 65532
    permissions: 0o755

environment:
  HOME: /home/nonroot

entrypoint:
  command: /usr/bin/golink
# Keep CMD separate so callers can replace the default arguments.
cmd: --sqlitedb /home/nonroot/golink.db
