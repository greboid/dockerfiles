# Token authentication server for Docker registries with an embedded
# registry on the same port (default 8080, PORT overrides). Configure with
# USERS (YAML map of user to bcrypt hash), PUBLIC, REALM, ISSUER, SERVICE,
# DEBUG, and GC/DRY-RUN for offline garbage collection. Certificates and
# registry storage are written under /data (DATA_DIR overrides), which must
# be writable by 65532:65532.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - registryauth=1.0.20-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

# The legacy image chowns /data to the runtime user; apko only fixes up
# home directories, so do it here (mirrors the packaged directory).
paths:
  - path: /data
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /registryauth
