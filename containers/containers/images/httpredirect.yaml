# Listens on TCP 8080 by default (PORT overrides). No persistent state.
# TARGETHOST, TARGETPATH, EXCLUDEQUERY, HTTPREDIRECT and TEMPREDIRECT
# configure redirects. Upstream v1.1.0 uses 307 by default, 308 when
# TEMPREDIRECT is nonempty (contrary to its README).
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - httpredirect=1.1.0-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /httpredirect
