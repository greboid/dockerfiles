# Periodic vulnerability reports for the local Docker containers. Needs
# the Docker socket (SCAN every SCAN-PERIOD, default 12h; CACHE-DIR holds
# the trivy database under /data/cache, reports land in
# /data/output — mount both writable).
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - purser=1.2.0-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

# The legacy image chowns the data directories to the runtime user; apko
# only fixes up home directories, so do it here (mirrors the packaged
# directories).
paths:
  - path: /data/cache
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true
  - path: /data/output
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /purser
