# irc-bot plugin that relays webhook payloads to IRC channels. Registers
# with the bot's gRPC endpoint: configure RPC_HOST/RPC_PORT/RPC_TOKEN and
# CHANNEL (BEARER_TOKEN guards the webhook). No listener and no persistent
# state of its own.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - irc-distribution=1.1.0-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /irc-distribution
