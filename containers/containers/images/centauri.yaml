# TLS front proxy (TCP frontend listens on 8080 for plain HTTP and 8443 for
# HTTPS by default; -http-port/-https-port override). The operator supplies
# the configuration (default -config path is centauri.conf, typically
# mounted) and the Tailscale frontend is opt-in via flags. Certificates and
# user data default to /data (certificate-store/user-data flags), which must
# be writable by 65532:65532.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - centauri=2.9.0-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

# The legacy image declares VOLUME /data; apko only fixes up home
# directories, so chown it here (mirrors the packaged directory).
paths:
  - path: /data
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /centauri
