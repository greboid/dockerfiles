# IRC bouncer (soju) with its companion administrative client (sojuctl).
# The bouncer reads a configuration file — pass one with `cmd` overrides
# (e.g. -config /data/soju.cfg); the SQLite database and logs belong under
# /data, mounted writable. sojuctl is invoked manually with its own
# arguments against the same database.
archs:
  - x86_64

contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026d-r0
    - os-release=3.24.2-r0
    - soju=0.10.1-r0

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

# The legacy image chowns /data to the runtime user; apko only fixes up
# home directories, so do it here (mirrors the packaged directory).
paths:
  - path: /data
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /soju
