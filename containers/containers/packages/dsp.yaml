# Source-built replacement for containers/dsp (upstream v1.2.6).
package:
  name: dsp
  version: 1.2.7
  epoch: 0
  description: Filtering proxy in front of the Docker socket
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 27a925ee01c82b058172fa711235254b1fd3f43a
      repository: https://github.com/greboid/dsp
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd
      output: dsp
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint and license notices
    runs: |
      ln -s usr/bin/dsp "${{targets.destdir}}/dsp"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      test -s "${{targets.destdir}}/notices/github.com/greboid/dsp/LICENSE"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/dsp/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/dsp
        test -L /dsp
        test -s /notices/github.com/greboid/dsp/LICENSE
        test -s /usr/share/licenses/dsp/LICENSE
    - name: Exits cleanly when the Docker socket is absent
      runs: |
        # The socket check happens before the proxy starts; upstream treats a
        # missing socket as a clean exit.
        /dsp >/tmp/dsp.log 2>&1
        test $? -eq 0
        grep -q "socket does not exist" /tmp/dsp.log

update:
  enabled: true
  # Tags lead the GitHub releases here; the tag is the version signal.
  github:
    identifier: greboid/dsp
    strip-prefix: v
    use-tag: true
