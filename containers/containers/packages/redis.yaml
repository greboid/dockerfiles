# Source-built replacement for containers/redis (upstream 8.10.2).
package:
  name: redis
  version: 8.10.2
  epoch: 2
  description: In-memory data store with disk persistence (statically linked)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE.txt
      license: RSAL-2.0 OR SSPL-1.0 OR AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - alpine-release=3.24.2-r0
      - build-base=0.5-r4
      - linux-headers=7.0.0-r1
      - openssl-dev=3.5.9-r0
      - openssl-libs-static=3.5.9-r0
      - zlib-dev=1.3.2-r0
      - zlib-static=1.3.2-r0
      - pkgconf=2.5.1-r0
  environment:
    LDFLAGS: -static

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 498ecd0d6d007db11ddb3aea9428552598a78622
      repository: https://github.com/redis/redis
      tag: ${{package.version}}
  - name: Build redis-server (static)
    runs: |
      make distclean
      make -j"$(nproc)"
      strip src/redis-server
  - name: Preserve legacy entrypoint, configuration and data directory
    runs: |
      install -Dm755 src/redis-server "${{targets.destdir}}/redis"
      install -d -m 0755 "${{targets.destdir}}/usr/bin"
      ln -s redis "${{targets.destdir}}/usr/bin/redis"
      # Legacy VOLUME: persistence for the configured database directory.
      install -d -m 0755 "${{targets.destdir}}/home/nonroot/database"
      printf '%s\n' \
        'bind 0.0.0.0' \
        'protected-mode no' \
        '' \
        'dir /home/nonroot/database' \
        '' \
        'port 6379' \
        > "${{targets.destdir}}/redis.conf"
      install -Dm644 LICENSE.txt \
        "${{targets.destdir}}/usr/share/licenses/redis/LICENSE.txt"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /redis
        test -L /usr/bin/redis
        test -s /redis.conf
        test -d /home/nonroot/database
        test -s /usr/share/licenses/redis/LICENSE.txt
    - name: Answers PING on the configured port
      runs: |
        /redis /redis.conf >/tmp/redis.log 2>&1 &
        pid=$!
        sleep 1
        reply=$(printf 'PING\r\nQUIT\r\n' | nc 127.0.0.1 6379)
        printf '%s\n' "$reply" | grep -q '+PONG'

update:
  enabled: true
  # Release tags carry no v prefix.
  github:
    identifier: redis/redis
