# Source-built replacement for containers/immich (upstream v3.2.0):
# immich-server with the embedded web build. libvips comes from the
# separate pinned libvips package (its headers are needed here for the
# sharp source build, whose prebuilt binaries ship a HEVC-less libheif
# that cannot decode iPhone HEIC).
package:
  name: immich
  version: 3.2.4
  epoch: 0
  description: Self-hosted photo and video management (server + embedded web)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: AGPL-3.0-only
  dependencies:
    runtime:
      - nodejs=24.18.1-r0
      - jellyfin-ffmpeg=7.1.3_p5-r0
      - perl=5.42.2-r1
      - coreutils=9.11-r0
      - coreutils-env=9.11-r0
      - icu-data-full=78.1-r0
      - libvips=8.18.6-r0
      # dlopen'd libheif codec plugins: invisible to so-dependency
      # resolution, so they are pinned explicitly (dav1d/libde265 arrive
      # via libheif itself).
      - libheif-jpeg=1.23.4-r0
      - libheif-openjpeg=1.23.4-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - alpine-release=3.24.2-r0
      - bash=5.3.9-r1
      - nodejs=24.18.1-r0
      - npm=11.12.1-r0
      - curl=8.22.0-r0
      # libvips runtime + headers for the sharp source build; the -dev set
      # of its (enabled) dependencies is needed for pkg-config's transitive
      # Requires. librsvg-dev is intentionally absent: rsvg is disabled in
      # libvips (SVG uploads are rejected by immich).
      - libvips=8.18.6-r0
      - cgif-dev=0.5.4-r0
      - expat-dev=2.8.5-r0
      - glib-dev=2.88.1-r1
      - highway-dev=1.3.0-r0
      - lcms2-dev=2.19-r0
      - libexif-dev=0.6.26-r0
      - libheif-dev=1.23.4-r0
      - libjpeg-turbo-dev=3.1.3-r0
      - libpng-dev=1.6.59-r0
      - libwebp-dev=1.6.0-r0
      - tiff-dev=4.7.1-r0
      - zlib-dev=1.3.2-r0
      - build-base=0.5-r4
      - make=4.4.1-r4
      - pkgconf=2.5.1-r0
      - python3=3.14.7-r1
      - tzdata=2026d-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: db355f79d910bbfc6378117ed10868493c97b922
      repository: https://github.com/immich-app/immich
      tag: v${{package.version}}
  - name: Install node dependencies
    runs: |
      # corepack isn't packaged for alpine 3.24; install it from npm. It
      # reads the pnpm version pinned in package.json's packageManager
      # field (pnpm@11.22.0).
      npm rm -g corepack >/dev/null 2>&1 || true
      npm install -g corepack
      corepack enable
      pnpm install --frozen-lockfile
  - name: Build workspace packages
    runs: |
      # Since v3.2.0 the server package is named "immich" (server/), and
      # web's @immich/sdk plus server's @immich/plugin-sdk are unbuilt
      # workspace packages compiled before their consumers — upstream
      # server/Dockerfile order: sdk -> plugin-sdk -> immich -> immich-web.
      pnpm --filter @immich/sdk build
      pnpm --filter @immich/plugin-sdk build
      pnpm --filter immich build
      pnpm --filter immich-web build
  - name: Deploy the server and source-build sharp
    runs: |
      # --no-optional (like upstream) drops sharp's @img prebuilts; sharp
      # is then source-built against the system libvips package — its
      # prebuilts bundle a libheif without HEVC codecs, so iPhone HEIC
      # would fail to decode. SHARP_FORCE_GLOBAL_LIBVIPS switches its
      # binding.gyp from the bundled libvips to pkg-config's.
      pnpm --filter immich --prod --no-optional deploy /home/build/out/server
      # sharp's binding.gyp adds -flto=auto when detect-libc classifies the
      # host as glibc — it misdetects inside the build guest, and gcc15 LTO
      # plus Alpine's fortify headers fail the link. Build without LTO.
      # pnpm deploys sharp as a symlink into .pnpm — patch every copy of
      # the gyp file (the file node-gyp reads lives in the real store dir).
      find out/server/node_modules -name binding.gyp -path '*sharp*' \
        -exec sed -i 's/-flto=auto//' {} +
      # The sharp build compiles+links with node's common.gypi LTO flags
      # (enable_lto leaks in from the guest node's build config), and
      # gcc15 LTO + Alpine's fortify headers fail the link. Strip the LTO
      # flags from the generated makefile between configure and build.
      cd out/server/node_modules/sharp
      npx node-gyp configure --directory=src
      sed -i 's/ -flto=4 -ffat-lto-objects//' src/build/*.mk
      npx node-gyp build --directory=src
      cd /home/build
      # Cross-platform native prebuilds that can never load on musl are
      # dead weight: glibc builds and other-OS/arch prebuild dirs.
      find /home/build/out/server/node_modules -name '*.glibc.node' -delete
      find /home/build/out/server/node_modules -type d \( \
        -path '*/prebuilds/android-*' -o -path '*/prebuilds/ios-*' -o \
        -path '*/prebuilds/darwin-*' -o -path '*/prebuilds/win32-*' -o \
        -path '*bare-fs*/prebuilds' -o -path '*bare-path*/prebuilds' -o \
        -path '*bare-url*/prebuilds' \) -exec rm -rf {} +
      # Non-dist assets the server reads at runtime, if present.
      if [ -d server/resources ]; then cp -a server/resources /home/build/out/server/; fi
  - name: Fetch the reverse-geocoding datasets
    runs: |
      # Hashes pin the geodata snapshot (geonames dumps drift upstream).
      mkdir -p geodata && cd geodata
      curl -sfLo cities500.zip https://download.geonames.org/export/dump/cities500.zip
      echo "a99f1423b13c52d51e281d27fa924c2b11f05a57a96467ff7b8ea437e0b21b38  cities500.zip" | sha256sum -c -
      curl -sfLo admin1CodesASCII.txt https://download.geonames.org/export/dump/admin1CodesASCII.txt
      echo "1da92a6323a5fec3176f3f743bf4cf4040fd56a876da55e46fbca23c863aa60a  admin1CodesASCII.txt" | sha256sum -c -
      curl -sfLo admin2Codes.txt https://download.geonames.org/export/dump/admin2Codes.txt
      echo "63a82be925b8704abae683a89e32f40b22f618a93efc4e676e912873f8a3be20  admin2Codes.txt" | sha256sum -c -
      curl -sfLo countryInfo.txt https://download.geonames.org/export/dump/countryInfo.txt
      echo "93bafc525813f22e4711ff9ed6d626343094ce48c26388dc7c49189b3d7d5512  countryInfo.txt" | sha256sum -c -
      curl -sfLo ne_10m_admin_0_countries.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_0_countries.geojson
      echo "239eec57ac17f100a11e2536cffc56752c318b50ae765b0918ff7aab4ce8f255  ne_10m_admin_0_countries.geojson" | sha256sum -c -
      unzip -o cities500.zip
      rm cities500.zip
      chmod 444 *
      date -u -d "@${SOURCE_DATE_EPOCH:-0}" +"%Y-%m-%dT%H:%M:%S+00:00" \
        | tr -d "\n" > geodata-date.txt
      cd /home/build
  - name: Stage the package
  - name: Stage the package
    runs: |
      mkdir -p "${{targets.destdir}}/usr/src/app" "${{targets.destdir}}/usr/bin"
      cp -a /home/build/out/server "${{targets.destdir}}/usr/src/app/server"
      cp -a web/build "${{targets.destdir}}/usr/src/app/www"
      cp -a geodata "${{targets.destdir}}/usr/src/app/geodata"
      install -d -m 0755 "${{targets.destdir}}/usr/src/app/upload"
      # jellyfin-ffmpeg ships no PATH entries; Immich resolves ffmpeg and
      # ffprobe through PATH.
      ln -sf ../lib/jellyfin-ffmpeg/ffmpeg "${{targets.destdir}}/usr/bin/ffmpeg"
      ln -sf ../lib/jellyfin-ffmpeg/ffprobe "${{targets.destdir}}/usr/bin/ffprobe"
  - name: Install the license
    runs: |
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/immich/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      packages:
        - alpine-release=3.24.2-r0
        - busybox
        - curl
        - libheif-tools=1.23.4-r0
        - libheif-x265=1.23.4-r0
  pipeline:
    - name: Packaged files
      runs: |
        test -d /usr/src/app/server/node_modules/sharp
        test -f /usr/src/app/server/dist/main.js
        test -d /usr/src/app/www
        test -f /usr/src/app/geodata/cities500.txt
        test -L /usr/bin/ffmpeg
        test -L /usr/bin/ffprobe
        test -s /usr/share/licenses/immich/LICENSE
    - name: Decodes HEIC through the source-built sharp
      runs: |
        # End-to-end HEIC check: a real HEVC-branded HEIC (heif-enc via the
        # x265 plugin) decoded with the shipped sharp through
        # libvips -> libheif -> libde265.
        ffmpeg -loglevel error -f lavfi -i color=c=black:s=64x64 -frames:v 1 -y /tmp/smoke.png
        heif-enc -q 60 -o /tmp/smoke.heic /tmp/smoke.png
        node -e 'require("/usr/src/app/server/node_modules/sharp")("/tmp/smoke.heic").resize(32).jpeg().toBuffer().then((b) => { if (b.length === 0) { throw new Error("empty jpeg"); } console.log("HEIC smoke test ok"); });' | grep -q "HEIC smoke test ok"
    - name: Transcodes with nice and the jellyfin tonemapx filter
      runs: |
        # Immich hardcodes fluent-ffmpeg niceness 10 (nice must resolve) and
        # HDR thumbnails require jellyfin's tonemapx filter — the two
        # runtime quirks that motivated the legacy image's tooling.
        nice -n 10 true
        ffmpeg -loglevel error -f lavfi -i testsrc2=s=256x144:r=5 -t 1 -pix_fmt p010le -c:v libx265 -x265-params lossless=1 -color_primaries bt2020 -color_trc smpte2084 -colorspace bt2020nc -y /tmp/smoke-hdr.mp4
        ffmpeg -loglevel error -i /tmp/smoke-hdr.mp4 -vf 'tonemapx=tonemap=hable:desat=0:p=bt709:t=bt709:m=bt709:r=pc:peak=100:format=yuv420p' -frames:v 1 -y /tmp/smoke-tonemap.jpg
        test -s /tmp/smoke-tonemap.jpg

update:
  enabled: true
  github:
    identifier: immich-app/immich
    strip-prefix: v
