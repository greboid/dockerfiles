# Source-built replacement for containers/forgejo (upstream v16.0.5).
package:
  name: forgejo
  version: 16.0.5
  epoch: 0
  description: Forgejo self-hosted software forge (Gitea fork)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
      # Frontend build (webpack via npm) and CGO compilation.
      - make=4.4.1-r4
      - nodejs=24.18.1-r0
      - npm=11.12.1-r0
      - build-base=0.5-r4
  environment:
    CGO_ENABLED: "1"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8d24b7d52df327118cd776cf461d34e52e0ec1ce
      repository: https://codeberg.org/forgejo/forgejo
      tag: v${{package.version}}
  - name: Build the frontend assets
    runs: |
      make frontend
  - name: Generate embedded Go assets
    runs: |
      make generate-go TAGS="bindata sqlite sqlite_unlock_notify"
  - name: Build the forgejo binary
    runs: |
      go build -tags "bindata sqlite sqlite_unlock_notify" \
        -ldflags "-s -w -buildid= -X main.Version=${{package.version}}" \
        -trimpath -o "${{targets.destdir}}/usr/bin/forgejo" .
  - name: Preserve legacy entrypoint, data directory and license notices
    runs: |
      ln -s usr/bin/forgejo "${{targets.destdir}}/forgejo"
      # Legacy VOLUME: repositories and the database live here.
      install -d -m 0755 "${{targets.destdir}}/data"
      # Save outside the workspace first: with save_path inside the scanned
      # module tree, go-licenses re-discovers its own output and recurses
      # until paths exceed the length limit.
      go-licenses save ./... --save_path=/tmp/forgejo-notices \
        --ignore github.com/golang/freetype \
        --ignore github.com/golang/freetype/raster \
        --ignore github.com/golang/freetype/truetype \
        --ignore github.com/mrjones/oauth \
        --ignore github.com/yohcop/openid-go
      cp -a /tmp/forgejo-notices "${{targets.destdir}}/notices"
      # The legacy build pruned vendored frontend notice trees.
      rm -rf "${{targets.destdir}}/notices/forgejo.org/node_modules" \
             "${{targets.destdir}}/notices/forgejo.org/public" \
             "${{targets.destdir}}/notices/forgejo.org/forgejo"
      test -s "${{targets.destdir}}/notices/forgejo.org/LICENSE"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/forgejo/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/forgejo
        test -L /forgejo
        test -d /data
        test -s /notices/forgejo.org/LICENSE
        test -s /usr/share/licenses/forgejo/LICENSE
    - name: Reports the packaged release version
      runs: |
        /forgejo --version | grep -q "${{package.version}}"

update:
  enabled: true
  forgejo:
    instance: https://codeberg.org
    identifier: forgejo/forgejo
    strip-prefix: v
