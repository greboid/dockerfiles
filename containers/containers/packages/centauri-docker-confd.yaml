# Source-built replacement for containers/centauri-docker-confd (upstream v1.6.2).
package:
  name: centauri-docker-confd
  version: 1.6.2
  epoch: 0
  description: Generates centauri route configuration from Docker containers
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0872c04d0711e718cfbaf20998f56ac4628db086
      repository: https://github.com/csmith/centauri-docker-confd
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: centauri-docker-confd
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint and license notices
    runs: |
      ln -s usr/bin/centauri-docker-confd "${{targets.destdir}}/centauri-docker-confd"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      test -s "${{targets.destdir}}/notices/github.com/csmith/centauri-docker-confd/LICENCE"
      install -Dm644 LICENCE "${{targets.destdir}}/usr/share/licenses/centauri-docker-confd/LICENCE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/centauri-docker-confd
        test -L /centauri-docker-confd
        test -s /notices/github.com/csmith/centauri-docker-confd/LICENCE
        test -s /usr/share/licenses/centauri-docker-confd/LICENCE
    - name: Fails loudly without a Docker daemon
      runs: |
        # containuum connects to the Docker socket, absent in the test guest.
        if /centauri-docker-confd >/tmp/confd.log 2>&1; then
          echo "expected failure without a Docker daemon" >&2
          exit 1
        fi
        grep -qiE "docker|containuum|failed" /tmp/confd.log

update:
  enabled: true
  github:
    identifier: csmith/centauri-docker-confd
    strip-prefix: v
