# Source-built replacement for containers/httpredirect (upstream v1.1.0).
package:
  name: httpredirect
  version: 1.1.1
  epoch: 0
  description: Configurable HTTP redirect service
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e189992b73c3f72f3113cf1bb55b2eb3786a0200
      repository: https://github.com/greboid/httpredirect
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: httpredirect
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint and license notices
    runs: |
      ln -s usr/bin/httpredirect "${{targets.destdir}}/httpredirect"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      # This service uses only the standard library; its own notice is required.
      test -s "${{targets.destdir}}/notices/github.com/greboid/httpredirect/LICENSE"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/httpredirect/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/httpredirect
        test -L /httpredirect
        test -s /notices/github.com/greboid/httpredirect/LICENSE
        test -s /usr/share/licenses/httpredirect/LICENSE

update:
  enabled: true
  # Tags lead the GitHub releases here; the tag is the version signal.
  github:
    identifier: greboid/httpredirect
    strip-prefix: v
    use-tag: true
