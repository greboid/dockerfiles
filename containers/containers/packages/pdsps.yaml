# Source-built replacement for containers/pdsps (upstream v1.0.0).
package:
  name: pdsps
  version: 1.0.0
  epoch: 0
  description: Answering atproto age-assurance states in front of a PDS
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 4afcf07f101cb4f524e702b3fb1be42549b323cb
      repository: https://github.com/csmith/pdsps
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: pdsps
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint and license notices
    runs: |
      ln -s usr/bin/pdsps "${{targets.destdir}}/pdsps"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      test -s "${{targets.destdir}}/notices/chameth.com/pdsps/LICENCE"
      install -Dm644 LICENCE "${{targets.destdir}}/usr/share/licenses/pdsps/LICENCE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/pdsps
        test -L /pdsps
        test -s /notices/chameth.com/pdsps/LICENCE
        test -s /usr/share/licenses/pdsps/LICENCE
    - name: Refuses to start without an upstream
      runs: |
        if /pdsps >/tmp/pdsps.log 2>&1; then
          echo "expected missing-upstream failure" >&2
          exit 1
        fi
        grep -q "upstream is required" /tmp/pdsps.log

update:
  enabled: true
  # No GitHub releases; tags are the version signal.
  github:
    identifier: csmith/pdsps
    strip-prefix: v
    use-tag: true
