# Miniflux: source-built package for the miniflux image.
#
# Upstream is a single static Go binary built at its root package; the
# version ldflag matches the upstream Makefile convention so the UI and
# `miniflux -version` report the release. Go 1.26 comes from Alpine's
# community repository (1.26.8-r0 >= the go.mod directive 1.26.0). Runtime
# needs: DATABASE_URL (external Postgres) and outbound TLS certs.

package:
  name: miniflux
  version: 2.3.3
  epoch: 0
  description: Minimalist and opinionated feed reader
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: miniflux.license
      license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      # Exact build-environment pins (resolved from Alpine 3.24).
      # alpine-release provides /etc/os-release in the build environment
      # (melange reads it and warns when absent). Our Forgejo repo cannot be
      # a melange env repo: its index fetcher HEADs the URL, which Forgejo
      # answers 405 (the same bug apko patch 007 fixes on the apko side).
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - alpine-release=3.24.2-r0

vars:
  # upstream commit for tag v2.3.3 (the git-checkout expected-commit),
  # stamped into the binary alongside the version
  commit: c4d54f87a81b30aa173fddf05d7ff83ae7da5796

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c4d54f87a81b30aa173fddf05d7ff83ae7da5796
      repository: https://github.com/miniflux/v2
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: miniflux
      # go/build passes -trimpath itself; ldflags match the previous
      # Containerfile build (stripped symbols, empty build id) and keep
      # builds reproducible
      strip: -s -w
      ldflags: -buildid= -X miniflux.app/v2/internal/version.Version=${{package.version}} -X miniflux.app/v2/internal/version.Commit=${{vars.commit}}

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Reports the packaged release version
      runs: |
        test -x /usr/bin/miniflux
        /usr/bin/miniflux -version | grep "${{package.version}}"

update:
  enabled: true
  # Release tags carry no v prefix.
  github:
    identifier: miniflux/v2
