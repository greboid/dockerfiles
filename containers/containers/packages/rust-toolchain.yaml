# Compatibility exception: package the exact rustup-distributed musl toolchain,
# not Alpine Rust. A source bootstrap (Rust + LLVM + previous-stage compiler)
# would not preserve these upstream artifacts. All binary inputs AND the release
# manifest are pinned here; rustup installs from an offline, verified mirror.
# Rustup 1.29.1 is deliberately independent of the Rust release version.
package:
  name: rust-toolchain
  version: 1.98.1
  epoch: 0
  description: Rust 1.98.1 minimal musl toolchain with rustup 1.29.1
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      license: MIT OR Apache-2.0
  # Legacy interface: the toolchain homes ship world-writable (chmod -R a+w in
  # the legacy image) so non-root build stages can write caches/installs. That
  # is deliberate, not a packaging accident; disable the linter accordingly.
  checks:
    disabled:
      - worldwrite
  dependencies:
    runtime:
      - ca-certificates-bundle
      - gcc=15.2.0-r5
      - musl-dev=1.2.6-r2
      - libgcc=15.2.0-r5

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - alpine-release=3.24.2-r0
      - busybox=1.37.0-r31
      - ca-certificates-bundle=20260909-r0
      - tar=1.35-r5
      - xz

pipeline:
  - uses: fetch
    with:
      uri: https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-musl/rustup-init
      expected-sha256: 331228566cc931f32cd684f9bebc5956a5e5d7394c8d5de595f196a658ab98e6
      extract: false
  - uses: fetch
    with:
      uri: https://static.rust-lang.org/dist/channel-rust-${{package.version}}.toml
      expected-sha256: a7c8774a5fd8441c997d94c029776cbc5eb111e9d72ab5d256fa69866644347e
      extract: false
  - uses: fetch
    with:
      uri: https://static.rust-lang.org/dist/2026-09-03/cargo-${{package.version}}-x86_64-unknown-linux-musl.tar.xz
      expected-sha256: 2bced641e198f9c4e7b129770de65cb052f2486a8f58d577792ea57c66c91b1c
      extract: false
  - uses: fetch
    with:
      uri: https://static.rust-lang.org/dist/2026-09-03/rustc-${{package.version}}-x86_64-unknown-linux-musl.tar.xz
      expected-sha256: dea916164b47437402d8041cbba90c1ff9ce859948b1ece8e36b08100ff92063
      extract: false
  - uses: fetch
    with:
      uri: https://static.rust-lang.org/dist/2026-09-03/rust-std-${{package.version}}-x86_64-unknown-linux-musl.tar.xz
      expected-sha256: bd9f35880de21dab0e387e84009c00001ae7836a4ba565cb16823f13f75f325f
      extract: false
  - name: Install the pinned minimal profile using only verified local inputs
    runs: |
      mirror="$(pwd)/rust-dist/dist"
      mkdir -p "$mirror/2026-09-03"
      cp ./*-${{package.version}}-x86_64-unknown-linux-musl.tar.xz "$mirror/2026-09-03/"
      # Manifest component URLs are absolute, so redirect them to the local
      # mirror too. The original manifest and every component were verified
      # above; no mutable upstream checksum is trusted during installation.
      sed "s|https://static.rust-lang.org/dist|file://$mirror|g" \
        channel-rust-${{package.version}}.toml > "$mirror/channel-rust-${{package.version}}.toml"
      sha256sum "$mirror/channel-rust-${{package.version}}.toml" \
        > "$mirror/channel-rust-${{package.version}}.toml.sha256"
      export RUSTUP_HOME="${{targets.destdir}}/usr/local/rustup"
      export CARGO_HOME="${{targets.destdir}}/usr/local/cargo"
      export RUSTUP_DIST_SERVER="file://$(pwd)/rust-dist"
      export RUSTUP_INIT_SKIP_PATH_CHECK=yes
      chmod +x rustup-init
      ./rustup-init -y --no-modify-path --profile minimal \
        --default-toolchain ${{package.version}} --default-host x86_64-unknown-linux-musl
      # Do not leave build-root paths in the installed shell helper or stored
      # manifest: downstream rustup operations must continue to use upstream.
      sed -i "s|${{targets.destdir}}||g" "$CARGO_HOME/env"
      find "$RUSTUP_HOME" -name multirust-channel-manifest.toml -exec \
        sed -i "s|file://$mirror|https://static.rust-lang.org/dist|g" {} \;
      # Rustup stores the first 20 characters of the channel manifest hash.
      # Restore the upstream value alongside the upstream manifest URLs.
      printf '%s' "$(sha256sum channel-rust-${{package.version}}.toml | cut -c1-20)" \
        > "$RUSTUP_HOME/update-hashes/${{package.version}}-x86_64-unknown-linux-musl"
      find "$RUSTUP_HOME" -name components -exec sort {} -o {} \;
      rm -rf "$RUSTUP_HOME/downloads" "$RUSTUP_HOME/tmp"
      chmod -R a+w "$RUSTUP_HOME" "$CARGO_HOME"
      mkdir -p "${{targets.destdir}}/usr/local/bin" "${{targets.destdir}}/etc"
      ln -s /usr/local/cargo/bin/cargo "${{targets.destdir}}/usr/local/bin/cargo"
      # Inherited from the legacy Alpine base, not the Rust Containerfile.
      printf '[advice]\n    detachedHead = false\n' > "${{targets.destdir}}/etc/gitconfig"
      install -d "${{targets.destdir}}/usr/share/licenses/rust-toolchain"
      # busybox tar cannot parse these GNU-format archives, so install and
      # use Alpine's GNU tar explicitly (build-time dependency only; its apk
      # replaces busybox's /bin/tar symlink for the build).
      for license in LICENSE-MIT LICENSE-APACHE COPYRIGHT; do
        /bin/tar -xJOf rustc-${{package.version}}-x86_64-unknown-linux-musl.tar.xz \
          rustc-${{package.version}}-x86_64-unknown-linux-musl/$license \
          > "${{targets.destdir}}/usr/share/licenses/rust-toolchain/$license"
        test -s "${{targets.destdir}}/usr/share/licenses/rust-toolchain/$license"
      done

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
        - git=2.54.0-r0
    environment:
      RUSTUP_HOME: /usr/local/rustup
      CARGO_HOME: /usr/local/cargo
      PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  pipeline:
    - name: Exact versions, rustup state and legacy interface
      runs: |
        export PATH="/usr/local/cargo/bin:$PATH"
        rustc --version | grep '^rustc 1.98.1 '
        cargo --version | grep '^cargo 1.98.1 '
        rustup --version | grep '^rustup 1.29.1 '
        rustup show active-toolchain | grep '^1.98.1-x86_64-unknown-linux-musl (default)'
        test "$(rustup show profile)" = minimal
        rustup target list --installed | grep '^x86_64-unknown-linux-musl$'
        for component in cargo rustc rust-std; do
          rustup component list --installed | grep "^$component-x86_64-unknown-linux-musl"
        done
        test "$(readlink /usr/local/bin/cargo)" = /usr/local/cargo/bin/cargo
        test "$(git config --system advice.detachedHead)" = false
        test -z "$(find "$RUSTUP_HOME" "$CARGO_HOME" ! -perm -0002 -print)"
        ! grep -R '/home/build/' "$CARGO_HOME/env" "$RUSTUP_HOME/settings.toml"
    - name: Real offline cargo and rustc compilation with the musl linker
      runs: |
        export PATH="/usr/local/cargo/bin:$PATH"
        work=$(mktemp -d)
        cd "$work"
        printf 'fn main() { println!("rust-musl-ok"); }\n' > hello.rs
        rustc --target x86_64-unknown-linux-musl hello.rs -o hello
        test "$(./hello)" = rust-musl-ok
        cargo new --bin --vcs none smoke
        cp hello.rs smoke/src/main.rs
        cargo build --offline --manifest-path smoke/Cargo.toml --target x86_64-unknown-linux-musl
        test "$(./smoke/target/x86_64-unknown-linux-musl/debug/smoke)" = rust-musl-ok
        rm -rf "$work"

update:
  enabled: true
  # Every bump re-pins the dist date directory and five artifact hashes,
  # so the release is recorded but updates stay hand-rolled.
  manual: true
  github:
    identifier: rust-lang/rust
