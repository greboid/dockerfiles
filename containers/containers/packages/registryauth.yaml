# Source-built replacement for containers/registryauth (upstream v1.0.20).
package:
  name: registryauth
  version: 1.0.20
  epoch: 0
  description: Docker registry token authentication server with an embedded registry
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 341593a5575955de7898882d7cf22a30e1dce22f
      repository: https://github.com/greboid/registryauth
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/authedreg
      output: registryauth
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint, data directory and license notices
    runs: |
      ln -s usr/bin/registryauth "${{targets.destdir}}/registryauth"
      # Legacy VOLUME /data: certs and registry storage live here.
      install -d -m 0755 "${{targets.destdir}}/data"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      test -s "${{targets.destdir}}/notices/github.com/greboid/registryauth/LICENSE"
      test -s "${{targets.destdir}}/notices/github.com/csmith/envflag/LICENCE"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/registryauth/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
        - curl
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/registryauth
        test -L /registryauth
        test -d /data
        test -s /notices/github.com/greboid/registryauth/LICENSE
        test -s /notices/github.com/csmith/envflag/LICENCE
        test -s /usr/share/licenses/registryauth/LICENSE
    - name: Serves the registry auth and token endpoints
      runs: |
        # The login password is "smoke-pass"; the hash pins the test.
        USERS='{smoke: $2b$12$QPcRNX6Epm5/L5IMLs8/de.M9paX.qVTLEZ9e9StqkH9/NjeccAEm}' \
          DATA_DIR=/tmp/ra-data \
          /registryauth >/tmp/registryauth.log 2>&1 &
        pid=$!
        # Self-signed certificate generation takes a moment.
        for _ in $(seq 1 20); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v2/ || true)
          [ "$code" = 401 ] && break
          sleep 1
        done
        test "$code" = 401
        # Valid credentials yield a token; invalid ones are rejected when no
        # scope is requested (upstream behavior).
        token=$(curl -sf -u smoke:smoke-pass \
          'http://127.0.0.1:8080/auth?service=Registry')
        echo "$token" | grep -q access_token
        ! curl -sf -u smoke:wrong-password \
          'http://127.0.0.1:8080/auth?service=Registry' >/dev/null
        kill "$pid"
        grep -q "Starting registry" /tmp/registryauth.log

update:
  enabled: true
  github:
    identifier: greboid/registryauth
    strip-prefix: v
