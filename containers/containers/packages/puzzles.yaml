# Source-built replacement for containers/puzzles (upstream v1.0.3).
package:
  name: puzzles
  version: 1.0.3
  epoch: 0
  description: Word and image puzzle helper web service
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 168a71c2d612327414a752d6292b5ab13db6ee57
      repository: https://github.com/greboid/puzzles
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: puzzles
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint, wordlists and license notices
    runs: |
      ln -s usr/bin/puzzles "${{targets.destdir}}/puzzles"
      # Static assets and templates are embedded in the binary; only the
      # wordlist directory is external (legacy copies it to /app/wordlists).
      install -d -m 0755 "${{targets.destdir}}/app/wordlists"
      install -m 0644 wordlists/*.wl "${{targets.destdir}}/app/wordlists/"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      test -s "${{targets.destdir}}/notices/github.com/greboid/puzzles/LICENSE"
      test -s "${{targets.destdir}}/notices/github.com/csmith/envflag/LICENCE"
      test -s "${{targets.destdir}}/notices/github.com/csmith/kowalski/v5/LICENCE"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/puzzles/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
        - curl
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/puzzles
        test -L /puzzles
        test -s /app/wordlists/combined.wl
        test -s /app/wordlists/urbandictionary.wl
        test -s /notices/github.com/greboid/puzzles/LICENSE
        test -s /notices/github.com/csmith/kowalski/v5/LICENCE
        test -s /usr/share/licenses/puzzles/LICENSE
    - name: Serves the puzzle endpoints
      runs: |
        /puzzles >/tmp/puzzles.log 2>&1 &
        pid=$!
        for _ in $(seq 1 10); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
          [ -n "$code" ] && [ "$code" != 000 ] && break
          sleep 1
        done
        # / redirects permanently to the public site.
        test "$code" = 308
        curl -sD /tmp/headers -o /dev/null http://127.0.0.1:8080/
        grep -qi '^location: https://puzzles.mdbot.uk' /tmp/headers
        # The word endpoints consult the packaged wordlists.
        anagram=$(curl -sf 'http://127.0.0.1:8080/anagram?input=teerts')
        echo "$anagram" | grep -q '<li>'
        # Embedded static assets are served from the binary's root.
        curl -sf -o /dev/null http://127.0.0.1:8080/main.js
        curl -sf -o /dev/null http://127.0.0.1:8080/flags/GB-flag.webp
        test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope)" = 404
        kill "$pid"

update:
  enabled: true
  github:
    identifier: greboid/puzzles
    strip-prefix: v
