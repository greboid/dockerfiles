# Source-built replacement for containers/goplum (upstream v1.1.0).
package:
  name: goplum
  version: 1.1.0
  epoch: 0
  description: Configurable health checker with a gRPC API
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: febfeccb616686b27d829c16288d3d4ffef36c9d
      repository: https://github.com/csmith/goplum
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/goplum
      output: goplum
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint and license notices
    runs: |
      ln -s usr/bin/goplum "${{targets.destdir}}/goplum"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      # The module is chameth.com/goplum; upstream spells its license LICENCE.
      test -s "${{targets.destdir}}/notices/chameth.com/goplum/LICENCE"
      test -s "${{targets.destdir}}/notices/github.com/csmith/envflag/v2/LICENCE"
      install -Dm644 LICENCE "${{targets.destdir}}/usr/share/licenses/goplum/LICENCE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
        - openssl
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/goplum
        test -L /goplum
        test -s /notices/chameth.com/goplum/LICENCE
        test -s /notices/github.com/csmith/envflag/v2/LICENCE
        test -s /usr/share/licenses/goplum/LICENCE
    - name: Refuses to run without a configuration
      runs: |
        set +e
        out=$(/goplum 2>&1)
        code=$?
        set -e
        test "$code" = 1
        echo "$out" | grep -q "Unable to read config"
    - name: Runs checks and serves the mTLS API
      runs: |
        mkdir -p /tmp/goplum && cd /tmp/goplum
        openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt \
          -days 1 -subj /CN=smoke-ca >/dev/null 2>&1
        openssl req -newkey rsa:2048 -nodes -keyout goplum.key -out goplum.csr \
          -subj /CN=goplum >/dev/null 2>&1
        openssl x509 -req -in goplum.csr -CA ca.crt -CAkey ca.key \
          -out goplum.crt -days 1 >/dev/null 2>&1
        printf 'check debug.random "one" {\n    interval = 2s\n}\nalert debug.sysout "text" {}\n' \
          > goplum.conf
        /goplum -config goplum.conf -cert goplum.crt -key goplum.key -ca-cert ca.crt \
          >goplum.log 2>&1 &
        pid=$!
        sleep 3
        grep -q "Starting API server on port 7586" goplum.log
        grep -q "Check 'one' executed" goplum.log
        nc -z 127.0.0.1 7586
        kill "$pid"

update:
  enabled: true
  github:
    identifier: csmith/goplum
    strip-prefix: v
