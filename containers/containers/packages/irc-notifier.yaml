# Source-built replacement for containers/irc-notifier (upstream v1.0.6).
package:
  name: irc-notifier
  version: 1.0.6
  epoch: 0
  description: irc-bot plugin relaying Igloo push notifications to IRC
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: dc5ba7a94a528a598de303378dbca9f53844ad3e
      repository: https://github.com/greboid/irc-notifier
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/notifier
      output: irc-notifier
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint and license notices
    runs: |
      ln -s usr/bin/irc-notifier "${{targets.destdir}}/irc-notifier"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      # This module has no domain in its go.mod, and go-licenses records
      # each module's license under the deepest imported package's
      # directory, so the notice path is flat-ish.
      test -s "${{targets.destdir}}/notices/irc-notifier/cmd/notifier/LICENSE"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/irc-notifier/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/irc-notifier
        test -L /irc-notifier
        test -s /notices/irc-notifier/cmd/notifier/LICENSE
        test -s /usr/share/licenses/irc-notifier/LICENSE
    - name: Refuses to start without an RPC token
      runs: |
        # The plugin helper validates configuration before any dial; nothing
        # connects anywhere.
        if /irc-notifier >/tmp/irc-notifier.log 2>&1; then
          echo "expected missing-token failure" >&2
          exit 1
        fi
        grep -q "Unable to create plugin helper" /tmp/irc-notifier.log
        grep -q "plugin RPC token must be set" /tmp/irc-notifier.log

update:
  enabled: true
  github:
    identifier: greboid/irc-notifier
    strip-prefix: v
