# Source-built replacement for containers/identd (upstream v1.0.4).
package:
  name: identd
  version: 1.0.5
  epoch: 0
  description: Ident server returning a configurable static response
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 51e683b82ee98737e8b0cb737987606bfbeed15f
      repository: https://github.com/greboid/identd
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: identd
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint and license notices
    runs: |
      ln -s usr/bin/identd "${{targets.destdir}}/identd"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      test -s "${{targets.destdir}}/notices/github.com/greboid/identd/LICENSE"
      test -s "${{targets.destdir}}/notices/github.com/csmith/envflag/LICENCE"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/identd/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/identd
        test -L /identd
        test -s /notices/github.com/greboid/identd/LICENSE
        test -s /notices/github.com/csmith/envflag/LICENCE
        test -s /usr/share/licenses/identd/LICENSE
    - name: Answers ident requests with the configured response
      runs: |
        PORT=9000 RESPONSE=smoke /identd >/tmp/identd.log 2>&1 &
        pid=$!
        sleep 1
        # <port-on-server>, <port-on-client> queries return USERID lines.
        reply=$(printf '6115, 6667\r\n' | nc -w 3 127.0.0.1 9000)
        echo "$reply" | grep -q '6115, 6667 : USERID : UNIX : smoke'
        kill "$pid"
        # Defaults: port 8000, response "ident".
        /identd >/tmp/identd2.log 2>&1 &
        pid=$!
        sleep 1
        reply=$(printf '1,2\r\n' | nc -w 3 127.0.0.1 8000)
        echo "$reply" | grep -q ': USERID : UNIX : ident'
        kill "$pid"

update:
  enabled: true
  # Tags lead the GitHub releases here; the tag is the version signal.
  github:
    identifier: greboid/identd
    strip-prefix: v
    use-tag: true
