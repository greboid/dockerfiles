# Source-built replacement for containers/sws (upstream v2.44.0).
package:
  name: sws
  version: 2.44.0
  epoch: 0
  description: Static web server (static-web-server) with query-preserving rewrites
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE-MIT
      license: Apache-2.0 OR MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - alpine-release=3.24.2-r0
      - rust=1.96.1-r0
      - cargo=1.96.1-r0
      - build-base=0.5-r4

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 27aa3450b6bf70bd1fa553b2197b53032affcba1
      repository: https://github.com/static-web-server/static-web-server
      tag: v${{package.version}}
  - name: Apply the query-preserving rewrite patch
    runs: |
      # Local patch: rewrites keep the incoming request's query string.
      # (Context lines begin with the unified-diff space marker.)
      cat > /tmp/keepqueriesonrewrites.diff <<'PATCH_EOF'
      diff --git i/src/rewrites.rs w/src/rewrites.rs
      index b2a6484..1f21bc5 100644
      --- i/src/rewrites.rs
      +++ w/src/rewrites.rs
      @@ -39,7 +39,11 @@ pub(crate) fn pre_process<T>(
               &matched.destination,
               &matched.replacer,
           ) {
      -        Ok(dest) => dest,
      +        Ok(dest) => if req.uri().query().is_some() {
      +            dest + "?" + req.uri().query().unwrap()
      +        } else {
      +            dest
      +        },
               Err(err) => return handle_error(err, opts, req),
           };
       
      PATCH_EOF
      git apply /tmp/keepqueriesonrewrites.diff
  - name: Build static-web-server
    runs: |
      cargo build --release
      install -Dm755 target/release/static-web-server \
        "${{targets.destdir}}/usr/bin/sws"
  - name: Preserve legacy entrypoint and licenses
    runs: |
      ln -s usr/bin/sws "${{targets.destdir}}/sws"
      install -Dm644 LICENSE-APACHE \
        "${{targets.destdir}}/usr/share/licenses/sws/LICENSE-APACHE"
      install -Dm644 LICENSE-MIT \
        "${{targets.destdir}}/usr/share/licenses/sws/LICENSE-MIT"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
        - curl
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/sws
        test -L /sws
        test -s /usr/share/licenses/sws/LICENSE-APACHE
        test -s /usr/share/licenses/sws/LICENSE-MIT
    - name: Serves files from the configured root
      runs: |
        mkdir -p /tmp/www
        printf 'ok' > /tmp/www/index.html
        SERVER_HOST=127.0.0.1 SERVER_PORT=8080 SERVER_ROOT=/tmp/www \
          /sws >/tmp/sws.log 2>&1 &
        pid=$!
        sleep 1
        code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
        test "$code" = 200
        kill "$pid"

update:
  enabled: true
  github:
    identifier: static-web-server/static-web-server
    strip-prefix: v
