# Source-built replacement for containers/irc-webhook (upstream v4.1.1).
package:
  name: irc-webhook
  version: 4.1.2
  epoch: 0
  description: irc-bot plugin offering webhook-to-IRC relaying with token management
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 271955a17109c0d2df65992bd4ce9db3cfa4aaff
      repository: https://github.com/greboid/irc-webhook
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/webhook
      output: irc-webhook
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint and license notices
    runs: |
      ln -s usr/bin/irc-webhook "${{targets.destdir}}/irc-webhook"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      # go-licenses records each module's license under the deepest
      # imported package's directory.
      test -s "${{targets.destdir}}/notices/github.com/greboid/irc-webhook/v4/cmd/webhook/LICENSE"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/irc-webhook/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/irc-webhook
        test -L /irc-webhook
        test -s /notices/github.com/greboid/irc-webhook/v4/cmd/webhook/LICENSE
        test -s /usr/share/licenses/irc-webhook/LICENSE
    - name: Refuses to start without configuration
      runs: |
        # The token database defaults to /data/db, absent in the guest and
        # in the legacy image without a mounted /data.
        if /irc-webhook >/tmp/irc-webhook.log 2>&1; then
          echo "expected missing-database failure" >&2
          exit 1
        fi
        grep -q "Unable to load config" /tmp/irc-webhook.log
        grep -q "open /data/db" /tmp/irc-webhook.log
        # With a writable token database the plugin helper's configuration
        # check fires before any dial; nothing connects anywhere.
        if DB_PATH=/tmp/tokens.db /irc-webhook >/tmp/irc-webhook2.log 2>&1; then
          echo "expected missing-token failure" >&2
          exit 1
        fi
        grep -q "Unable to create helper" /tmp/irc-webhook2.log
        grep -q "plugin RPC token must be set" /tmp/irc-webhook2.log

update:
  enabled: true
  # Tags lead the GitHub releases here; the tag is the version signal.
  github:
    identifier: greboid/irc-webhook
    strip-prefix: v
    use-tag: true
