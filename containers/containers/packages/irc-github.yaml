# Source-built replacement for containers/irc-github (upstream v4.0.3).
package:
  name: irc-github
  version: 4.0.4
  epoch: 0
  description: irc-bot plugin announcing GitHub events in IRC channels
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: dbef6d870406c37137c91e92510cd1e1660a0e7d
      repository: https://github.com/greboid/irc-github
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/github
      output: irc-github
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint and license notices
    runs: |
      ln -s usr/bin/irc-github "${{targets.destdir}}/irc-github"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      # go-licenses records each module's license under the deepest
      # imported package's directory.
      test -s "${{targets.destdir}}/notices/github.com/greboid/irc-github/v4/cmd/github/LICENSE"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/irc-github/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/irc-github
        test -L /irc-github
        test -s /notices/github.com/greboid/irc-github/v4/cmd/github/LICENSE
        test -s /usr/share/licenses/irc-github/LICENSE
    - name: Refuses to start without an RPC token
      runs: |
        # The plugin helper validates configuration before any dial; nothing
        # connects anywhere.
        if /irc-github >/tmp/irc-github.log 2>&1; then
          echo "expected missing-token failure" >&2
          exit 1
        fi
        grep -q "Unable to create plugin helper" /tmp/irc-github.log
        grep -q "plugin RPC token must be set" /tmp/irc-github.log

update:
  enabled: true
  # Tags lead the GitHub releases here; the tag is the version signal.
  github:
    identifier: greboid/irc-github
    strip-prefix: v
    use-tag: true
