# Source-built replacement for containers/irc-distribution (upstream v1.1.0).
package:
  name: irc-distribution
  version: 1.1.0
  epoch: 0
  description: irc-bot plugin distributing webhook payloads to IRC channels
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e68323d3c24b5b6063832fe13972f63dfee24067
      repository: https://github.com/csmith/irc-distribution
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/distribution
      output: irc-distribution
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint and license notices
    runs: |
      ln -s usr/bin/irc-distribution "${{targets.destdir}}/irc-distribution"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      # go-licenses records each module's license under the deepest
      # imported package's directory.
      test -s "${{targets.destdir}}/notices/github.com/csmith/irc-distribution/cmd/distribution/LICENCE"
      install -Dm644 LICENCE "${{targets.destdir}}/usr/share/licenses/irc-distribution/LICENCE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/irc-distribution
        test -L /irc-distribution
        test -s /notices/github.com/csmith/irc-distribution/cmd/distribution/LICENCE
        test -s /usr/share/licenses/irc-distribution/LICENCE
    - name: Refuses to start without an RPC token
      runs: |
        # The plugin helper validates configuration before any dial; nothing
        # connects anywhere.
        if /irc-distribution >/tmp/irc-distribution.log 2>&1; then
          echo "expected missing-token failure" >&2
          exit 1
        fi
        grep -q "Unable to create plugin helper" /tmp/irc-distribution.log
        grep -q "plugin RPC token must be set" /tmp/irc-distribution.log

update:
  enabled: true
  # No GitHub releases; tags are the version signal.
  github:
    identifier: csmith/irc-distribution
    strip-prefix: v
    use-tag: true
