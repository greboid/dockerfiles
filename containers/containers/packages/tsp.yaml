# Source-built replacement for containers/tsp (upstream v1.2.0).
package:
  name: tsp
  version: 1.2.0
  epoch: 0
  description: Tailscale TCP proxy forwarding tailnet connections to an upstream
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 4b635a016398c783aa8ae0d130b609fb99dd711c
      repository: https://github.com/csmith/tsp
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: tsp
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
      # jsonv2 matches the legacy build's GOEXPERIMENT.
      experiments: jsonv2
  - name: Preserve legacy entrypoint, home directories and license
    runs: |
      ln -s usr/bin/tsp "${{targets.destdir}}/tsp"
      # Legacy VOLUMEs: tsnet state (/config via the flag's relative default)
      # and the runtime user's home.
      install -d -m 0755 "${{targets.destdir}}/config"
      install -d -m 0755 "${{targets.destdir}}/home/nonroot/.config"
      # The legacy build collected no dependency notices for tsp.
      install -Dm644 LICENCE "${{targets.destdir}}/usr/share/licenses/tsp/LICENCE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/tsp
        test -L /tsp
        test -d /config
        test -d /home/nonroot/.config
        test -s /usr/share/licenses/tsp/LICENCE
    - name: Refuses to start without an upstream
      runs: |
        # Fails before the tailscale client starts; no network is touched.
        if /tsp >/tmp/tsp.log 2>&1; then
          echo "expected missing-upstream failure" >&2
          exit 1
        fi
        grep -q "Error parsing upstream address" /tmp/tsp.log

update:
  enabled: true
  # No GitHub releases; tags are the version signal.
  github:
    identifier: csmith/tsp
    strip-prefix: v
    use-tag: true
