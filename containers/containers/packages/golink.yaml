# Source-built replacement for containers/golink (upstream tag v1.0.0).
package:
  name: golink
  version: 1.0.0
  epoch: 1
  description: A private shortlink service for your tailnet
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: BSD-3-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d55b2a3302777d7f9943863644d4c84ecacb31b7
      repository: https://github.com/tailscale/golink
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/golink
      output: golink
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Install runtime home and license notices
    runs: |
      # SQLite and tsnet's default state directory both need a writable home.
      install -d -m 0755 "${{targets.destdir}}/home/nonroot"
      # apko sets the runtime ownership; keep packaging rootless-compatible.
      # Retain the source image's dependency notices and its exclusions.
      go-licenses save ./... \
        --save_path="${{targets.destdir}}/notices" \
        --ignore modernc.org/mathutil --ignore github.com/jmespath/go-jmespath
      # Fail if collection silently produces nothing (e.g. a missing GOROOT).
      test -s "${{targets.destdir}}/notices/github.com/tailscale/golink/LICENSE"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/golink/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/golink
        test -s /notices/github.com/tailscale/golink/LICENSE
        test -s /usr/share/licenses/golink/LICENSE
    - name: Binary executes without serving
      runs: |
        # Usage output proves the static binary runs end to end. No listener
        # is started: the packaged service behaviour is exercised by the
        # image tests, not by packaging.
        /usr/bin/golink -h 2>&1 | grep -q dev-listen

update:
  enabled: true
  # No GitHub releases; tags are the version signal.
  github:
    identifier: tailscale/golink
    strip-prefix: v
    use-tag: true
