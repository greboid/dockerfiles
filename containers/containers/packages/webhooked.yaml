# Source-built replacement for containers/webhooked (upstream v1.1.0).
package:
  name: webhooked
  version: 1.1.0
  epoch: 0
  description: Ensures a GitHub webhook is installed across a user's repositories
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENCE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 99b763d2c3b8383721c64e050a9b9b99d4e1f601
      repository: https://github.com/csmith/webhooked
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: webhooked
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint and license notices
    runs: |
      ln -s usr/bin/webhooked "${{targets.destdir}}/webhooked"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      # Upstream spells its license file "LICENCE".
      test -s "${{targets.destdir}}/notices/github.com/csmith/webhooked/LICENCE"
      test -s "${{targets.destdir}}/notices/github.com/csmith/envflag/v2/LICENCE"
      test -s "${{targets.destdir}}/notices/github.com/google/go-github/v72/github/LICENSE"
      install -Dm644 LICENCE "${{targets.destdir}}/usr/share/licenses/webhooked/LICENCE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/webhooked
        test -L /webhooked
        test -s /notices/github.com/csmith/webhooked/LICENCE
        test -s /notices/github.com/google/go-github/v72/github/LICENSE
        test -s /usr/share/licenses/webhooked/LICENCE
    - name: Prints usage and exits cleanly when unconfigured
      runs: |
        # TOKEN and URL are required; without them it prints usage and exits 0.
        out=$(/webhooked 2>&1)
        code=$?
        test "$code" = 0
        echo "$out" | grep -q "Usage of /webhooked:"

update:
  enabled: true
  # No GitHub releases; tags are the version signal.
  github:
    identifier: csmith/webhooked
    strip-prefix: v
    use-tag: true
