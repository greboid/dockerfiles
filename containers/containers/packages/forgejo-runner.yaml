# Source-built replacement for containers/forgejo-runner (upstream v13.2.0).
package:
  name: forgejo-runner
  version: 13.2.0
  epoch: 0
  description: Forgejo Actions runner
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: GPL-3.0-or-later
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
      - make=4.4.1-r4
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: df6b843fb929bb04b933b09c6bf208774d42480b
      repository: https://code.forgejo.org/forgejo/runner
      tag: v${{package.version}}
  - name: Build the runner
    runs: |
      # The Makefile stamps ver.version=v<VERSION> and adds
      # -extldflags "-static" netgo osusergo itself.
      make build VERSION=${{package.version}}
      install -Dm755 forgejo-runner "${{targets.destdir}}/usr/bin/forgejo-runner"
  - name: Preserve legacy entrypoint, storage config, data directory and license notices
    runs: |
      ln -s usr/bin/forgejo-runner "${{targets.destdir}}/forgejo-runner"
      # Legacy VOLUME: runner registration state and job workspace.
      install -d -m 0755 "${{targets.destdir}}/data"
      # buildah's containers-common owns /etc/containers/storage.conf, so
      # the legacy overlay-over-fuse configuration ships at a private path
      # and the image points CONTAINERS_STORAGE_CONF at it.
      install -d -m 0755 "${{targets.destdir}}/usr/share/forgejo-runner"
      printf '%s\n' \
        '[storage]' \
        'driver = "overlay"' \
        '' \
        '[storage.options.overlay]' \
        'mount_program = "/usr/bin/fuse-overlayfs"' \
        > "${{targets.destdir}}/usr/share/forgejo-runner/storage.conf"
      # Save outside the workspace first: with save_path inside the scanned
      # module tree, go-licenses re-discovers its own output and recurses
      # until paths exceed the length limit.
      go-licenses save ./... --save_path=/tmp/runner-notices \
        --ignore modernc.org/mathutil \
        --ignore github.com/jmespath/go-jmespath
      cp -a /tmp/runner-notices "${{targets.destdir}}/notices"
      test -s "${{targets.destdir}}/notices/code.forgejo.org/forgejo/runner/v13/LICENSE"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/forgejo-runner/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/forgejo-runner
        test -L /forgejo-runner
        test -d /data
        test -s /usr/share/forgejo-runner/storage.conf
        test -s /notices/code.forgejo.org/forgejo/runner/v13/LICENSE
        test -s /usr/share/licenses/forgejo-runner/LICENSE
    - name: Reports the packaged release version
      runs: |
        /forgejo-runner --version | grep -q "${{package.version}}"

update:
  enabled: true
  forgejo:
    instance: https://code.forgejo.org
    identifier: forgejo/runner
    strip-prefix: v
