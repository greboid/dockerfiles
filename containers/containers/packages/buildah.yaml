# Source-built Buildah at the legacy custom version (upstream v1.45.1).
#
# Alpine v3.24 ships buildah 1.44.0-r1; the CI image must keep the declared
# newer version, so this recipe deliberately reuses the Alpine package name
# and wins on version comparison wherever both repositories are visible.
# This mirrors the legacy Containerfile: clone v1.45.1, `make bin/buildah`
# with CGO_ENABLED=1. The default Makefile tag set applies: seccomp (needs
# libseccomp-dev), the btrfs driver (kept enabled via btrfs-progs-dev, as in
# the legacy build) and no gpgme tag — the default build does not link
# gpgme, so the gnupg tool stack ships with the alpine-runner image instead
# (it was a plain legacy runtime package there, too).
package:
  name: buildah
  version: 1.45.1
  epoch: 0
  description: Tool for building OCI container images (source-built v1.45.1)
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: Apache-2.0
  dependencies:
    runtime:
      # Non-library runtime needs of the buildah binary. Shared libraries
      # (libseccomp, device-mapper-libs, btrfs-progs-libs, ...) are resolved
      # automatically from the linked ELF dependencies.
      - containers-common=0.64.2-r0
      - fuse-overlayfs=1.16-r0
      - fuse3=3.18.3-r0
      - netavark=1.17.2-r0

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - alpine-release=3.24.2-r0
      # git clone of the source needs CA certificates, not just the p11-kit
      # store (ca-certificates alone failed TLS in this guest).
      - ca-certificates-bundle=20260909-r0
      # golang-builder carries go/gcc/musl-dev/git/patch at /usr/local/go.
      - golang-builder=1.27.1-r0
      # The Makefile's tag-probe scripts (hack/*_tag.sh) have bash shebangs;
      # without bash the btrfs exclude tag would silently flip.
      - bash=5.3.9-r1
      # as/ld/strip compile the embedded mkcw entrypoint.
      - binutils=2.45.1-r1
      - make=4.4.1-r4
      - pkgconf=2.5.1-r0
      - btrfs-progs-dev=6.17.1-r1
      - device-mapper-dev=2.03.35-r3
      - libseccomp-dev=2.6.0-r2
      # Even without the gpgme build tag, containers/image's default cgo
      # path compiles proglottis/gpgme and needs its headers (the legacy
      # build stage installed gpgme-dev for exactly this reason).
      - gpgme-dev=2.0.1-r1
  environment:
    CGO_ENABLED: "1"
    GOTELEMETRY: "off"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c8ac1936bb2e956c1d8790eba1bb3829a1241369
      repository: https://github.com/containers/buildah
      tag: v${{package.version}}
  - name: Build bin/buildah with the pinned /usr/local/go toolchain
    runs: |
      # The melange runner resets PATH: put the custom toolchain on it
      # explicitly instead of relying on environment.environment.PATH.
      export PATH="/usr/local/go/bin:$PATH"
      export GOROOT=/usr/local/go
      make bin/buildah
      install -Dm755 bin/buildah "${{targets.destdir}}/usr/bin/buildah"
  - name: Record the upstream license
    runs: |
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/buildah/LICENSE"

test:
  environment:
    contents:
      keyring:
        - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
      packages:
        - busybox=1.37.0-r31
        - alpine-release=3.24.2-r0
        - ca-certificates-bundle=20260909-r0
        # The test guest otherwise has no /etc/passwd; buildah resolves the
        # current (root) user through it, like in the real CI image.
        - alpine-baselayout
  pipeline:
    - name: Reports the packaged custom version, not Alpine's
      runs: |
        test -x /usr/bin/buildah
        test -s /usr/share/licenses/buildah/LICENSE
        buildah version | grep -q 'Version: *1\.45\.1'
        # Alpine's v3.24 buildah is 1.44.0: this must be our source build.
        ! buildah version | grep -q 'Version: *1\.44'
    - name: fuse-overlayfs mount program is runnable
      runs: |
        # Dependency-closure check only. Melange guests cannot grant what
        # exercising containers for real needs (user namespaces, /dev/fuse,
        # mount capability), so probes of that shape end up testing the
        # guest kernel rather than this package — and fail differently on
        # every runner. Real container behaviour is verified on a
        # privileged host by tooling/test-build-images.sh (buildah
        # bud/from/mount smoke).
        test -x /usr/bin/fuse-overlayfs
        fuse-overlayfs --version

update:
  enabled: true
  github:
    identifier: containers/buildah
    strip-prefix: v
