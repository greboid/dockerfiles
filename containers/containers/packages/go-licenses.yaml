# Shared build tool; installed in melange environments, not application images.
package:
  name: go-licenses
  version: 1.6.0
  epoch: 0
  description: Collect license notices for Go packages and their dependencies
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: Apache-2.0
  dependencies:
    runtime:
      # go-licenses invokes Go to inspect the target module's dependencies.
      - go
      - ca-certificates-bundle
      - busybox-binsh

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - alpine-release=3.24.2-r0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5348b744d0983d85713295ea08a20cca1654a45e
      repository: https://github.com/google/go-licenses
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./
      output: go-licenses
      strip: -s -w
      ldflags: -buildid=
  - runs: |
      # -trimpath removes the compiled-in GOROOT. v1.6.0 otherwise treats
      # every absolute source path as stdlib and silently emits no notices.
      # Resolve GOROOT from the installed Go toolchain before starting it.
      mkdir -p "${{targets.destdir}}/usr/libexec"
      mv "${{targets.destdir}}/usr/bin/go-licenses" "${{targets.destdir}}/usr/libexec/go-licenses"
      cat > "${{targets.destdir}}/usr/bin/go-licenses" <<'EOF'
      #!/bin/sh
      set -eu
      GOROOT="${GOROOT:-$(go env GOROOT)}"
      export GOROOT
      exec /usr/libexec/go-licenses "$@"
      EOF
      chmod 0755 "${{targets.destdir}}/usr/bin/go-licenses"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/go-licenses/LICENSE"

update:
  enabled: true
  # Consumers pin go-licenses exactly, so an update rebuilds them all.
  shared: true
  github:
    identifier: google/go-licenses
    strip-prefix: v
    # Stay on the legacy v1 stream; go-licenses-builder tracks v2.
    tag-filter-prefix: v1.
