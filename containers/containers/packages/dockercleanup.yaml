# Source-built replacement for containers/dockercleanup (upstream v1.0).
package:
  name: dockercleanup
  version: 1.0.0
  epoch: 0
  description: Periodically prunes stopped containers and unused images via the Docker API
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      # Upstream tags "v1.0"; the normalized package version is 1.0.0.
      expected-commit: 1ec067af55569b89c82f3bb4c6a2bb0c5e47bb1b
      repository: https://github.com/greboid/dockercleanup
      tag: v1.0
  - uses: go/build
    with:
      packages: ./
      output: dockercleanup
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint and license notices
    runs: |
      ln -s usr/bin/dockercleanup "${{targets.destdir}}/dockercleanup"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      test -s "${{targets.destdir}}/notices/github.com/greboid/dockercleanup/LICENSE"
      test -s "${{targets.destdir}}/notices/github.com/csmith/envflag/v2/LICENCE"
      test -s "${{targets.destdir}}/notices/github.com/docker/docker/LICENSE"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/dockercleanup/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/dockercleanup
        test -L /dockercleanup
        test -s /notices/github.com/greboid/dockercleanup/LICENSE
        test -s /notices/github.com/docker/docker/LICENSE
        test -s /usr/share/licenses/dockercleanup/LICENSE
    - name: Fails loudly without a Docker daemon
      runs: |
        # With DURATION below one minute it runs a single pass, so a missing
        # daemon surfaces immediately instead of hanging.
        set +e
        out=$(DOCKER_HOST=tcp://127.0.0.1:9 /dockercleanup 2>&1)
        code=$?
        set -e
        test "$code" = 1
        echo "$out" | grep -q "unable to clean perform cleanup"

update:
  enabled: true
  github:
    identifier: greboid/dockercleanup
    strip-prefix: v
