# Source-built replacement for containers/irc-bot (upstream v5.0.8).
package:
  name: irc-bot
  version: 5.0.10
  epoch: 0
  description: Extensible IRC bot with a gRPC plugin interface
  target-architecture:
    - x86_64
  copyright:
    - paths:
        - "*"
      attestation: LICENSE
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata

environment:
  contents:
    keyring:
      - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    packages:
      - busybox=1.37.0-r31
      - ca-certificates
      - git=2.54.0-r0
      - go=1.26.8-r0
      - go-licenses=1.6.0-r0
      - alpine-release=3.24.2-r0
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1e1edc39148f8c2ec8959c61d49e983831481704
      repository: https://github.com/greboid/irc-bot
      tag: v${{package.version}}
  - uses: go/build
    with:
      packages: ./cmd/bot
      output: irc-bot
      strip: -s -w
      ldflags: -extldflags "-static" -buildid=
  - name: Preserve legacy entrypoint and license notices
    runs: |
      ln -s usr/bin/irc-bot "${{targets.destdir}}/irc-bot"
      go-licenses save ./... --save_path="${{targets.destdir}}/notices"
      test -s "${{targets.destdir}}/notices/github.com/greboid/irc-bot/v5/LICENSE"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/irc-bot/LICENSE"

test:
  environment:
    contents:
      repositories:
        - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
      packages:
        - alpine-release=3.24.2-r0
        - busybox
  pipeline:
    - name: Packaged files
      runs: |
        test -x /usr/bin/irc-bot
        test -L /irc-bot
        test -s /notices/github.com/greboid/irc-bot/v5/LICENSE
        test -s /usr/share/licenses/irc-bot/LICENSE
    - name: Refuses to start without a server
      runs: |
        # Fails before any connection attempt; no IRC network is touched.
        if /irc-bot >/tmp/irc-bot.log 2>&1; then
          echo "expected missing-server failure" >&2
          exit 1
        fi
        grep -q "Server is mandatory" /tmp/irc-bot.log

update:
  enabled: true
  # Tags lead the GitHub releases here; the tag is the version signal.
  github:
    identifier: greboid/irc-bot
    strip-prefix: v
    use-tag: true
