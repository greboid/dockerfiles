name: ci

# Commit-driven pipeline: selective fan-out, publish runs as a generated DAG.
#
# Every event re-derives the affected set with tooling/affected.py
# (deterministic: changed files mapped onto the recipe dependency graph): a
# changed recipe selects itself and every recipe that transitively
# build-depends on it; an image is selected when its definition changed or
# any local package it installs is affected; tooling changes select
# everything (melange-side tooling all packages, apko-side all images, oras
# nothing). A base CI cannot anchor to — an empty or all-zeros comparison
# commit, an unknown ref, disjoint histories — selects everything:
# selective builds are only ever an optimization, never a correctness
# input. The selection validates the recipe graph (cycles, duplicate
# providers, name mismatches) and every image definition before anything
# builds.
#
# Jobs:
#
#   plan      runs the offline checks, the version bump check and the
#             selector. On publish runs (push to main, manual dispatch) it
#             then generates the publish DAG with tooling/gen_dag.py — one
#             job per affected package, one per affected image — commits it
#             to a per-run branch (ci/dag-<run_id>) and pushes it; the push
#             triggers the generated workflow, whose needs edges ARE the
#             dependency barrier: a job is dispatched only once everything
#             it consumes has been published by the jobs it needs, so a leg
#             never holds a runner slot while waiting, and a failed leg
#             skips its dependents instantly. The edges cannot live in a
#             committed workflow (needs is resolved at scheduling time over
#             statically-named jobs; the node set is the per-commit
#             affected list), which is why the workflow is generated. On
#             pull requests it emits the fan-out as two JSON matrices
#             (packages, images) through $GITHUB_OUTPUT instead. Empty
#             selections produce empty matrices / no DAG file — nothing to
#             build, nothing runs.
#   packages  pull-request only: one leg per affected package, building
#             the affected closure locally (throwaway key, nothing
#             published, no secrets referenced anywhere).
#   images    pull-request only: one leg per affected image, building each
#             image's local closure and assembling a tarball in the
#             workspace (no artifact service).
#
# Why publish runs do not poll: the previous design awaited published
# dependency APKs from inside each leg. A waiting leg occupied a runner
# slot, so on small runners (capacity 2, observed) every slot ended up
# held by a poller whose producer was still queued — a deadlock that only
# resolved through 30-minute timeouts, cascading one wave at a time. With
# needs edges, Forgejo itself schedules only runnable jobs: a queued
# dependency occupies no slot, a failed dependency skips its dependents
# instead of failing them after a timeout, and publication (verified by
# the round-trip check before the owning job ends) remains the readiness
# signal.
#
# Forgejo queues legs like any task and its runner capacity is the
# concurrency control — nothing here hardcodes a parallelism number. Legs
# re-run individually after partial failures; re-dispatching ci.yml with
# a base re-runs the whole DAG.
#
# The version bump check (tooling/check-bumps.py) is what makes remote
# dependency resolution fresh: DAG jobs wait on exact APK file names
# (name-version-r epoch), so a recipe that changed without bumping version
# or epoch would be indistinguishable from its previous published build.
# Image definitions already pin exact name=version-r epoch; the check
# enforces the discipline at plan time. Comment/formatting-only changes
# are exempt.
#
# Manual dispatch IS the republish path: inputs.base empty (the default)
# selects everything, inputs.scope all/packages/images trims the DAG.
# The version bump check does not apply without a base; recovery caveat:
# rebuilding in place with unchanged versions lets a job resolve the
# previous build — bump epochs when rebuilding because content was wrong.
#
# Credentials: one Forgejo token, RELEASE_PACKAGE_TOKEN, carries both
# scopes this pipeline needs: package write for the generated publish
# DAG's package jobs (the Alpine package API takes a token, not a JWT)
# and repository write for the plan job's branch push and the DAG's
# cleanup job. Registry pushes authenticate with a Forgejo
# Authorized Integration ID token (enable-openid-connect in the generated
# workflow; docker-login mints a JWT for the audience baked into the
# generator) in image jobs. Pull-request jobs reference no secrets at all.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: "Affected-selection base commit; empty selects everything (republish)"
        required: false
        default: ""
        type: string
      scope:
        description: "Which artifact sets to build: all, packages or images"
        required: false
        default: "all"
        type: string

env:
  SHA: ${{ github.sha }}
  # The affected-selection base for every event: manual dispatch passes it
  # explicitly, pull requests diff from their base, pushes from the
  # previous tip. An empty value selects everything.
  BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}

jobs:
  plan:
    runs-on: alpine
    outputs:
      packages: ${{ steps.matrices.outputs.packages }}
      images: ${{ steps.matrices.outputs.images }}
    steps:
      - name: Checkout
        # Full history: affected.py diffs from the merge base with BASE.
        # The action defaults repository/ref/token from the runner context
        # and never persists credentials.
        uses: actions/toolkit/git-checkout@master
        with:
          fetch-depth: '0'

      - name: Install uv and jq (shared tooling scripts)
        # uv runs the shared tooling scripts (BusyBox env cannot exec their
        # `#!/usr/bin/env -S` shebangs); jq compacts the selection into
        # matrix JSON. No bubblewrap: nothing builds in this job.
        run: apk add --no-cache uv jq

      - name: Offline workflow checks
        run: uv run --script tooling/test-release-workflows.py

      - name: Select affected packages and images
        run: |
          set -eu
          uv run --script tooling/affected.py --base "$BASE" --lists-dir dist/affected --explain
          cat dist/affected/packages.txt || true

      - name: Check version bumps
        # DAG jobs wait on exact published file names; a recipe changed
        # without a version or epoch bump would be indistinguishable from
        # its previous build. The check skips itself when BASE is empty
        # (republish) or unusable.
        run: uv run --script tooling/check-bumps.py --base "$BASE" --head "$SHA"

      - name: Generate and push the publish DAG
        if: github.event_name != 'pull_request'
        # The generated workflow is the publish pipeline: one job per
        # affected package, one per affected image, needs edges from the
        # recipe graph (see the generator's docstring for why generation
        # is the only way to encode them). The push to the per-run branch
        # triggers it; nothing affected means no file and nothing to do.
        env:
          RELEASE_PACKAGE_TOKEN: ${{ secrets.RELEASE_PACKAGE_TOKEN }}
          SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          set -eu
          dag_branch="ci/dag-${GITHUB_RUN_ID}"
          uv run --script tooling/gen_dag.py \
            --lists-dir dist/affected \
            --scope "$SCOPE" \
            --sha "$SHA" \
            --branch "$dag_branch" \
            --out .forgejo/workflows/publish-dag.yml
          if [ ! -s .forgejo/workflows/publish-dag.yml ]; then
            echo "nothing affected: no publish DAG to run"
            exit 0
          fi
          git config user.name "ci-dag"
          git config user.email "ci-dag@noreply"
          git add .forgejo/workflows/publish-dag.yml
          git commit -m "publish DAG for ${GITHUB_SHA}"
          git push \
            "https://greboid:${RELEASE_PACKAGE_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}" \
            "HEAD:refs/heads/${dag_branch}"

      - name: Emit matrices
        if: github.event_name == 'pull_request'
        # Pull-request fan-out only; publish runs use the generated DAG.
        id: matrices
        run: |
          set -eu
          echo "packages=$(jq -Rsc 'rtrimstr("\n") | split("\n") | map(select(length > 0)) | {package: .}' dist/affected/packages.txt)" >> "$GITHUB_OUTPUT"
          echo "images=$(jq -Rsc 'rtrimstr("\n") | split("\n") | map(select(length > 0)) | {image: .}' dist/affected/images.txt)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  packages:
    needs: plan
    # Pull-request fan-out; publish runs run the generated DAG instead.
    if: github.event_name == 'pull_request' && inputs.scope != 'images'
    runs-on: alpine
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.packages) }}
      fail-fast: false
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/toolkit/git-checkout@master
        with:
          fetch-depth: '0'

      - name: Install uv and bubblewrap (shared tooling scripts)
        # bubblewrap is melange's default container runner for builds.
        run: apk add --no-cache uv bubblewrap

      - name: Determine affected packages
        # Re-deriving the selection validates the recipe graph again and
        # names the closure this leg builds locally: pull requests resolve
        # everything from dist/ (throwaway key, nothing published).
        run: |
          set -eu
          uv run --script tooling/affected.py --base "$BASE" --lists-dir dist/affected
          cat dist/affected/packages.txt

      - name: Set up Go
        # The job image has no Go toolchain; go-setup installs one into the
        # workspace and exports PATH/GOROOT for the tools build.
        uses: actions/toolkit/go-setup@master
        with:
          go-version: stable

      - name: Build tools
        # Fresh from source at the recorded version, like every run; a
        # package leg only needs melange.
        run: tooling/tools.sh melange

      - name: Generate throwaway signing key
        # Trusted by nothing outside this leg's build and test guests.
        run: |
          set -eu
          mkdir -p keys
          tooling/bin/melange keygen keys/ci.rsa

      - name: Build and test package
        # Pull-request legs build the affected closure locally (nothing is
        # published). Recipes without a test section pass trivially; tests
        # run under bwrap like the builds: the docker runner would
        # bind-mount a workspace under this container's /tmp, a path the
        # daemon cannot see.
        run: |
          set -eu
          uv run --script tooling/single-package.py "$PACKAGE" \
            --key keys/ci.rsa \
            --out-dir dist/release
          tooling/bin/melange test "packages/$PACKAGE.yaml" \
            --arch x86_64 \
            --keyring-append "$PWD/keys/ci.rsa.pub" \
            --repository-append "$PWD/dist/release"

  images:
    needs: plan
    # Pull-request fan-out; publish runs run the generated DAG instead.
    if: github.event_name == 'pull_request' && inputs.scope != 'packages'
    runs-on: alpine
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.images) }}
      fail-fast: false
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/toolkit/git-checkout@master
        with:
          fetch-depth: '0'

      - name: Install uv and bubblewrap (shared tooling scripts)
        run: apk add --no-cache uv bubblewrap

      - name: Determine affected images
        # Validates every image definition and recipe again, and writes the
        # lists this leg's decisions come from: the affected package list
        # and, for this image, its local package closure (image-deps.txt).
        run: |
          set -eu
          uv run --script tooling/affected.py --base "$BASE" --lists-dir dist/affected
          cat dist/affected/images.txt

      - name: Set up Go
        uses: actions/toolkit/go-setup@master
        with:
          go-version: stable

      - name: Build tools
        # Pull-request legs also build closure packages, so melange too.
        run: tooling/tools.sh

      - name: Build image locally (pull-request shape)
        # The plan's closure carries everything apko resolves from the
        # local repository (installed local packages plus their runtime
        # closure); single-package.py plans each package's build
        # dependencies itself and skips anything already in dist/. Nothing
        # is pushed anywhere: the tarball stays in the ephemeral workspace.
        run: |
          set -eu
          while read -r line; do
            image=${line%% *}
            test "$image" = "$IMAGE"
            case "$line" in
              *" "*) deps=${line#* } ;;
              *) deps='' ;;
            esac
            for package in $deps; do
              uv run --script tooling/single-package.py "$package"
            done
            tooling/single-image.sh "$IMAGE"
          done < dist/affected/image-deps.txt
