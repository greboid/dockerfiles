accounts:
  run-as: 0
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

paths:
  - path: /go
    type: directory
    permissions: 0o777
  - path: /go/src
    type: directory
    permissions: 0o777
  - path: /go/bin
    type: directory
    permissions: 0o777

environment:
  LANG: en_US.UTF-8
  HOME: /root
  GOPATH: /go
  PATH: /go/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SOURCE_DATE_EPOCH: "0"
  GOTELEMETRY: "off"
  GOAMD64: v1
  GOFLAGS: -buildvcs=false

cmd: /bin/sh
work-dir: /
