archs:
  - x86_64

contents:
  keyring:
    - keys/packages@f3acd02d7d98309c4ae1d1bf92e58fe2673383ee9b816cb8b0ef8a5eac56c6bc.rsa.pub
    - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026e-r0
    - os-release=3.24.2-r0
    - forgejo-runner=13.2.0-r5
    - buildah=1.45.1-r4
    - fuse-overlay-storage-conf=1.0.0-r0
    - git=2.54.0-r0
    - fuse-overlayfs=1.16-r0
    - gnupg=2.4.9-r1

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

paths:
  - path: /data
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  HOME: /home/nonroot
  CONTAINERS_STORAGE_CONF: /usr/share/fuse-overlay-storage-conf/storage.conf

work-dir: /data

entrypoint:
  command: /usr/bin/forgejo-runner
