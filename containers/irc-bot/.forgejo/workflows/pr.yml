name: build-pr
on:
  pull_request:

jobs:
  build:
    runs-on: alpine
    env:
      ORG_REPO: https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
    steps:
      - name: Checkout
        uses: actions/toolkit/git-checkout@master

      - name: Trust the org repository and install apko
        run: |
          set -eu
          curl -fsSL --retry 3 -o key.rsa.pub "${ORG_REPO%/*/*}/key"
          hash=$(openssl pkey -pubin -in key.rsa.pub -outform DER | sha256sum | cut -d' ' -f1)
          mv key.rsa.pub "/etc/apk/keys/packages@$hash.rsa.pub"
          echo "ORG_KEY=/etc/apk/keys/packages@$hash.rsa.pub" >> "$GITHUB_ENV"
          echo "$ORG_REPO" >> /etc/apk/repositories
          apk update
          apk add --no-cache apko
          apko version

      - name: Build
        run: apko build -k "$ORG_KEY" apko.yaml "irc-bot:pr" image.tar
