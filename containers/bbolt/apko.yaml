archs:
  - x86_64

contents:
  keyring:
    - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
  packages:
    - busybox=1.37.0-r31
    - ca-certificates-bundle=20261020-r4
    - tzdata=2026f-r0
    - os-release=3.24.2-r0
    - bbolt=1.5.0-r4

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

paths:
  - path: /data
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /usr/bin/bbolt
