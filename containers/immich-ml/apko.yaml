archs:
  - x86_64

contents:
  keyring:
    - keys/packages@f3acd02d7d98309c4ae1d1bf92e58fe2673383ee9b816cb8b0ef8a5eac56c6bc.rsa.pub
    - https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
    - https://git.mouse-lake.ts.net/api/packages/packages/alpine/v3.24/main
  packages:
    - ca-certificates-bundle=20260909-r0
    - tzdata=2026e-r0
    - os-release=3.24.2-r0
    - immich-ml=3.2.0-r1

accounts:
  run-as: 65532:65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  groups:
    - groupname: nonroot
      gid: 65532
      members:
        - nonroot

paths:
  - path: /cache
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
    recursive: true

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: /usr/src
  PATH: /opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  DEVICE: cpu
  MACHINE_LEARNING_CACHE_FOLDER: /cache
  TRANSFORMERS_CACHE: /cache
  HF_HOME: /cache/hf-cache
  MACHINE_LEARNING_MODEL_ARENA: "false"
  LD_PRELOAD: /usr/lib/libmimalloc.so.2
  HOME: /home/nonroot

work-dir: /usr/src

entrypoint:
  command: /opt/venv/bin/python -m immich_ml
