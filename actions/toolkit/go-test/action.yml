name: go-test
description: go test step; runs go test over the workspace module's packages (./... by default) in a Go toolchain container, with optional extra flags such as -race
inputs:
  packages:
    description: Space-separated package patterns to test
    default: './...'
  flags:
    description: Extra whitespace-separated go test flags, e.g. -race -count=1
    default: ''
  debug:
    description: Enable debug logging
    default: 'false'
runs:
  using: docker
  image: docker://git.mouse-lake.ts.net/actions/toolkit/go-test:dev
  args:
    - -packages=${{ inputs.packages }}
    - -flags=${{ inputs.flags }}
    - -debug=${{ inputs.debug }}
